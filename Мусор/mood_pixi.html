
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Самочувствие • PixiJS</title>
<style>
  :root{ --bg:#0B1220; --card:#0F172A; --text:#E6EDF3; --muted:#8CA3B0; --border:rgba(255,255,255,.08); }
  *{box-sizing:border-box}
  body{ margin:0; font:16px/1.45 Inter, system-ui, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .wrap{ max-width:900px; margin:0 auto; padding:20px }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 12px 30px rgba(0,0,0,.35) }
  h1{ margin:0 0 12px 0; font-size:22px }
  .grid{ display:grid; grid-template-columns: 1fr auto; gap:16px; align-items:center }
  #stage{ position:relative; width:420px; height:420px; border-radius:20px; overflow:hidden; background: radial-gradient(900px 600px at 50% -30%, rgba(255,255,255,.06), transparent) }
  #gl{ position:absolute; inset:0 }
  .ctrl{ display:grid; gap:12px; justify-items:start }
  input[type=range]{ -webkit-appearance:none; width:300px; height:10px; border-radius:999px; outline:none; background:linear-gradient(90deg, #6ca6ff, #22c55e 50%, #ffa26b) }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid #0004; box-shadow:0 4px 12px rgba(0,0,0,.35) }
  .value{ font-weight:800 }
  .label{ font-weight:800; text-align:center; margin:6px 0 }
  .btn{ padding:12px 16px; border-radius:14px; border:0; font-weight:800; background:linear-gradient(180deg, #17d8c5, #14b8a6); color:#041517; box-shadow:0 8px 20px rgba(20,184,166,.35); cursor:pointer }
</style>
</head>
<body>
<div class="wrap">
  <h1>Оценка самочувствия — PixiJS/WebGL</h1>
  <div class="card grid">
    <div id="stage"><canvas id="gl"></canvas><div id="state" class="label">Нейтрально</div></div>
    <div class="ctrl">
      <div class="value" id="val">50</div>
      <input id="range" type="range" min="0" max="100" value="50" step="1">
      <div style="font-size:12px; color:var(--muted); display:flex; justify-content:space-between; width:300px"><span>Очень плохо</span><span>Очень хорошо</span></div>
      <button class="btn" id="save">Подтвердить</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.0/pixi.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi-filters/5.3.1/filters.min.js"></script>
<script>
const W=420,H=420;
const app = new PIXI.Application({ view: document.getElementById('gl'), width: W, height: H, backgroundAlpha: 0, antialias:true });
const stage = app.stage;

// Glow gradient as background
const bg = new PIXI.Container();
stage.addChild(bg);
function drawGlow(hue=200){
  bg.removeChildren();
  const r = Math.min(W,H)/2;
  const cx=W/2, cy=H/2;
  for(let i=r;i>0;i-=4){
    const t = i/r;
    const alpha = 0.45*(1-t);
    const g = new PIXI.Graphics();
    g.beginFill(PIXI.utils.string2hex(`hsl(${hue},95%,60%)`), alpha);
    g.drawCircle(cx,cy,i);
    g.endFill();
    bg.addChild(g);
  }
}
drawGlow();

// Flower shape (multi-layers)
function createLayer(){
  const g = new PIXI.Graphics();
  stage.addChild(g);
  return g;
}
const layers = [];
for(let i=0;i<6;i++){ layers.push(createLayer()) }

// Pixi Bloom + Blur for soft look
const bloom = new PIXI.filters.AdvancedBloomFilter({ threshold:0.65, bloomScale:1.2, brightness:1.1, blur:5, quality:6 });
const blur = new PIXI.filters.BlurFilter(0.4, 4);
stage.filters = [bloom, blur];

let val = 50, phase=0;
const range = document.getElementById('range');
const label = document.getElementById('state');
const valOut = document.getElementById('val');
function hueFromVal(v){ return 210 + (30-210)*(v/100); }
function txt(v){
  if(v<=10) return 'Очень плохо';
  if(v<=25) return 'Плохо';
  if(v<=40) return 'Слегка неприятно';
  if(v<=60) return 'Нейтрально';
  if(v<=75) return 'Слегка приятно';
  if(v<=90) return 'Хорошо';
  return 'Отлично';
}
function draw(){
  const smooth = val/100;
  const AMP = 0.42 + (1-smooth)*0.38; // радиальная амплитуда (доля от R)
  const PET = 6;
  const BASE = 70;

  const hue = hueFromVal(val);
  drawGlow(hue);

  for(let li=0; li<layers.length; li++){
    const g = layers[li];
    const R = BASE + li*28;
    const a = AMP * (1 - li*0.14);
    const points = 240;
    g.clear();
    g.lineStyle(12 - li*1.6, PIXI.utils.string2hex(`hsl(${hue},85%,${70 - li*6}%)`), 1);
    let first = true;
    for(let i=0;i<=points;i++){
      const t = i/points * Math.PI*2;
      const r = R * (1 + a*Math.sin(PET*t + phase*(0.7 - li*0.06)) * (1 - 0.18*Math.sin(t*0.5 + phase*(0.5 + li*0.03))));
      const x = W/2 + r*Math.cos(t);
      const y = H/2 + r*Math.sin(t);
      if(first){ g.moveTo(x,y); first=false; } else { g.lineTo(x,y); }
    }
    g.closePath();
  }
}
app.ticker.add((dt)=>{ phase += dt/40; draw(); });

range.addEventListener('input', e=>{ val = +e.target.value; valOut.textContent = val; label.textContent = txt(val); });

// save compatibility
const KEY='rt.diary.v1';
const today = new Date().toISOString().slice(0,10);
function loadDB(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {entries:{}} }catch(_){ return {entries:{}} } }
function saveDB(db){ localStorage.setItem(KEY, JSON.stringify(db)); }
function getEntry(date){ const db=loadDB(); return db.entries[date] || { date, wellness:50, sideEffects:{}, face:null, body:null }; }
function putEntry(e){ const db=loadDB(); db.entries[e.date]=e; if(!db.baseline) db.baseline=e.date; saveDB(db); return db; }

document.getElementById('save').addEventListener('click', ()=>{ const e=getEntry(today); e.wellness=Math.round(val); putEntry(e); const btn=document.getElementById('save'); const old=btn.textContent; btn.textContent='Сохранено ✓'; btn.disabled=true; setTimeout(()=>{btn.textContent=old; btn.disabled=false;},1200); });

// Init UI
label.textContent = txt(val); valOut.textContent = val;
</script>
</body>
</html>
