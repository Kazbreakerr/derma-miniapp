<!doctype html>
<html lang="ру">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Roaccutane Tracker — Добро пожаловать</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0B1220; --card:#0F1A2B; --border:#19263A;
      --text-h:#F3F7FF; --text-m:#C7D2FE;
      --accent-from:#22D3EE; --accent-to:#14B8A6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text-h);
      background:
        radial-gradient(120% 80% at 10% -10%, rgba(20,184,166,.14), transparent 60%),
        radial-gradient(110% 80% at 90% 0%, rgba(96,165,250,.14), transparent 60%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Manrope, Roboto, Helvetica, Arial;
      min-height:100dvh; display:grid; place-items:center;
    }
    .shell{
      width:min(1180px,96vw);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:0 30px 80px rgba(0,0,0,.5);
      position:relative;
      padding:32px 40px 88px;
      min-height:62vh;
    }
    h1{ margin:0; font-size:56px; line-height:1.12; font-weight:900; letter-spacing:.2px }
    .lead{ margin:12px 0 0; font-size:20px; color:var(--text-m) }

    /* строка-подсказка над карточками */
   .prompt{
  margin:24px auto 10px; text-align:center; max-width:880px;
  color:#E6F3FF; font-size:20px; font-weight:800; letter-spacing:.2px;
  text-shadow:0 1px 0 rgba(0,0,0,.35);
}
.prompt .badge{
  display:inline-block; margin-top:6px; padding:6px 12px;
  border-radius:999px; border:1px solid var(--border);
  background:rgba(255,255,255,.06);
  color:var(--text-m); font-size:13px; font-weight:900; text-transform:uppercase;
  letter-spacing:.6px;
}

    /* ====== ВЫБОР РОЛИ ====== */
    .cards{
      display:flex; gap:28px; justify-content:center; align-items:stretch;
      flex-wrap:wrap; margin-top:8px;
    }
    .role{
  position:relative; width:min(420px,42vw); max-width:420px; min-width:300px;
  border:1px solid var(--border); border-radius:24px; padding:18px;
  overflow:visible; /* ← позволяем свечению не обрезаться */
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  animation:role-breathe 3.2s ease-in-out infinite;
}
    @keyframes role-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
    .role:hover{transform:translateY(-2px) scale(1.02)}

    /* изображение полностью заполняет область и выравнивает все карточки по высоте */
/* уже есть у тебя: .media-btn — контейнер клика. Важно чтобы overflow:hidden и border-radius были на .media-btn */
.media-btn{
  position:relative; display:block; width:100%; aspect-ratio:3/4;
  border:0; border-radius:25px; padding:0; background:none; cursor:pointer;
  overflow:hidden; appearance:none; -webkit-appearance:none;
}

/* видео ведёт себя как ранее img */
.card-video{
  width:100%; height:100%; display:block; object-fit:cover;
  background:#0000; /* прозр. фон под постером */
}

/* твоя градиентная окантовка — по краю изображения */
.role.selected .media-btn::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  padding:5px;
  background:linear-gradient(135deg,#8AD1FF,#3CC99D 52%,#98FFEA);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}
.role.selected .media-btn::before{
  content:""; position:absolute; inset:-12px; border-radius:inherit;
  background:radial-gradient(45% 65% at 50% 50%, rgba(152,255,234,.28), transparent 70%);
  filter:blur(10px); pointer-events:none;
}



    /* низ: кнопка "Начать" */
   /* контейнер кнопки — под панелью карт, по центру */
.actions{
  display:flex;
  justify-content:center;
  margin:28px 0 0;   /* расстояние от панели карт */
  width:100%;
}

/* крупная кнопка, в синей гамме — не похожа на "Светлая тема" */
.start{
  width:clamp(260px, 40vw, 460px);
  height:64px;
  border:none;
  border-radius:20px;               /* прямоугольные скругления, не «капсула» */
  cursor:pointer;
  font-size:20px;
  font-weight:900;
  letter-spacing:.2px;
  color:#0b1020;
  background:linear-gradient(180deg,#a5fce5 0%, #60faf7 36%, #22d3ee 100%);
  box-shadow:
    0 18px 34px rgba(59,130,246,.28),
    inset 0 3px 0 rgba(255,255,255,.35),
    inset 0 -4px 0 rgba(0,0,0,.25);
  transition:transform .08s ease, filter .12s ease, box-shadow .08s ease;
  position:relative;
}
.start::before{
  content:""; position:absolute; left:10px; right:10px; top:8px; height:48%;
  border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.38), transparent 70%);
  pointer-events:none;
}
.start:hover{ filter:brightness(1.03) }
.start:active{
  transform:translateY(1px) scale(.99);
  box-shadow:
    0 12px 24px rgba(59,130,246,.24),
    inset 0 2px 0 rgba(255,255,255,.28),
    inset 0 -3px 0 rgba(0,0,0,.30);
}

/* на узких экранах — почти во всю ширину */
@media (max-width:560px){
  .start{ width:92vw; }
}


    /* кнопка темы (оставляем как было) */
    .theme-float{ position:absolute; right:24px; bottom:24px }
.theme-float button{
  position:relative; height:48px; padding:0 18px; border-radius:999px; border:none;
  font-weight:900; letter-spacing:.2px; color:#06221f; cursor:pointer;
  background:linear-gradient(180deg, #4ef1e8 0%, #22d3ee 35%, #10b981 100%);
  box-shadow:
    0 14px 28px rgba(16,185,129,.25),   /* падающая тень */
    inset 0 2px 0 rgba(255,255,255,.35),/* верхний кант */
    inset 0 -3px 0 rgba(0,0,0,.28);     /* нижний кант */
  transition:transform .06s ease, filter .12s ease, box-shadow .06s ease;
}
.theme-float button::before{
  content:''; position:absolute; left:8px; right:8px; top:6px; height:50%;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.38), transparent 70%); /* блик */
  pointer-events:none;
}
.theme-float button:hover{ filter:brightness(1.03) }
.theme-float button:active{
  transform:translateY(1px);
  box-shadow:
    0 8px 16px rgba(16,185,129,.22),
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 0 rgba(0,0,0,.35);
}

    @media (max-width:960px){ h1{font-size:40px} .shell{padding:32px 40px 140px;}}

/* ===== Мобильная компоновка как на твоём скрине ===== */

/* чуть компактнее контейнер */
@media (max-width: 720px){
  .shell{ padding:18px 14px 140px;}
}

/* 1) Заголовок и лид занимают меньше строк */
@media (max-width: 720px){
  h1{
    /* нацелен на 2–3 строки на ширинах 360–420 px */
    font-size: clamp(22px, 5.2vw + 2px, 30px);
    line-height: 1.06;
    letter-spacing: .1px;
    margin-bottom: 8px;
    text-wrap: balance;
  }
  .lead{
    font-size: 15.5px;
    line-height: 1.32;
    margin: 6px 0 4px;
  }
}

/* 2) Две карточки в один ряд на телефонах */
@media (max-width: 680px){
  .cards{
    display: grid;
    grid-template-columns: 1fr 1fr;   /* слева / справа */
    gap: 12px;
    padding: 10px;
  }
  .role{
    min-width: 0;          /* снимаем блокирующий min-width */
    width: auto;
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .media-btn{ aspect-ratio: 3/4; border-radius: 12px; }
  .role.selected .media-btn::after{ padding: 3px; }
  .role.selected .media-btn::before{ inset: -8px; filter: blur(8px); }
}

/* 3) На очень узких экранах — ещё компактнее */
@media (max-width: 380px){
  .cards{ gap: 10px; padding: 8px; }
  h1{ font-size: clamp(20px, 6.5vw, 26px); }
  .lead{ font-size: 14.5px; }
}

/* Фикс: на телефонах ВСЕГДА две карточки рядом */
@media (max-width: 820px){                       /* брейкпоинт с запасом */
  .shell{ padding-left:12px; padding-right:12px; }/* пару пикселей вернём из паддингов */

  .cards{
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 10px; row-gap: 10px;
    padding: 8px;
  }

  .role{
    min-width: 0 !important;                     /* гасим 300px из базового правила */
    width: 100% !important;
    padding: 6px;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .media-btn{ aspect-ratio: 3/4; border-radius: 12px; }
  .role.selected .media-btn::after{ padding: 2px; }
  .role.selected .media-btn::before{ inset:-6px; filter: blur(7px); }

  /* заголовок/лид компактнее, чтобы над картами не «съедать» высоту */
  h1{ font-size: clamp(22px, 5.5vw, 28px); line-height:1.08; margin-bottom:6px; }
  .lead{ font-size: 14.5px; line-height:1.3; margin:6px 0 4px; }
}
/* Центровка приветственного блока */
.hero{
  max-width: 880px;
  margin: 0 auto 8px;
  text-align: center;
}

/* Карточка для описания (лида) с градиентной рамкой */
.lead-card{
  position: relative;
  margin: 12px auto 0;
  padding: 12px 16px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
  border: 1px solid var(--border);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 10px 30px rgba(0,0,0,.26);
}
.lead-card::after{
  content:"";
  position:absolute; inset:0; border-radius:inherit; padding:1px;
  background: linear-gradient(135deg, rgba(138,209,255,.6), rgba(60,201,157,.6) 52%, rgba(152,255,234,.6));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events:none;
}

/* Текст лида компактнее и ровнее по межстрочным */
.lead{
  margin: 0;
  color: var(--text-m);
  font-size: clamp(14px, 1.9vw, 18px);
  line-height: 1.4;
  text-wrap: balance;
}

/* На телефонах — чуть компактнее отступы; кнопка строго по центру */
@media (max-width: 720px){
  .hero{ margin-bottom: 6px; }
  .lead-card{ padding: 10px 12px; }
  .actions{
    position: static;
    margin: 16px auto 0;
    justify-content: center;
    width: 100%;
  }
  .start{ width: 88vw; } /* широкая, но не на всю */
}

/* аккуратнее в тёмной теме: более глубокая заливка и мягкая тень */
.start{
  width: clamp(280px, 42vw, 480px);
  height: 62px;
  border-radius: 18px;
  background:
    linear-gradient(180deg, #7ee8f4 0%, #45c7f6 48%, #22d3ee 100%);
  color: #06121a;
  box-shadow:
    0 18px 36px rgba(26,84,128,.32),
    inset 0 3px 0 rgba(255,255,255,.35),
    inset 0 -4px 0 rgba(0,0,0,.25);
}
.start::before{
  content:"";
  position:absolute; left:10px; right:10px; top:7px; height:46%;
  border-radius:14px;
  background:linear-gradient(180deg, rgba(255,255,255,.38), transparent 70%);
  pointer-events:none;
}
.start:hover{ filter:brightness(1.03) }
.start:active{
  transform: translateY(1px) scale(.99);
  box-shadow:
    0 12px 24px rgba(26,84,128,.28),
    inset 0 2px 0 rgba(255,255,255,.28),
    inset 0 -3px 0 rgba(0,0,0,.30);
}

/* Кнопка темы закреплена у низа экрана, с учётом safe-area */
.theme-float{
  position: fixed;                 /* было absolute */
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 50;                     /* поверх фона, но не мешает контенту */
}

.theme-float button{
  height: 40px;
  padding: 0 14px;
  font-size: 14px;
  border: none;
  border-radius: 999px;
  font-weight: 900;
  letter-spacing: .2px;
  color:#06221f;
  background: linear-gradient(180deg, #4ef1e8 0%, #22d3ee 35%, #10b981 100%);
  box-shadow:
    0 10px 20px rgba(16,185,129,.22),
    inset 0 2px 0 rgba(255,255,255,.30),
    inset 0 -2px 0 rgba(0,0,0,.30);
  transition: transform .06s ease, filter .12s ease, box-shadow .06s ease;
}
.theme-float button::before{
  content:''; position:absolute; left:8px; right:8px; top:5px; height:48%;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.38), transparent 70%);
  pointer-events:none;
}
.theme-float button:hover{ filter:brightness(1.03) }
.theme-float button:active{
  transform:translateY(1px);
  box-shadow:
    0 8px 16px rgba(16,185,129,.20),
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -2px 0 rgba(0,0,0,.35);
}



  </style>
</head>
<body>
 <div class="hero">
  <h1>Добро пожаловать в Roaccutane Tracker</h1>

  <div class="lead-card">
    <p class="lead">
      Поможем аккуратно пройти курс: фиксируйте дозы, следите за прогрессом и не пропускайте приём.
    </p>
  </div>
</div>

    <div class="prompt">
  <strong>Вы используете приложение от лица пациента или врача?</strong><br>
  <span class="badge">Выберите роль</span>

  <div class="actions">
      <button class="start" id="startBtn">Начать</button>
    </div>
</div>
    <div class="cards" role="radiogroup" aria-label="Выбор роли">
  <!-- Врач -->
<article class="role" data-role="doctor" role="radio" aria-checked="false" tabindex="0">
  <button class="media-btn" data-role="doctor"
          aria-label="Выбрать: Врач"
          style="--poster:url('./doctor-card.png')">
    <video class="card-video"
           playsinline muted loop preload="metadata"
           poster="./doctor-card.png">
      <source src="./doctor-card.mp4" type="video/mp4">
    </video>
  </button>
</article>

<!-- Пациент -->
<article class="role" data-role="patient" role="radio" aria-checked="true" tabindex="0">
  <button class="media-btn" data-role="patient"
          aria-label="Выбрать: Пациент"
          style="--poster:url('./patient-card.png')">
    <video class="card-video"
           playsinline muted loop preload="metadata"
           poster="./patient-card.png">
      <source src="./patient-card.mp4" type="video/mp4">
    </video>
  </button>
</article>



    

    <div class="theme-float"><button id="themeToggle">🌤 Светлая тема</button></div>
  </section>

  <script>
  const qs = location.search || '';
  let role = localStorage.getItem('rt_role') || 'patient';

  function paintRole(){
    document.querySelectorAll('.role').forEach(el=>{
      const on = el.dataset.role === role;
      el.classList.toggle('selected', on);
      el.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    try{ localStorage.setItem('rt_role', role); }catch(_){}
  }
  paintRole();

  // Запустить видео у выбранной карточки, остальные остановить
  function playFor(role){
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.card-video').forEach(v=>{
      const isThis = v.closest('.role')?.dataset.role === role;
      if(isThis && !prefersReduced){
        // подтягиваем данные только при необходимости
        try{ v.preload = 'auto'; }catch(_){}
        v.muted = true; // для надёжного автозапуска
        const p = v.play();
        if (p && p.catch) p.catch(()=>{}); // игнорируем блокировки
      } else {
        v.pause();
        try{ v.currentTime = 0; }catch(_){}
        // вернуть постер
        v.load(); // сбрасывает на poster (работает с preload=none/metadata)
      }
    });
  }

  // Клик только по изображению (кнопке)
  document.querySelector('.cards').addEventListener('click',(e)=>{
    const btn = e.target.closest('.media-btn');
    if(!btn) return;
    role = btn.dataset.role;            // выбираем роль
    paintRole();                        // визуально подсвечиваем
    playFor(role);                      // запускаем видео только у выбранной
  });

  // Клавиатура на картинке
  document.querySelectorAll('.media-btn').forEach(b=>{
    b.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); }
    });
  });

  // Переход по кнопке "Начать"
  document.getElementById('startBtn')?.addEventListener('click', ()=>{
    if(role==='doctor'){
      const next = (localStorage.getItem('rt_doctor_done')==='1')
        ? 'doctor-cabinet-mint-rose.html'
        : 'doctor-onboarding-mint-rose.html';
      location.replace('./'+next+qs);
    }else{
      const next = (localStorage.getItem('rt_patient_done')==='1')
        ? 'main-dark.html'
        : 'profile-dark.html';
      location.replace('./'+next+qs);
    }
  });

  // (опционально) предпросмотр на десктопе: hover запускает, но при уходе — стоп
  if (matchMedia('(pointer:fine)').matches) {
    document.querySelectorAll('.media-btn').forEach(btn=>{
      const v = btn.querySelector('.card-video');
      btn.addEventListener('mouseenter', ()=>{ if(v && btn.dataset.role!==role){ v.muted=true; v.play().catch(()=>{}); }});
      btn.addEventListener('mouseleave', ()=>{ if(v && btn.dataset.role!==role){ v.pause(); v.currentTime=0; v.load(); }});
    });
  }
</script>

</body>
</html>
