<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roaccutane Tracker — загрузка</title>

  <!-- Telegram SDK (нужен только чтобы взять colorScheme) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ===== СКОП: только экран загрузки ===== */
    #rt-loader{
      /* DARK по умолчанию */
      --bg:#0B1220; --card:#101a2a; --border:#1F2A3C;
      --text:#E8F0FF; --muted:#9fb3d6;
      --accentA:#60A5FA; --accentB:#14B8A6;
      --glowA: rgba(96,165,250,.18);
      --glowB: rgba(20,184,166,.18);
      --card-grad-from:#0e1726; --card-grad-to:#0c1422;
      --ring: rgba(94,234,212,.35);
      --track: rgba(255,255,255,.12);
      --stroke: rgba(255,255,255,.65);

      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height:100dvh; min-height:100svh;
      background:
        radial-gradient(100% 60% at 20% 0%, var(--glowB), transparent 60%),
        radial-gradient(100% 60% at 80% 10%, var(--glowA), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Manrope,Helvetica,Arial;
    }
    /* LIGHT — персик + лаванда */
    #rt-loader[data-scheme="light"]{
      --bg:#FFF9FD; --card:#FFFFFF; --border:#F0E7FF;
      --text:#1f2937; --muted:#6b7280;
      --accentA:#C4A1FF; --accentB:#FFB199;
      --glowA: rgba(196,161,255,.22);
      --glowB: rgba(255,177,153,.25);
      --card-grad-from:#FFFFFF; --card-grad-to:#F7F3FF;
      --ring: rgba(196,161,255,.35);
      --track: rgba(0,0,0,.10);
      --stroke: rgba(0,0,0,.35);
    }
    #rt-loader .box{ width:min(680px,92vw); background:linear-gradient(180deg,var(--card-grad-from),var(--card-grad-to));
      border:1px solid var(--border); border-radius:20px; padding:clamp(16px,3.2vw,24px) clamp(14px,3vw,22px);
      box-shadow:0 18px 48px rgba(0,0,0,.35); position:relative; overflow:hidden }
    #rt-loader .glow{position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(120% 80% at 10% 0%, var(--glowB), transparent 55%),
                 radial-gradient(120% 80% at 90% 20%, var(--glowA), transparent 65%)}
    #rt-loader .row{display:flex; align-items:center; gap:clamp(12px,3vw,16px)}
    #rt-loader h1{margin:0 0 6px; font-weight:800; letter-spacing:.2px; font-size:clamp(20px,6vw,28px); line-height:1.1}
    #rt-loader p{margin:0; color:var(--muted); font-size:clamp(13px,3.6vw,16px)}

    #rt-loader .stage{ width:clamp(44px,10vw,54px); height:clamp(44px,10vw,54px);
      border-radius:14px; display:grid; place-items:center;
      background:linear-gradient(160deg,var(--card-grad-from),var(--card-grad-to));
      border:1px solid var(--border); position:relative }
    #rt-loader .pill{ width:clamp(36px,8.5vw,44px); height:clamp(16px,3.6vw,20px); animation:bob 1.2s ease-in-out infinite }
    #rt-loader .pill .l{ fill:#fff } .pill .r{ fill: var(--accentB) }
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

    #rt-loader .ring{ position:absolute; width:clamp(50px,12vw,64px); height:clamp(50px,12vw,64px);
      border-radius:999px; pointer-events:none; border:3px solid var(--ring); animation:ripple 1.6s ease-out infinite }
    @keyframes ripple{0%{transform:scale(.8);opacity:.8}80%{transform:scale(1.12);opacity:.08}100%{opacity:0}}

    #rt-loader .bar-wrap{ height:3px; background:var(--track); border-radius:999px; margin-top:12px; overflow:hidden }
    #rt-loader .bar{ height:100%; width:30%; background:linear-gradient(90deg,var(--accentA),var(--accentB)); animation:flow 1.6s ease-in-out infinite }
    @keyframes flow{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

    @media (max-width:360px), (max-height:540px){ #rt-loader .box{ border-radius:16px } }
    @media (prefers-reduced-motion:reduce){ #rt-loader .pill, #rt-loader .ring, #rt-loader .bar{ animation:none } }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="rt-loader" data-scheme="dark">
    <div class="box" role="status" aria-live="polite">
      <div class="glow"></div>
      <div class="row">
        <div class="stage" aria-hidden="true">
          <div class="ring"></div>
          <svg class="pill" viewBox="0 0 200 86" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="c"><rect x="0" y="0" rx="43" ry="43" width="200" height="86"/></clipPath></defs>
            <g clip-path="url(#c)">
              <rect class="l" x="0" y="0" width="100" height="86"/>
              <rect class="r" x="100" y="0" width="100" height="86"/>
              <rect x="94" y="0" width="12" height="86" fill="#0E1726" opacity=".45"/>
            </g>
            <rect x="0" y="0" rx="43" ry="43" width="200" height="86" fill="none"
                  stroke="rgba(255,255,255,.65)" stroke-width="2"/>
          </svg>
        </div>
        <div style="flex:1; min-width:220px">
          <h1>Roaccutane Tracker</h1>
          <p>Загружаю и перенаправляю…</p>
          <div class="bar-wrap"><div class="bar"></div></div>
        </div>
      </div>
    </div>
  </div>

<script>
// ===================== START ROUTER =====================
(function startRouter(){
  var isFile = location.protocol === 'file:';
  var qs = location.search || '';
  var sp = new URLSearchParams(qs);

  function lsSeen(){
    try{
      var ls  = localStorage;
      var uid = new URLSearchParams(location.search).get('tg')
               || (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.id) || '';
      if (uid){
        return ls.getItem('dermaApp:'+uid+':splash_seen') === '1';
      }
      return ls.getItem('derma_splash_seen') === '1';
    }catch(_){}
    return false;
  }

  function go(rel){
    if (!qs) { location.replace(rel); return; }
    var q = qs.replace(/^\?/, '');            // убираем ведущий ?
    var sep = rel.includes('?') ? '&' : '?';  // выбираем разделитель
    location.replace(rel + sep + q);
  }

  async function serverDecide(){
    try{
      var init = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
      var r = await fetch('api/state/next/index' + (qs || ''), {
        headers: init ? { 'X-Telegram-InitData': init } : {}
      });
      if (!r.ok) throw 0;
      var j = await r.json();
      var page = (j && j.page) ? j.page : './dark/welcome-rt.html';
      var rel = page.indexOf('/dark/') === 0 ? ('.' + page) : page;
      go(rel);
      return true;
    }catch(_){ return false; }
  }

  (async function decide(){
    // 1) Принудительный сплэш (для тестов)
    if (sp.get('forceSplash') === '1'){
      go('./dark/splash-video.html?next=welcome-rt.html');
      return;
    }

    // 2) Если есть выбранная роль в localStorage — пробуем зайти сразу в main/cabinet
    try{
      var roleLS = (localStorage.getItem('rt_role') || '').toLowerCase();
      if (roleLS){
        var tgInit = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.id;
        var uid    = sp.get('tg') || tgInit || '';

        if (roleLS === 'doctor'){
          // врач считается готовым, если онбординг врача завершён
          var docDone = uid
            ? (localStorage.getItem('dermaApp:'+uid+':doctor_done') === '1')
            : (localStorage.getItem('rt_doctor_done') === '1' || localStorage.getItem('doctorOnboardingDone') === '1');

          if (docDone) { go('./dark/doctor-cabinet-mint-rose.html'); return; }

          // онбординг не закончен → welcome (через сплэш, если ещё не видели)
          if (lsSeen()) go('./dark/welcome-rt.html');
          else          go('./dark/splash-video.html?next=welcome-rt.html');
          return;
        }

        // ===== Пациент =====
        // пациент готов, если есть согласие + вес + план (хватает локальных флагов)
        var consented = (uid
          ? localStorage.getItem('dermaApp:'+uid+':consentAccepted') === '1'
          : localStorage.getItem('derma_consent') === '1');

        var weight = Number(
          (uid && localStorage.getItem('dermaApp:'+uid+':weight_kg')) ||
          localStorage.getItem('rt.weight_kg') ||
          localStorage.getItem('weight_kg') || 0
        );

        var planReady = !!(
          (uid && localStorage.getItem('dermaApp:'+uid+':plan_start')) ||
          localStorage.getItem('rt_startISO') ||
          localStorage.getItem('plan_start') ||
          (localStorage.getItem('rt_plan_done') === '1')
        );

        if (consented && weight > 0 && planReady){
          // прошлый раз был на любой пациентской странице → всегда в main
          go('./dark/main.html');
          return;
        }

        // онбординг не закончен → welcome (через сплэш, если ещё не видели)
        if (lsSeen()) go('./dark/welcome-rt.html');
        else          go('./dark/splash-video.html?next=welcome-rt.html');
        return;
      }
    }catch(_){}

    // 3) Фолбэк, если роли нет или что-то пошло не так
    if (isFile){
      if (lsSeen()) go('./dark/welcome-rt.html');
      else          go('./dark/splash-video.html?next=welcome-rt.html');
      return;
    }
    var ok = await serverDecide();
    if (ok) return;
    if (lsSeen()) go('./dark/welcome-rt.html');
    else          go('./dark/splash-video.html?next=welcome-rt.html');
  })(); // <-- закрываем decide()
})();   // <-- закрываем startRouter()
// ===================== END ROUTER =====================
</script>
</body>
</html>
