<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Roaccutane Tracker — Добро пожаловать (Light)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#F8FAFB; --card:#FFFFFF; --border:#E6EAF0;
      --text-h:#0F172A; --text-m:#334155;
      --accent-from:#22D3EE; --accent-to:#10B981;
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text-h);
      background:
        radial-gradient(120% 80% at 10% -10%, rgba(142,240,195,.30), transparent 60%),
        radial-gradient(110% 80% at 90% 0%, rgba(247,164,197,.28), transparent 60%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Manrope, Roboto, Helvetica, Arial;
      min-height:100dvh; display:grid; place-items:center;
    }
    .shell{
      width:min(1180px, 96vw);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:0 24px 64px rgba(16,24,40,.12);
      position:relative;
      padding:32px 40px 88px;
      min-height:62vh;
    }
    .chip{ position:absolute; right:20px; top:20px; background:#fff; border:1px solid var(--border); color:#64748B; border-radius:999px; padding:8px 12px; font-weight:700; font-size:13px; box-shadow:0 8px 18px rgba(16,24,40,.06) }
    h1{ margin:0; font-size:56px; line-height:1.12; font-weight:900; letter-spacing:.2px }
    .lead{ margin:12px 0 0; font-size:20px; color:var(--text-m) }
    .theme-float{ position:absolute; right:24px; bottom:24px }
    .theme-float button{ height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--border); font-weight:800; color:#fff; background:linear-gradient(135deg, #0f172a, #0b1220); }
    @media (max-width: 960px){ h1{ font-size:40px } .shell{ padding:24px 20px 80px } }
  </style>
</head>
<body>
  <section class="shell" aria-label="Добро пожаловать">
    <span class="chip">TG WebApp готов</span>
    <h1>Добро пожаловать в Roaccutane Tracker</h1>
    <p class="lead">Лёгкая версия: светлая тема с зелёно-розовым градиентом. Фиксируйте дозы, следите за прогрессом и не пропускайте приём.</p>

    <div aria-hidden="true" style="height:calc(100% - 140px)"></div>

    <div class="theme-float"><button id="themeToggle">🌙 Тёмная тема</button></div>
  </section>

  <script>
    const qs = location.search || '';
    const tg = window.Telegram?.WebApp || null; tg?.ready?.(); tg?.expand?.();
    document.getElementById('themeToggle').addEventListener('click', ()=>{
      try{ localStorage.setItem('rt_theme','dark'); }catch(_){}
      location.replace('./welcome-rt-empty.html' + qs);
    });
  </script>
</body>
</html>
