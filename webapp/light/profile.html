  <script src="js/app-state.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const settings = (window.AppState?.get('settings')) || {};
    const cur = document.documentElement.dataset.theme   // что уже выставили в <head>
               || localStorage.getItem('rt_theme') 
               || 'light';
    const theme = (settings.theme === 'light' || settings.theme === 'dark') ? settings.theme : cur;
    document.documentElement.dataset.theme = theme;

    // тумблеры
    document.querySelectorAll('[data-role="theme-switch"]').forEach(sw => {
      const isLight = (document.documentElement.dataset.theme === 'light');
      sw.setAttribute('aria-pressed', isLight ? 'true' : 'false');

      sw.addEventListener('click', () => {
        const cur = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
        const next = (cur === 'light') ? 'dark' : 'light';
        AppState.applyTheme(next); // пишет в rt.settings и rt_theme + ставит data-theme
        document.querySelectorAll('[data-role="theme-switch"]')
          .forEach(x => x.setAttribute('aria-pressed', next === 'light' ? 'true' : 'false'));
      });
    });
  });
</script>

  <style>
    /* ===== Палитры через CSS-переменные ===== */
    :root{
      /* Тёмная — оставляем для совместимости со свитчем темы */
      --bg:#0B1220; --surface:#0E1726; --card:#121C2E; --border:#1F2A3C;
      --primary:#14B8A6; --primary-700:#0EA5A6; --primary-300:#5EEAD4;
      --info:#60A5FA; --success:#22C55E; --warning:#F59E0B; --danger:#EF4444;
      --text-high:#F3F7FF; --text-mid:#C7D2FE; --text-low:#93A3BF; --focus-ring:#93C5FD;
      --ring-shadow: rgba(0,0,0,.25);
      --chip-bg: #0f1a2b;
      --chip-br: #2a3a52;
    }
    /* Светлая тема — основная для этой страницы */
    [data-theme="light"]{
      --bg:#F9FBFF;
      --surface:#FFFFFF;
      --card:#FFFFFF;
      --border:#E7ECF5;
      --primary:#14B8A6;
      --primary-700:#0EA5A6;
      --primary-300:#5EEAD4;
      --info:#2563EB;
      --success:#16A34A;
      --warning:#D97706;
      --danger:#DC2626;
      --text-high:#0B1220;
      --text-mid:#354562;
      --text-low:#6B778C;
      --focus-ring:#A7F3D0;
      --ring-shadow: rgba(17, 24, 39, .08);
      --chip-bg: #FFF2EA;
      --chip-br: #FFDCCB;
      --neo-dark: rgba(26, 31, 44, .10);
      --neo-light: rgba(255, 255, 255, .9);
      --neo-tint: rgba(208, 189, 255, .25);
    }

    *{box-sizing:border-box}
    html,html[data-theme="light"] body{height:100%}
    body{
      margin:0;color:var(--text-high);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Manrope,Helvetica,Arial;
      font-size:16px;line-height:1.5;
      /* Бесшовный мягкий градиент без полос + фиксированное полотно */
      background:
        radial-gradient(1200px 900px at 0% 0%, rgba(255, 214, 186, .55) 0%, rgba(255, 214, 186, 0) 70%),
        radial-gradient(1400px 1000px at 100% 0%, rgba(220, 206, 255, .55) 0%, rgba(220, 206, 255, 0) 72%),
        radial-gradient(1200px 900px at 100% 100%, rgba(186, 243, 210, .45) 0%, rgba(186, 243, 210, 0) 72%),
        linear-gradient(180deg, #FAFEFF 0%, #FFF7F3 48%, #F8F1FF 100%);
      background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
      background-attachment:fixed,fixed,fixed,fixed;
      background-size:auto,auto,auto,auto;
    }
    html[data-theme="dark"] body{
      margin:0;color:var(--text-high);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Manrope,Helvetica,Arial;
      font-size:16px;line-height:1.5;
      background: radial-gradient(140% 120% at 10% -10%, rgba(20,184,166,.08) 0%, rgba(11,18,32,0) 55%),
                  radial-gradient(120% 120% at 100% 0%, rgba(96,165,250,.08) 0%, rgba(11,18,32,0) 55%),
                  linear-gradient(180deg, #0B1220 0%, #0E1726 100%);
      background-attachment:fixed;
    }
    .wrap{max-width:900px;margin:0 auto;padding:24px 24px 40px}
    h1{font-size:28px;line-height:34px;margin:0 0 16px;font-weight:700}

    .card{
      position:relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.94) 0%, rgba(255,248,244,.94) 38%, rgba(248,246,255,.96) 100%),
        radial-gradient(120% 100% at 0% 100%, rgba(255, 214, 186, .22) 0%, rgba(255, 214, 186, 0) 55%),
        radial-gradient(120% 100% at 100% 0%, rgba(222, 210, 255, .20) 0%, rgba(222, 210, 255, 0) 55%);
      border:1px solid rgba(10,16,28,.06);
      border-radius:20px;
      padding:26px;
      /* Неоморфный объём */
      box-shadow:
        10px 14px 28px var(--neo-dark),
        -10px -10px 28px var(--neo-light),
        inset 0 0 0 0 rgba(0,0,0,0);
      overflow:hidden;
      transform:translateY(2px) scale(.985);
      opacity:0;
      animation:pop .18s ease-out forwards;
      backdrop-filter:saturate(115%);
    }
    @keyframes pop {to{transform:scale(1);opacity:1}}

    /* Мягкое внутреннее свечение карточки: персик + лаванда */
    .glow{position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(60% 80% at 10% 0%, rgba(255, 216, 197, .45) 0%, rgba(255,216,197,0) 55%),
        radial-gradient(70% 70% at 100% 10%, rgba(222, 210, 255, .35) 0%, rgba(222,210,255,0) 60%);
    }

    .title{display:flex;align-items:center;gap:14px;margin-bottom:14px}
    .title h2{font-size:22px;line-height:28px;margin:0;font-weight:700}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .muted{color:var(--text-low)}

    .avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;
            background:var(--surface);border:1px solid var(--border);color:var(--text-mid);overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}

    label{display:inline-flex;gap:8px;align-items:center}
    .field{display:flex;flex-direction:column;gap:6px}
    .inline{display:flex;gap:12px;flex-wrap:wrap}

    input[type="number"],input[type="date"],input[type="text"],select{
      background:linear-gradient(180deg, #FFFFFF 0%, #FBFBFF 100%);
      border:1px solid rgba(10,16,28,.06);
      color:var(--text-high);
      border-radius:14px;
      padding:12px 14px;
      font-size:16px;line-height:24px; font-variant-numeric: tabular-nums;
      outline: none;
      box-shadow:
        inset 6px 6px 12px rgba(13, 23, 39, 0.06),
        inset -6px -6px 12px rgba(255,255,255,.9),
        0 1px 0 rgba(255,255,255,.7);
    }
    input:focus,select:focus,textarea:focus{border-color:var(--primary-700);box-shadow:0 0 0 3px var(--focus-ring)}

    .checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:4px}

    .cta{
      height:50px;padding:0 26px;border-radius:999px;border:0;cursor:pointer;
      font-weight:800;letter-spacing:.2px;
      color:#ffffff;
      background-image:linear-gradient(135deg,#5EEAD4 0%, #A78BFA 55%, #FBCFE8 100%);
      box-shadow:
        0 10px 20px rgba(167, 139, 250, .30),
        0 4px 10px rgba(20, 184, 166, .25),
        inset 0 1px 0 rgba(255,255,255,.6);
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .cta:hover{ transform:translateY(-1px); filter:saturate(1.05); box-shadow:
        0 16px 28px rgba(167, 139, 250, .34),
        0 8px 14px rgba(20, 184, 166, .28),
        inset 0 1px 0 rgba(255,255,255,.7); }
    .cta:active{ transform:translateY(0); box-shadow:
        0 6px 12px rgba(167, 139, 250, .28),
        0 3px 6px rgba(20, 184, 166, .25),
        inset 0 2px 6px rgba(0,0,0,.12); }
    .cta:disabled{opacity:.6; filter:grayscale(.15); cursor:not-allowed}
    .cta:disabled{opacity:.5;background-image:none;background:#E9EEF6;cursor:not-allowed;color:#98A4B7}

    footer{margin:24px 0 8px;color:var(--text-low);text-align:center;font-size:13px}

    .badge{
      display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;
      border:1px solid var(--chip-br);color:var(--text-mid);
      background:linear-gradient(180deg, #FFF7F2 0%, #FFF 60%);
      box-shadow: inset 2px 2px 6px rgba(255,255,255,.9), inset -2px -2px 6px rgba(0,0,0,.04);
    }

    /* Back button */
    .backbar{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
    .back{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:14px;border:0;cursor:pointer;
      color:var(--text-high);
      background:linear-gradient(180deg,#FFFFFF 0%, #F5F7FF 100%);
      box-shadow: 6px 6px 14px var(--neo-dark), -6px -6px 14px var(--neo-light);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .back:hover{ transform:translateY(-1px); box-shadow:10px 10px 22px var(--neo-dark), -10px -10px 22px var(--neo-light); }
    .back:hover{box-shadow:0 2px 10px var(--ring-shadow)}
  
    /* Супертонкий «шум» поверх градиента, чтобы убрать полосы на всех экранах */
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.06'/></svg>");
      mix-blend-mode:overlay;
      opacity:.04;
    }

    /* Чуть более мягкие края внутреннего свечения карточки */
    /* Нежный шум внутри карточки, чтобы градиент был «живым» и без полос */
    .card::after{
      content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.05'/></svg>");
      mix-blend-mode:overlay; opacity:.03;
    }

    .glow{background:
        radial-gradient(65% 85% at 10% 0%, rgba(255, 216, 197, .35) 0%, rgba(255,216,197,0) 70%),
        radial-gradient(75% 75% at 100% 10%, rgba(222, 210, 255, .28) 0%, rgba(222,210,255,0) 72%);
    }
  
    /* === Тактильные круглые 3D-чекбоксы для аллергий === */
    .checklist label{ gap:10px; }
    input[type="checkbox"]{
      -webkit-appearance:none; appearance:none;
      inline-size:22px; block-size:22px;
      border-radius:50%;
      background: linear-gradient(180deg,#FFFFFF 0%,#F6F8FF 100%);
      border:1px solid rgba(10,16,28,.08);
      box-shadow:
        3px 4px 10px rgba(13, 23, 39, 0.08),
        -3px -3px 10px rgba(255,255,255,.9);
      display:inline-grid; place-items:center;
      position:relative;
      transition: transform .12s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease, filter .2s ease;
    }
    /* галочка */
    input[type="checkbox"]::after{
      content:"";
      width:10px; height:6px;
      border:2px solid transparent;
      border-right-color:#fff; border-bottom-color:#fff;
      transform:rotate(45deg) scale(0);
      transform-origin: center;
      transition: transform .18s ease;
    }
    input[type="checkbox"]:hover{ filter:saturate(1.05); box-shadow:
        6px 8px 16px rgba(13, 23, 39, 0.09),
        -6px -6px 16px rgba(255,255,255, .95); }
    input[type="checkbox"]:active{ transform: translateY(1px); }

    input[type="checkbox"]:checked{
      background-image:linear-gradient(135deg,#5EEAD4 0%, #60A5FA 50%, #A78BFA 100%);
      border-color: rgba(96,165,250,.55);
      box-shadow:
        2px 4px 10px rgba(96, 165, 250, .35),
        -2px -2px 8px rgba(255,255,255,.9),
        inset 2px 2px 6px rgba(0,0,0,.12);
    }
    input[type="checkbox"]:checked::after{ transform:rotate(45deg) scale(1); }

    input[type="checkbox"]:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 4px rgba(167,139,250,.25),
        3px 4px 10px rgba(13, 23, 39, 0.08),
        -3px -3px 10px rgba(255,255,255,.9);
    }

  
    /* === Неоморфные круглые радиокнопки (Пол) === */
    .inline label{ gap:10px; }
    input[type="radio"]{
      -webkit-appearance:none; appearance:none;
      inline-size:22px; block-size:22px;
      border-radius:50%;
      background: linear-gradient(180deg,#FFFFFF 0%,#F6F8FF 100%);
      border:1px solid rgba(10,16,28,.08);
      box-shadow:
        3px 4px 10px rgba(13, 23, 39, 0.08),
        -3px -3px 10px rgba(255,255,255,.9);
      position:relative; display:inline-grid; place-items:center;
      transition: transform .12s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
    }
    input[type="radio"]::after{
      content:"";
      width:10px; height:10px; border-radius:50%;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(255,255,255,.4);
      transform: scale(0);
      transition: transform .18s ease;
    }
    input[type="radio"]:hover{ box-shadow:
        6px 8px 16px rgba(13, 23, 39, 0.09),
        -6px -6px 16px rgba(255,255,255,.95); }
    input[type="radio"]:active{ transform: translateY(1px); }

    input[type="radio"]:checked{
      background-image:linear-gradient(135deg,#5EEAD4 0%, #60A5FA 50%, #A78BFA 100%);
      border-color: rgba(96,165,250,.55);
      box-shadow:
        2px 4px 10px rgba(96, 165, 250, .35),
        -2px -2px 8px rgba(255,255,255,.9),
        inset 2px 2px 6px rgba(0,0,0,.12);
    }
    input[type="radio"]:checked::after{ transform: scale(1); }

    input[type="radio"]:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 4px rgba(167,139,250,.25),
        3px 4px 10px rgba(13, 23, 39, 0.08),
        -3px -3px 10px rgba(255,255,255,.9);
    }

    /* === Универсальный тумблер в том же стиле (подключай где есть напоминания) === */
    .toggle-neo{
      --h: 30px;
      --w: 58px;
      display:inline-block;
    }
    .toggle-neo input{
      -webkit-appearance:none; appearance:none;
      width:var(--w); height:var(--h); border-radius:999px; cursor:pointer;
      background:linear-gradient(180deg,#FFFFFF 0%, #F5F7FF 100%);
      border:1px solid rgba(10,16,28,.08);
      box-shadow: 6px 6px 14px rgba(13,23,39,.10), -6px -6px 14px rgba(255,255,255,.9);
      position:relative; transition: all .18s ease;
      display:inline-block; vertical-align:middle;
    }
    .toggle-neo input::before{
      content:""; position:absolute; top:50%; left:4px; transform:translateY(-50%);
      width:calc(var(--h) - 8px); height:calc(var(--h) - 8px); border-radius:50%;
      background:linear-gradient(180deg,#FFFFFF 0%, #F6F8FF 100%);
      box-shadow: 4px 6px 10px rgba(13,23,39,.08), -4px -4px 10px rgba(255,255,255,.95);
      transition: left .18s ease, box-shadow .18s ease;
    }
    .toggle-neo input:checked{
      background-image:linear-gradient(135deg,#5EEAD4 0%, #60A5FA 55%, #A78BFA 100%);
      border-color: rgba(96,165,250,.55);
      box-shadow: 2px 6px 16px rgba(96,165,250,.35), -2px -2px 12px rgba(255,255,255,.95), inset 1px 1px 6px rgba(0,0,0,.1);
    }
    .toggle-neo input:checked::before{ left:calc(var(--w) - var(--h) + 4px); }
    .toggle-neo input:focus-visible{
      outline:none;
      box-shadow: 0 0 0 5px rgba(167,139,250,.25), 6px 6px 14px rgba(13,23,39,.10), -6px -6px 14px rgba(255,255,255,.9);
    }
    .toggle-neo[data-size="sm"]{ --h: 24px; --w: 46px; }

  </style>

  <!-- /* THEME_REDIRECT_INSERTED */ -->
  <script>
    (function() {
      var CURRENT = "light";
      var COUNTERPART = "./profile-dark.html";
      function go(target){ var qs = location.search || ""; location.replace(target + qs); }
      function ready(fn){ if(document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
      ready(function(){
        try{ AppState.applyTheme(CURRENT); }catch(_){
          document.documentElement.dataset.theme = CURRENT;
        }
        document.documentElement.dataset.theme = CURRENT;
        document.querySelectorAll('[data-role="theme-switch"]').forEach(function(sw){
          sw.setAttribute('aria-pressed', CURRENT === 'light' ? 'true' : 'false');
          sw.addEventListener('click', function(e){
            e.preventDefault();
            try{ AppState.applyTheme(CURRENT === 'light' ? 'dark' : 'light'); }catch(_){}
            go(COUNTERPART);
          });
        });
      });
    })();
  </script>

        <div class="inline" style="margin-top:10px">
          <label for="alg_other" class="muted" style="min-width:64px">Другое:</label>
          <input id="alg_other" type="text" placeholder="уточните" style="flex:1;min-width:260px">
        </div>
        <div class="inline" style="margin-top:8px">
          <label><input id="noAllergies" type="checkbox"> Нет аллергий</label>
        </div>
      </div>

      <div class="inline" style="margin-top:14px">
        <button id="btnSaveProfile" class="cta" disabled>Сохранить профиль</button>
        <div id="profMsg" class="muted"></div>
      </div>
    </section>

    <footer>Приложение не даёт медицинских рекомендаций. Решения — только с врачом.</footer>
  </div>

  <script>
    // ====== TG user / avatar ======
    const tgApp = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tgApp && tgApp.ready) tgApp.ready();
    if (tgApp && tgApp.expand) tgApp.expand();
    const initUser = (tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.user) ? tgApp.initDataUnsafe.user : null;

    const initData = (tgApp && tgApp.initData) ? tgApp.initData : '';
    const API_BASE = String(window.API_BASE||'').replace(/\/$/, '');
    const devTg = new URLSearchParams(location.search).get('tg') || '1002';
    function api(path, opts={}){
      let url = /^https?:\/\//i.test(path) ? path : (API_BASE + path);
      const params = [];
      if (!initData && devTg) params.push('tg=' + encodeURIComponent(devTg));
      params.push('v=profile-2025-08-24');
      url += (url.includes('?') ? '&' : '?') + params.join('&');
      const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
      if (initData) headers['X-Telegram-InitData'] = initData;
      return fetch(url, { ...opts, headers });
    }

    // Заголовок + аватар
    (async function hydrateHeader(){
      const tg = window.Telegram?.WebApp;
      const nameEl = document.getElementById('tgName');
      const avaEl  = document.getElementById('ava');

      function setInitials(target, name){
        if (!target) return;
        const i = (name||'').trim().split(/\\s+/).map(s=>s[0]||'').slice(0,2).join('').toUpperCase() || 'U';
        target.textContent = i;
      }
      function putPhoto(target, url, fallbackName){
        if (!target) return setInitials(target, fallbackName);
        const img = new Image(); img.alt=''; img.src = url;
        img.onload = ()=>{ target.innerHTML=''; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; target.appendChild(img); };
        img.onerror = ()=> setInitials(target, fallbackName);
      }

      // 1) Telegram
      let name = '', photo = '';
      const u = tg?.initDataUnsafe?.user;
      if (u) {
        name  = [u.first_name, u.last_name].filter(Boolean).join(' ');
        photo = u.photo_url || '';
      }

      // 2) Dev-qs
      if (!name) {
        const qs = new URLSearchParams(location.search);
        name  = qs.get('tg_name')  || '';
        photo = qs.get('tg_photo') || '';
      }

      // 3) Фолбэк на /api/me
      if (!name) {
        try{
          const r = await api('/api/me');
          if (r.ok) {
            const me = await r.json();
            name = me.full_name || me.name || '';
          }
        }catch(_){}
      }

      if (nameEl) nameEl.textContent = name || '—';
      if (photo) putPhoto(avaEl, photo, name); else setInitials(avaEl, name);
    })();

    // ====== Allergies UX ======
    document.getElementById('noAllergies').addEventListener('change', (e)=>{
      const on=e.target.checked;
      document.querySelectorAll('input[name="alg"]').forEach(cb=>{ cb.checked=false; cb.disabled=on; });
      document.getElementById('alg_other').value='';
    });

    // ====== Enable Save only with plausible weight ======
    function syncSaveBtn(){
      const w = Number(document.getElementById('p_weight').value || 0);
      const ok = w>20 && w<200;
      const btn = document.getElementById('btnSaveProfile');
      const hint = document.getElementById('profileHint');
      btn.disabled = !ok;
      hint.textContent = ok ? 'Готово к сохранению' : 'Заполните вес, чтобы продолжить';
      hint.style.color = ok ? '#0EA5A6' : ''; // зелёный индикатор в светлой теме
      return ok;
    }
    ['input','change','keyup','blur'].forEach(ev => document.getElementById('p_weight').addEventListener(ev, syncSaveBtn, {passive:true}));

    // ====== Prefill from server ======
    (async function loadMe(){
      try{
        const r = await api('/api/me');
        if (!r.ok) return;
        const me = await r.json();
        if (me.sex){ const sx = document.querySelector('input[name="sex"][value="'+me.sex+'"]'); if (sx) sx.checked = true; }
        if (me.weight_kg) document.getElementById('p_weight').value = me.weight_kg;
        if (me.height_cm) document.getElementById('p_height').value = me.height_cm;
        if (me.birth_date) document.getElementById('p_birth').value = me.birth_date;
        (me.allergies||[]).forEach(v=>{
          const cb = document.querySelector('input[name="alg"][value="'+v+'"]');
          if (cb) cb.checked = true; else if (String(v).startsWith('other:')){ document.getElementById('alg_other').value = String(v).slice(6); }
        });
        syncSaveBtn();
      }catch(_){ /* ignore */ }
    })();

    // ====== Save ======
    document.getElementById('btnSaveProfile').addEventListener('click', async ()=>{
      const msg = document.getElementById('profMsg');
      const sex = (document.querySelector('input[name="sex"]:checked')||{}).value || null;
      const weight_kg = Number(document.getElementById('p_weight').value || 0);
      const height_cm = Number(document.getElementById('p_height').value || 0) || null;
      const birth_date = document.getElementById('p_birth').value || null;
      const checked = [...document.querySelectorAll('input[name="alg"]:checked')].map(i=>i.value);
      const other = document.getElementById('alg_other').value.trim();
      const noAll = document.getElementById('noAllergies').checked;
      const allergies = noAll ? [] : (other ? [...checked, `other:${other}`] : checked);

      msg.textContent = 'Сохраняю...';
      try{
        const r = await api('/api/me', { method:'POST', body: JSON.stringify({ sex, weight_kg, height_cm, birth_date, allergies }) });
        if (!r.ok){ let text='Ошибка '+r.status; try{const j=await r.json(); if(j&&j.error) text=j.error;}catch{} msg.textContent=text; return; }
        msg.textContent = 'Сохранено';
        try{ localStorage.setItem('derma_next','plan'); }catch(_){}
        const qs = location.search || '';
        // Переход на соответствующую план-страницу по текущей теме
        const theme = document.documentElement.dataset.theme || 'light';
        const nextPage = (theme === 'dark') ? 'plan-dark.html' : 'plan-light.html';
        setTimeout(()=>location.replace('./' + nextPage + qs), 200);
      }catch(_){ msg.textContent='Ошибка сети'; }
    }, { once:true });  // защита от двойного клика

    // начальная валидация
    syncSaveBtn();

    // ====== Back to welcome ======
    (function(){
      const btn = document.getElementById('btnBack');
      if (btn) btn.addEventListener('click', ()=>{
        const qs = location.search || '';
        location.replace('./welcome-rt.html' + qs);
      });
    })();
  </script>
  
</body>
</html>
