<script>
// Убираем ?next/&after из URL, чтобы ничего не прыгало мимо welcome
(function(){
  const sp = new URLSearchParams(location.search);
  if (sp.has('next') || sp.has('after')){ sp.delete('next'); sp.delete('after'); const qs=sp.toString(); history.replaceState(null,'', location.pathname + (qs?('?'+qs):'')); }
})();
</script>


<style>
/* ===================== THEME VARS ===================== */
:root{
  /* Dark */
  --bg-0: #0b1620;
  --bg-1: #0f1f2b;
  --bg-grad: radial-gradient(1200px 700px at 70% -10%, #0e2a39 0%, transparent 55%),
             radial-gradient(1200px 700px at -10% 110%, #112a2a 0%, transparent 55%),
             linear-gradient(180deg, #0b1620, #0a1520);
  --card: #0f1d27;
  --ink: #dce7f2;
  --muted: #99b3c7;
  --ring1: #31e3e3;
  --ring2: #20d2a5;

  --glass: rgba(255,255,255,.06);
  --edge: rgba(0,0,0,.55);

  --radius-outer: 22px;
  --radius-inner: 14px;

  /* Buttons gradient */
  --btnA:#62e9ff; --btnB:#45d3ff; --btnC:#1dd1a1;

  /* Neumorph shadow recipe */
  --shadow-up: -6px -12px 18px rgba(255,255,255,.06);
  --shadow-dn:  8px 14px 24px rgba(0,0,0,.45);
  --inset-up: inset 6px 6px 12px rgba(0,0,0,.45);
  --inset-dn: inset -6px -6px 12px rgba(255,255,255,.05);
}

/* Optional light toggle (кнопка «Светлая тема») */
body[data-theme="light"]{
  --bg-0:#eef3f7; --bg-1:#f7fbff;
  --bg-grad: radial-gradient(1200px 700px at 70% -10%, #ffffff 0%, transparent 55%),
             radial-gradient(1200px 700px at -10% 110%, #ffffff 0%, transparent 55%),
             linear-gradient(180deg, #eef3f7, #f5f9ff);
  --card:#ffffff;
  --ink:#0d2130; --muted:#4b6476;
  --glass: rgba(0,0,0,.04);
  --edge: rgba(0,0,0,.09);
  --btnA:#c9f5ff; --btnB:#a6eaff; --btnC:#7ce1c1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); background:var(--bg-0); 
  background-image:var(--bg-grad); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial;
}

/* ===================== LAYOUT ===================== */
.shell{
  max-width: 1100px; margin:0 auto; padding:18px 16px 112px;  /* запас снизу под кнопку темы */
}
.hero{max-width: 780px; margin: 6px auto; text-align:center;}
.hero-title{margin:0; line-height:1.06; font-size: clamp(30px, 5.2vw, 48px); letter-spacing:.2px}
.hero-subtitle{margin:6px 0 0; line-height:1.18; font-size: clamp(15px, 3.2vw, 24px); color: rgba(220,231,242,.82); color: color-mix(in oklab, var(--ink) 80%, var(--muted)); opacity:.92; font-weight:800}
.lead-card{
  display:inline-block; margin:6px auto 8px; padding:10px 14px;
  color:var(--muted); border-radius:999px;
  background:var(--glass);
  box-shadow: var(--inset-up), var(--inset-dn), var(--shadow-dn);
  backdrop-filter: blur(6px);
}

.prompt{margin:10px auto 6px; text-align:center;}
.prompt h2{margin:0; font-size: clamp(16px, 2.9vw, 24px)}
.badge{
  display:inline-flex; align-items:center; gap:8px;
  margin:6px auto 10px; padding:6px 12px; border-radius:999px;
  color:#cfe9ff; background:rgba(255,255,255,.08); 
  box-shadow: var(--inset-up), var(--inset-dn);
  font-weight:700; letter-spacing:.3px;
  
}

/* ===================== CARDS ===================== */
.cards{
  margin: 8px auto 10px; padding: 0;
  display:grid; grid-template-columns: repeat(2, minmax(0,1fr));
  gap:16px; 
}
.role{
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border-radius: var(--radius-outer);
  box-shadow: var(--shadow-up), var(--shadow-dn);
  padding:10px; 
  transition: transform .2s ease, box-shadow .2s ease, filter .3s ease;
  position:relative; isolation:isolate;
  animation: breathe 4.6s ease-in-out infinite;
}
.role:hover{ transform: translateY(-2px); filter:brightness(1.03) }
@keyframes breathe{
  0%,100%{ transform: scale(1) }
  50%{ transform: scale(1.02) }
}
.media-btn{
  position:relative; width:100%; aspect-ratio: 3/4; border:0; padding:0; cursor:pointer;
  display:block; border-radius: var(--radius-inner);
  background: #0a1a22 center/cover no-repeat;
  box-shadow: var(--inset-up), var(--inset-dn);
  overflow:hidden;
}
/* Постер как фон */
.media-btn::before{
  content:""; position:absolute; inset:0; background: var(--poster) center/cover no-repeat;
}
/* Градиентное кольцо при выборе + свечение */
.role.selected .media-btn::after{
  content:""; position:absolute; inset:-2px; border-radius: inherit;
  padding:3px; background: linear-gradient(135deg, var(--ring1), var(--ring2));
  -webkit-mask: 
    linear-gradient(#000 0 0) content-box, 
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  box-shadow: 0 0 24px 6px color-mix(in oklab, var(--ring1) 50%, transparent);
}

/* Видеослой (если есть файл) */
.media-btn video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; pointer-events:none;
  transform: translateZ(0);
  transition: opacity .18s ease;
}
.role.playing .media-btn video{ opacity:1 }

/* ===================== ACTIONS ===================== */
.actions{ margin:12px 0 8px; display:flex; justify-content:center; }

/* Кнопка "Начать" — стеклянная/прозрачная, БЕЗ окантовки. Внутри: лёгкие зелёные проблески. */
.start-wrap{
  width: clamp(210px, 60vw, 390px);
  display:inline-block;
  border-radius: 20px;
  filter: drop-shadow(0 14px 26px rgba(0,0,0,.38));  position: relative; /* чтобы start-ring не создавал чёрный блок ниже */
}

/* FIX: убираем чёрный прямоугольник от SVG под кнопкой "Начать" */
.start-ring{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:block;
}
.start-ring rect{ fill:none; }


.start{
  width:100%;
  height:54px;
  padding:0 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.16);
  cursor:pointer;

  font-size: clamp(15px, 2.2vw, 20px);
  font-weight:900;
  letter-spacing:.2px;
  color: var(--ink);
  text-shadow: 0 10px 26px rgba(0,0,0,.25);

  /* стеклянная база */
  background: rgba(255,255,255,.075);
  backdrop-filter: blur(14px) saturate(155%);
  -webkit-backdrop-filter: blur(14px) saturate(155%);

  box-shadow:
    0 14px 30px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -2px 0 rgba(0,0,0,.22);

  position:relative;
  overflow:hidden;
  -webkit-tap-highlight-color: transparent;
  transition: transform .08s ease, filter .12s ease, box-shadow .12s ease;
}

/* внутренние "проблески" градиента (зелёный/голубой) */
.start::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius: inherit;
  pointer-events:none;

  background:
    radial-gradient(120% 140% at 18% 25%,
      rgba(29,209,161,.28) 0%,
      rgba(29,209,161,0) 56%),
    radial-gradient(120% 140% at 85% 40%,
      rgba(69,211,255,.18) 0%,
      rgba(69,211,255,0) 58%),
    radial-gradient(120% 140% at 50% 120%,
      rgba(98,233,255,.12) 0%,
      rgba(98,233,255,0) 60%);
  opacity:.9;
  mix-blend-mode: screen;
  filter: blur(.2px);
}

/* лёгкий стеклянный блик (очень мягкий) */
.start::after{
  content:"";
  position:absolute;
  top:-55%;
  left:-70%;
  width:58%;
  height:210%;
  border-radius: 40px;
  background: linear-gradient(90deg,
    transparent,
    rgba(255,255,255,.22),
    transparent
  );
  transform: skewX(-18deg);
  animation: startSheen 4.6s ease-in-out infinite;
  opacity:.0;
  pointer-events:none;
}

@keyframes startSheen{
  0%,62%{ transform: translateX(0) skewX(-18deg); opacity:0; }
  68%{ opacity:.18; }
  100%{ transform: translateX(240%) skewX(-18deg); opacity:0; }
}

.start:hover{ filter: brightness(1.04); }
.start:active{
  transform: translateY(1px) scale(.995);
  box-shadow:
    0 10px 20px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -2px 0 rgba(0,0,0,.26);
}
/* Сделать отклик тапа заметнее и гарантированным (даже при быстром переходе) */
.start{ touch-action: manipulation; }

.start.pressed{
  transform: translateY(2px) scale(.985);
  filter: brightness(1.10) saturate(1.12);
  box-shadow:
    0 10px 18px rgba(0,0,0,.55),
    0 0 0 2px rgba(49,227,227,.22),
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -2px 0 rgba(0,0,0,.28);
}

/* Риппл-волна */
.start .ripple{
  position:absolute;
  width:12px; height:12px;
  border-radius:999px;
  pointer-events:none;
  left: var(--rx, 50%);
  top:  var(--ry, 50%);
  transform: translate(-50%,-50%) scale(1);
  background: radial-gradient(circle,
    rgba(98,233,255,.45) 0%,
    rgba(29,209,161,.22) 55%,
    rgba(98,233,255,0) 70%
  );
  animation: rtRipple .46s ease-out forwards;
}

@keyframes rtRipple{
  to{ transform: translate(-50%,-50%) scale(26); opacity:0; }
}

/* На всякий: заметный фокус с клавиатуры */
.start:focus-visible{
  outline: none;
  box-shadow:
    0 14px 30px rgba(0,0,0,.42),
    0 0 0 3px rgba(49,227,227,.28),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -2px 0 rgba(0,0,0,.22);
}


/* ===================== THEME BUTTON (fixed) ===================== */
.theme-float{ position:fixed; right:16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index:50; }
.theme-float button{
  height:40px; padding:0 14px; border-radius:999px; border:none; cursor:pointer;
  background: linear-gradient(180deg, #4ef1e8, #22d3ee 45%, #10b981);
  color:#06221f; font-weight:900; letter-spacing:.2px;
  box-shadow: 0 12px 22px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.35);
  transition: transform .08s ease, filter .12s ease;
  position:relative;
}
.theme-float button::before{
  content:""; position:absolute; left:8px; right:8px; top:6px; height:46%;
  background: linear-gradient(180deg, rgba(255,255,255,.38), transparent 70%); border-radius:inherit;
}
.theme-float button:active{ transform:translateY(1px) }

/* ===================== MOBILE COMPACT ===================== */
@media (max-width:820px){
  .shell{ padding:16px 12px 112px; }
  .cards{ gap:12px; }
  .role{ padding:8px; border-radius:18px; animation:none; }
  .media-btn{ border-radius:12px }
  .start-wrap{ width:70vw; }
  .start{ height:52px; }
}

/* ===================== REDUCE MOTION ===================== */
@media (prefers-reduced-motion: reduce){
  .role{ animation:none !important; transition:none !important; }
  .start-wrap::before,.start-wrap::after,.start::after{ animation:none !important; }
}
.benefits{
  max-width: 780px;
  margin: 10px auto 4px;
  padding: 12px 14px;
  border-radius: 18px;
  background: rgba(255,255,255,.05);
  box-shadow: var(--inset-up), var(--inset-dn), var(--shadow-dn);
  backdrop-filter: blur(6px);
}
.benefits ul{ margin:0; padding:0; list-style:none; display:grid; gap:8px; }
.benefits li{ color:var(--muted); }
.benefits b{ color:var(--ink); font-weight:900; }
.fineprint{
  margin-top:10px;
  font-size: 12px;
  color: color-mix(in oklab, var(--muted) 85%, white);
  opacity:.9;
}

</style>

<body>
  <main class="shell">
    <!-- HERO -->
    <section class="hero">
      <h1 class="hero-title">Retiora</h1>
      <div class="hero-subtitle">трекер курса ретиноидов и изотретиноина</div>
<div class="lead-card">
  Дневник приёма, прогресс по курсу, фото-сравнение и напоминания — чтобы проходить курс спокойнее и регулярнее.
</div>
    </section>


    <!-- PROMPT -->
    <section class="prompt">
      <h2>Вы используете приложение от лица пациента или врача?</h2>
      <div class="badge">ВЫБЕРИТЕ РОЛЬ</div>
    </section>

    <!-- CARDS -->
    <section class="cards" id="roles">
      <!-- ВРАЧ -->
      <article class="role" data-role="doctor">
        <!-- Поменяй пути на свои: data-poster и (по желанию) data-video -->
        <a class="media-btn" data-poster="doctor-card.png" data-video="doctor-card.mp4" aria-label="Врач-куратор" title="Врач-куратор"></a>
      </article>

      <!-- ПАЦИЕНТ -->
      <article class="role" data-role="patient">
        <a class="media-btn" data-poster="patient-card.png" data-video="patient-card.mp4" aria-label="Пациент" title="Пациент"></a>
      </article>
    </section>

    <!-- START -->
    <div class="actions">
      <div class="start-wrap">
        <button class="start" id="go-next" type="button">Начать</button>
      
        <svg class="start-ring" viewBox="0 0 100 52" preserveAspectRatio="none" aria-hidden="true">
          <!-- базовая тонкая обводка -->
          <rect class="ring-base" x="2" y="2" width="96" height="48" rx="18" ry="18"></rect>
      
          <!-- бегущий яркий сегмент -->
          <rect class="ring-run" x="2" y="2" width="96" height="48" rx="18" ry="18"></rect>
        </svg>
      </div>
      
    </div>
  </main>



<script>
/* ========= utils ========= */
const q = sel => document.querySelector(sel);
const qa = sel => Array.from(document.querySelectorAll(sel));

/* ========= cards setup ========= */
const rolesWrap = q('#roles');
let selected = null;

// Build media inside each card
qa('.role').forEach(card => {
  const btn = card.querySelector('.media-btn');
  const poster = btn.getAttribute('data-poster');
  const videoSrc = btn.getAttribute('data-video');

  // poster as CSS variable for ::before
  btn.style.setProperty('--poster', `url("${poster}")`);

  if (videoSrc) {
    // лёгкий прогрев: сначала metadata (быстро), затем auto на хорошей связи
    const v = document.createElement('video');
    v.src = videoSrc;
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.preload = 'metadata';
    btn.appendChild(v);
  }

  // preload постера (чтобы на телефонах не было рывка при первой отрисовке)
  try{ const img = new Image(); img.decoding = 'async'; img.src = poster; }catch(_){ }

  // click selects
  card.addEventListener('click', () => selectRole(card));
});

function selectRole(card){
  if (selected === card) return;
  qa('.role').forEach(c=>{
    c.classList.remove('selected','playing');
    // pause videos
    const v = c.querySelector('video'); if (v){ v.pause(); v.currentTime = 0; }
  });
  selected = card;
  selected.classList.add('selected');

  // try play video if exists
  const v = selected.querySelector('video');
  if (v){
    v.play().then(()=> selected.classList.add('playing')).catch(()=>{/* ignore */});
  }

  localStorage.setItem('rt_role', selected.dataset.role);
}

// restore last role
const last = localStorage.getItem('rt_role');
if (last){
  const c = q(`.role[data-role="${last}"]`);
  if (c) selectRole(c);
}

/* ========= warm-up media (mobile friendly) ========= */
(function(){
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const okToWarm = !conn || (!conn.saveData && !String(conn.effectiveType||'').includes('2g'));
  if (!okToWarm) return;

  const warm = () => {
    qa('.role video').forEach(v=>{
      try{ v.preload = 'auto'; v.load(); }catch(_){}
    });
  };
  if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout: 1200 });
  else setTimeout(warm, 450);
})();

/* ========= start routing (DARK only) ========= */
(async function(){
const tg = window.Telegram?.WebApp;
const initData = tg?.initData || '';
const API_BASE = String(window.API_BASE||'').replace(/\/$/,'');

const sp = new URLSearchParams(location.search);
const isDev = location.hostname === 'localhost' || location.hostname.startsWith('127.');
const DEV_DEFAULT_TG = '1002';
let devTg = sp.get('tg') || localStorage.getItem('rt.dev.tg') || (isDev ? DEV_DEFAULT_TG : '');
if (devTg) { try { localStorage.setItem('rt.dev.tg', devTg); } catch(_) {} }

function api(path, opts = {}){
  let url = /^https?:\/\//i.test(path) ? path : (API_BASE + path);
  if (!initData && devTg) {
    url += (url.includes('?') ? '&' : '?') + 'tg=' + encodeURIComponent(devTg);
  }
  const headers = { 'Content-Type':'application/json' };
  if (initData) headers['X-Telegram-InitData'] = initData; // в Telegram шлём заголовок
  return fetch(url, { ...opts, headers });
}


  // подгружаем состояние с сервера (если доступен)
  let me=null, plan=null;
  try{ const r=await api('/api/me');   if(r.ok) me  = await r.json(); }catch(_){}
  try{ const r=await api('/api/plan'); if(r.ok) plan= await r.json(); }catch(_){}
  const btn = document.getElementById('go-next');
    // Яркий визуальный отклик + ripple + лёгкая вибрация в Telegram
    if (btn){
    const tg = window.Telegram?.WebApp;

    const pressOn = (ev) => {
      btn.classList.add('pressed');

      // координаты тапа для ripple
      const r = btn.getBoundingClientRect();
      const x = (ev.clientX ?? (ev.touches?.[0]?.clientX)) ?? (r.left + r.width/2);
      const y = (ev.clientY ?? (ev.touches?.[0]?.clientY)) ?? (r.top + r.height/2);
      btn.style.setProperty('--rx', ((x - r.left) / r.width * 100).toFixed(2) + '%');
      btn.style.setProperty('--ry', ((y - r.top)  / r.height * 100).toFixed(2) + '%');

      // ripple DOM
      const s = document.createElement('span');
      s.className = 'ripple';
      btn.appendChild(s);
      s.addEventListener('animationend', () => s.remove(), { once:true });

      // haptic (если внутри Telegram)
      try { tg?.HapticFeedback?.impactOccurred('light'); } catch(_){}
    };

    const pressOff = () => {
      // чуть держим состояние, чтобы глаз успел зацепиться
      setTimeout(() => btn.classList.remove('pressed'), 120);
    };

    btn.addEventListener('pointerdown', pressOn, { passive:true });
    btn.addEventListener('pointerup', pressOff, { passive:true });
    btn.addEventListener('pointercancel', pressOff, { passive:true });
    btn.addEventListener('pointerleave', pressOff, { passive:true });
  }

  btn?.addEventListener('click', (e)=>{
    try { e.preventDefault(); } catch(_){}
    const qs = location.search || '';
const sp = new URLSearchParams(qs);
const tgInit = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
const uid = sp.get('tg') || tgInit || ''; // без дефолта

    const role = (localStorage.getItem('rt_role') || 'patient').toLowerCase();

    // ===== Врач =====
    if (role === 'doctor') {
      // именной флаг важнее любых глобальных
      const onbDone = uid
        ? (localStorage.getItem(`dermaApp:${uid}:doctor_done`) === '1')
        : (localStorage.getItem('rt_doctor_done') === '1' || localStorage.getItem('doctorOnboardingDone') === '1');

      location.href = (onbDone ? './doctor-cabinet-mint-rose.html'
                               : './doctor-onboarding-mint-rose.html') + qs;
      return;
    }

    // ===== Пациент =====
    // 1) согласие: БД ИЛИ именной LS ИЛИ (на худой случай) глобальный LS
    const consentLS = uid
      ? localStorage.getItem(`dermaApp:${uid}:consentAccepted`)
      : localStorage.getItem('derma_consent');
    const consented = !!me?.accepted_terms_at || (consentLS === '1');

    // 2) профиль: БД ИЛИ локальный фоллбэк (на случай, если профиль сохранили только в LS)
    const hasWeightDB = Number(me?.weight_kg) > 0;
    const weightLS = Number(
      localStorage.getItem(`dermaApp:${uid}:weight_kg`) ??
      localStorage.getItem('rt.weight_kg') ??
      localStorage.getItem('weight_kg') ??
      0
    );
    const hasWeight = hasWeightDB || (weightLS > 0);

    // 3) план: БД ИЛИ локальный фоллбэк (по ключам плана)
    const hasPlanDB = !!plan?.start_date;
    const hasPlanLS = !!(
      localStorage.getItem(`dermaApp:${uid}:plan_start`) ||
      localStorage.getItem('rt_startISO') ||
      localStorage.getItem('plan_start') ||
      localStorage.getItem('rt_plan_done') === '1'
    );
    const hasPlan = hasPlanDB || hasPlanLS;

    // финальная развилка
    const next = !consented ? './warnings.html'
           : !(hasWeight && hasPlan) ? './onboarding.html'
           : './main.html';


    location.href = next + qs;
  }, { capture:true }); // наш обработчик сработает раньше прочих
})();
</script>

<script>
(function () {
  var btn = document.getElementById('themeToggle');  // id твоей кнопки "Светлая тема"
  if (!btn) return;
  var qs = location.search || '';
  btn.addEventListener('click', function () {
    try { if (window.AppState) AppState.applyTheme('light'); } catch(e) {}
    location.href = './welcome-rt-light.html' + qs;
  });
})();
</script>
<script src="/assets/rt-skeleton.js"></script>
<script>
  // пример: грузим профиль и рисуем его
  withSkeleton(
    fetch('/api/profile?tg=' + tgId)
      .then(r => r.json())
      .then(data => renderProfile(data))
  );
</script>
