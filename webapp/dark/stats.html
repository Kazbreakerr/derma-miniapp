<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Retiora — Статистика</title>
  <style>
    :root{
      --bg0:#061521;
      --bg1:#071c2a;

      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.045);
      --stroke: rgba(255,255,255,.10);
      --ink: rgba(236,248,255,.92);
      --muted: rgba(236,248,255,.62);

      --mint:#48e7d6;
      --sky:#7fd0ff;
      --lav:#c6b0ff;
      --berry:#ff93b2;

      --r: 22px;

      --sh-up: -10px -10px 26px rgba(255,255,255,.06);
      --sh-dn:  14px  16px 36px rgba(0,0,0,.55);
      --in-up:  inset 0 1px 0 rgba(255,255,255,.12);
      --in-dn:  inset 0 -2px 0 rgba(0,0,0,.28);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: var(--ink);
  /* Темный градиент: зелёный → мятный → персиковый → сиреневый (без швов) */
  background-color: #061420;
  background-image:
    radial-gradient(1200px 820px at 18% 12%, rgba(16, 170, 120, .22), transparent 62%),
    radial-gradient(1100px 760px at 78% 18%, rgba(48, 240, 212, .20), transparent 62%),
    radial-gradient(980px 720px at 72% 58%, rgba(255, 170, 132, .16), transparent 64%),
    radial-gradient(980px 760px at 28% 78%, rgba(190, 160, 255, .15), transparent 64%),
    linear-gradient(180deg,
      #061420 0%,
      #062027 22%,
      #0a2f2a 44%,
      #123a31 58%,
      #1b3037 74%,
      #2a2737 88%,
      #061420 100%);
  background-repeat:no-repeat;
  background-attachment: fixed;
  overflow-x:hidden;
}

    .shell{ max-width: 980px; margin:0 auto; padding: 18px 14px 28px; }

    /* Header */
    .topbar{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
      margin-bottom: 12px;
      flex-wrap:wrap;
    }
    .left-actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .pill-btn{
      display:inline-flex; align-items:center; gap:8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--card2);
      border: 1px solid var(--stroke);
      box-shadow: var(--in-up), var(--in-dn), var(--sh-dn);
      color: var(--ink); text-decoration:none;
      font-weight: 850;
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease, filter .12s ease;
      white-space:nowrap;
    }
    .pill-btn:active{ transform: translateY(1px) scale(.99); }
    .title{
      text-align:right;
      line-height:1.05;
      min-width: 160px;
    }
    .title .h{
      font-size: 22px;
      font-weight: 950;
      letter-spacing: .2px;
    }
    .title .s{
      margin-top:4px;
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 750;
    }

    /* Cards */
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.060), rgba(255,255,255,.034));
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--sh-up), var(--sh-dn), var(--in-up), var(--in-dn);
      backdrop-filter: blur(10px) saturate(1.15);
      -webkit-backdrop-filter: blur(10px) saturate(1.15);
      padding: 14px;
    }
    .card + .card{ margin-top: 12px; }

    .card-h{
      display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
      margin-bottom: 10px;
      flex-wrap:wrap;
    }
    .card-h h2{
      margin:0;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .15px;
    }
    .hint{
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      white-space:nowrap;
    }

    /* Segmented */
    .row{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; flex-wrap:wrap;
    }
    .seg{
      display:inline-flex;
      padding: 6px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.28);
      gap: 6px;
      max-width: 100%;
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .seg::-webkit-scrollbar{ display:none; }
    .seg button{
      border:0;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      letter-spacing: .1px;
      padding: 9px 11px;
      border-radius: 999px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease, filter .12s ease, background .15s ease;
      white-space:nowrap;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .seg button:active{ transform: translateY(1px) scale(.99); }
    .seg button.active{
      color: rgba(7,22,24,.92);
      background: linear-gradient(180deg, rgba(72,231,214,.95), rgba(127,208,255,.85));
      box-shadow: 0 10px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.30);
    }

    @media (max-width:380px){
      .seg button{ padding: 8px 10px; font-size: 12px; }
      .title .h{ font-size: 20px; }
    }

    /* Chart area */
    .chart-wrap{
      margin-top: 12px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 10px;
      position: relative;
      overflow: hidden;
    }
    .chart-wrap::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(120% 90% at 30% 0%, rgba(127,208,255,.12), transparent 60%),
        radial-gradient(120% 90% at 70% 100%, rgba(72,231,214,.10), transparent 60%);
      pointer-events:none;
      opacity: .95;
      mix-blend-mode: screen;
    }
    canvas{ display:block; width:100%; height: 250px; }
    @media (max-width:520px){
      canvas{ height: 235px; }
    }

    .tooltip{
      position:absolute;
      left: 12px; top: 12px;
      min-width: 170px;
      max-width: min(320px, calc(100% - 24px));
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(0,0,0,.38);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink);
      display:none;
      pointer-events:none;
    }
    .tooltip .t1{ font-weight:950; font-size: 13px; }
    .tooltip .t2{ margin-top:4px; color: var(--muted); font-weight:800; font-size: 12px; }
    .tooltip .t3{
      margin-top:8px;
      font-weight:800;
      font-size: 12px;
      color: rgba(236,248,255,.86);
      white-space: pre-line; /* для многострочных деталей побочек */
    }

    /* PIE (centered) + legend below */
    .pie{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 10px;
      text-align:center;
    }
    .pie canvas{ height: 260px; }
    @media (max-width:520px){
      .pie canvas{ height: 240px; }
    }
    .pie-caption{
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .legend{
      width: 100%;
      max-width: 520px;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top: 4px;
    }
    .lg{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }
    .lg-left{ display:flex; align-items:center; gap:10px; min-width:0; }
    .dot{
      width:12px; height:12px; border-radius:999px;
      box-shadow: 0 0 0 4px rgba(255,255,255,.04);
    }
    .lg-name{ font-weight:900; font-size: 13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lg-val{ font-weight:950; font-size: 13px; color: rgba(236,248,255,.86); }

    /* Summary grid */
    .sum{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }
    @media (max-width:380px){
      .sum{ grid-template-columns: 1fr; }
    }
    .pill{
      padding: 12px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 10px 28px rgba(0,0,0,.30);
    }
    .pill .k{ font-size: 12px; color: var(--muted); font-weight: 850; }
    .pill .v{ margin-top:6px; font-size: 18px; font-weight: 950; letter-spacing: .2px; }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .seg button, .pill-btn{ transition:none !important; }
    }
  

/* Chart footer (month switch for Week view) */
.chart-footer{
  display:none;
  margin-top: 8px;
  padding: 6px 6px 2px;
  align-items:center;
  justify-content:center;
  gap: 10px;
}
.chart-footer.show{ display:flex; }
.month-switch{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.28);
  max-width: 100%;
}
.month-btn{
  width: 34px; height: 34px;
  border-radius: 999px;
  border: 0;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 22px rgba(0,0,0,.30);
  color: rgba(236,248,255,.86);
  font-weight: 950;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .08s ease, filter .12s ease;
  flex: 0 0 auto;
}
.month-btn:active{ transform: translateY(1px) scale(.99); }
.month-label{
  font-weight: 900;
  color: rgba(236,248,255,.72);
  font-size: 12.5px;
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
  max-width: min(260px, calc(100vw - 210px));
  letter-spacing: .1px;
}

/* Pie tooltip slightly different placement */
.pie-tip{
  left: 50%;
  transform: translateX(-50%);
  top: 12px;
  text-align:left;
  min-width: 190px;
}

@media (max-width:380px){
  .month-label{ font-size: 12px; }
  .month-btn{ width: 32px; height: 32px; }
}



.errbar{
  margin: 14px auto 0;
  max-width: 1120px;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 70, 90, .12);
  border: 1px solid rgba(255, 120, 130, .22);
  box-shadow: 0 14px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
  color: rgba(255,235,238,.92);
}
.errbar .eTitle{ font-weight: 950; letter-spacing:.1px; margin-bottom: 4px; }
.errbar .eMsg{ font-weight: 700; font-size: 12.5px; opacity: .95; white-space: pre-wrap; }



/* Make pie/metric segmented labels fit on narrow screens without horizontal scroll */
@media (max-width:520px){
  #pieSeg, #metricSeg{
    width: 100%;
  }
  #pieSeg button, #metricSeg button{
    flex: 1 1 0;
    white-space: normal;
    text-align: center;
    line-height: 1.08;
    padding: 9px 8px;
    min-width: 0;
  }
}
@media (max-width:380px){
  #pieSeg button, #metricSeg button{
    font-size: 11.2px;
    padding: 8px 7px;
  }
}
</style>
<!-- RT: conditional buffering loader (HEAD) -->
<script id="rt-loader-netcheck">
  (function(){
    try{
      const c  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const et = (c && c.effectiveType) ? String(c.effectiveType) : '';
      const slow = !!(c && (c.saveData || et === '3g' || et === '2g' || et === 'slow-2g'));
      if(slow) document.documentElement.classList.add('rt-net-slow','rt-show-loader');
    }catch(_){}
  })();
  </script>
  
  <style id="rt-buffer-loader">
    /* overlay */
    #rt-loader{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:99999;
      opacity:0; pointer-events:none;
      transition:opacity .18s ease;
      background:
        radial-gradient(1200px 600px at 50% 28%, rgba(86,255,226,.10), rgba(0,0,0,0) 60%),
        linear-gradient(180deg, rgba(6,10,20,.92), rgba(6,10,20,.96));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    html.rt-show-loader #rt-loader{ opacity:1; pointer-events:auto; }
  
    /* hide page content only when predicted slow (so no "partial render" flash) */
    html.rt-net-slow body > :not(#rt-loader){
      opacity:0 !important;
      pointer-events:none !important;
    }
    body > :not(#rt-loader){ transition: opacity .18s ease; }
  
    /* card */
    .rt-loader-card{
      width:min(780px, calc(100vw - 32px));
      padding:22px 22px;
      border-radius:22px;
      background: rgba(14, 21, 33, .72);
      border:1px solid rgba(255,255,255,.08);
      box-shadow: 0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
      display:flex; align-items:center; gap:18px;
    }
  
    .rt-loader-dot{
      width:56px; height:56px; border-radius:999px;
      position:relative;
      display:grid; place-items:center;
      background:
        radial-gradient(circle at 30% 30%, rgba(72,231,214,.35), rgba(198,176,255,.18) 55%, rgba(0,0,0,0) 72%),
        rgba(10,16,28,.85);
      box-shadow: 0 18px 40px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.12),
        0 0 0 1px rgba(255,255,255,.08);
    }
    .rt-loader-dot:before{
      content:"";
      position:absolute; inset:-10px;
      border-radius:999px;
      background: radial-gradient(circle at 50% 50%, rgba(72,231,214,.22), rgba(198,176,255,0) 60%);
      filter: blur(8px);
      opacity:.65;
    }
    .rt-loader-dot:after{
      content:"";
      position:absolute; inset:0;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(72,231,214,.22), rgba(198,176,255,.18));
      mix-blend-mode: screen;
      opacity:.25;
    }
    .rt-loader-ico{
      position:relative;
      font-size:26px;
      filter: drop-shadow(0 10px 18px rgba(72,231,214,.25));
    }
  
    .rt-loader-meta{ flex:1; min-width:0; }
    .rt-loader-title{
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .2px;
      color: rgba(236,248,255,.96);
      line-height:1.15;
      margin:0 0 6px;
    }
    .rt-loader-sub{
      font-weight: 650;
      font-size: 14px;
      color: rgba(236,248,255,.62);
      margin:0 0 12px;
    }
  
    .rt-loader-bar{
      height:8px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      overflow:hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .rt-loader-bar span{
      display:block; height:100%;
      width:34%;
      border-radius:999px;
      background: linear-gradient(90deg,
        rgba(72,231,214,0),
        rgba(72,231,214,.75),
        rgba(198,176,255,.75),
        rgba(255,215,0,.60),
        rgba(72,231,214,0)
      );
      transform: translateX(-60%);
      animation: rtLoaderBar 1.05s ease-in-out infinite;
    }
    @keyframes rtLoaderBar{
      0%{ transform: translateX(-60%); }
      50%{ transform: translateX(220%); }
      100%{ transform: translateX(-60%); }
    }
  
    @media (max-width:420px){
      .rt-loader-card{ padding:18px 16px; border-radius:20px; gap:14px; }
      .rt-loader-title{ font-size:18px; }
      .rt-loader-sub{ font-size:13px; margin-bottom:10px; }
    }
    @media (prefers-reduced-motion: reduce){
      .rt-loader-bar span{ animation:none; }
    }
  </style>
  
</head>

<script>
/* ===================== DATA: read from your existing LocalStorage formats ===================== */
const MOOD_SCALE = [
  { at: 0,   label: 'Очень плохо' },
  { at: 17,  label: 'Плохо' },
  { at: 33,  label: 'Ниже нормы' },

  { at: 66,  label: 'Неплохо' },
  { at: 83,  label: 'Хорошо' },
  { at: 100, label: 'Отлично' },
];

// Для узких экранов: короткие подписи (чтобы ВСЁ влезало)
const MOOD_SHORT = [
  'Оч. плохо',
  'Плохо',
  'Ниже\nнормы',
  'Нейтр.',
  'Неплохо',
  'Хорошо',
  'Отлично',
];

const SE_DEFS = [
  ['lips_dry','Сухость губ'],
  ['skin_dry','Сухость кожи'],
  ['muscle_pain','Боль в суставах'],
  ['headache','Головная боль'],
];

const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function toISO(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function parseISO(s){
  const [y,m,d]=String(s).slice(0,10).split('-').map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function addDays(iso, days){
  const d=parseISO(iso);
  d.setDate(d.getDate()+days);
  return toISO(d);
}
function todayISO(){ return toISO(new Date()); }

function loadV1(){
  try{ return JSON.parse(localStorage.getItem('rt.diary.v1')||'{}') || {}; }catch(_){ return {}; }
}
function loadV2(){
  try{
    const v = JSON.parse(localStorage.getItem('rt.diary.v2')||'null');
    return (v && v.version===2) ? v : {version:2, baseline:null, entries:{}};
  }catch(_){ return {version:2, baseline:null, entries:{}}; }
}

function normalizeValenceTo100(v){
  if (v==null || !isFinite(Number(v))) return null;
  v = Number(v);
  if (v >= 0 && v <= 100) return v;
  if (v >= 0 && v <= 1)   return v * 100;
  if (v >= -1 && v <= 1)  return ((v + 1) / 2) * 100;
  return 50;
}
function moodIndexFromValence(v100){
  if (v100==null) return null;
  const step = 100/6;
  const idx  = Math.round(Math.max(0, Math.min(100, v100)) / step);
  return Math.max(0, Math.min(6, idx));
}
function moodLabel(idx){
  if (idx==null) return '—';
  return MOOD_SCALE[Math.max(0, Math.min(6, idx))].label;
}

/* Build day series */
function buildSeries(range, anchorISO){
  const v1 = loadV1();
  const v2 = loadV2();
  const entries2 = v2.entries || {};
  const baseline = (v2.baseline && /^\d{4}-\d{2}-\d{2}$/.test(v2.baseline)) ? v2.baseline : null;
  const anchor = (anchorISO && /^\d{4}-\d{2}-\d{2}$/.test(anchorISO)) ? anchorISO : todayISO();

// range window
let startISO, days;

if (range === 'week'){
  // fixed: last 7 days ending today (no month switch here)
  const end = todayISO();
  days = 7;
  startISO = addDays(end, -(days-1));
} else if (range === 'month'){
  // calendar month view: from 1st to last day of the selected month
  const a = parseISO(anchor);
  const y = a.getFullYear();
  const mo = a.getMonth(); // 0..11
  const lastDay = new Date(y, mo+1, 0).getDate();
  startISO = `${y}-${String(mo+1).padStart(2,'0')}-01`;
  days = lastDay;
} else {
  // course: from baseline if exists, else last 120 days (up to 360)
  const start = baseline ? baseline : addDays(anchor, -119);
  const diff = Math.max(1, Math.round((parseISO(anchor) - parseISO(start)) / 86400000) + 1);
  days = Math.min(360, diff);
  startISO = baseline ? baseline : addDays(anchor, -(days-1));
}

  
  const list = [];
  for (let i=0;i<days;i++){
    const iso = addDays(startISO, i);
    const e2 = entries2[iso] || {};
    const w100 = normalizeValenceTo100(e2.wellness ?? e2.valence);
    const moodIdx = moodIndexFromValence(w100);

    const se = e2.sideEffects || {};
    const seCount = SE_DEFS.reduce((acc,[k])=> acc + ((Number(se[k]||0) > 0) ? 1 : 0), 0);
    const seSum   = SE_DEFS.reduce((acc,[k])=> acc + (Number(se[k]||0) || 0), 0);

    const rec = v1[iso] || {};
    const dose = Math.round(Number(rec.dose ?? rec.mg ?? 0) || 0);
    const miss = (rec.miss === true) || (rec.taken === false);

    list.push({
      iso,
      moodIdx,
      moodLabel: moodLabel(moodIdx),
      se,
      seCount,
      seSum,
      dose,
      miss,
    });
  }
  return { list, baseline };
}

/* ===================== Helpers ===================== */
function fitCanvas(canvas){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const cssW = canvas.clientWidth || 1;
  const cssH = canvas.clientHeight || 1;
  const w = Math.round(cssW * dpr);
  const h = Math.round(cssH * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
  }
  return { ctx: canvas.getContext('2d'), w, h, dpr, cssW, cssH };
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
function monthLabel(iso){
  const d = parseISO(iso);
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function monthSpanLabel(aISO, bISO){
  const a = parseISO(aISO), b = parseISO(bISO);
  const aKey = `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}`;
  const bKey = `${b.getFullYear()}-${String(b.getMonth()+1).padStart(2,'0')}`;
  if (aKey === bKey) return monthLabel(aISO);
  const aTxt = `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  const bTxt = `${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  return `${aTxt} — ${bTxt}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

/* ===================== Drawing primitives ===================== */
function line(ctx, x1,y1,x2,y2, a=.14){
  ctx.save();
  ctx.strokeStyle = `rgba(236,248,255,${a})`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function drawText(ctx, text, x, y, size, alpha=1, align='left'){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `rgba(236,248,255,${alpha})`;
  ctx.font = `800 ${size}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function drawTextLines(ctx, text, x, y, size, alpha=1, align='right', lh=12){
  const lines = String(text).split('\n');
  lines.forEach((ln, i)=>{
    drawText(ctx, ln, x, y + i*lh, size, alpha, align);
  });
}
function drawEmpty(ctx, w, h, msg){
  ctx.save();
  ctx.fillStyle = 'rgba(236,248,255,.62)';
  ctx.font = `900 ${Math.max(13, Math.round(w/26))}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(msg, w/2, h/2);
  ctx.restore();
}

/* Smooth line (quadratic) */
function strokeSmoothLine(ctx, pts){
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1; i<pts.length-1; i++){
    const midX = (pts[i].x + pts[i+1].x)/2;
    const midY = (pts[i].y + pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
  }
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  ctx.stroke();
}

/* Tooltip */
function showTip(p, clientX, clientY){
  els.tipT1.textContent = p.t1 || '—';
  els.tipT2.textContent = p.t2 || '—';
  els.tipT3.textContent = p.t3 || '';

  const wrap = els.tip.parentElement.getBoundingClientRect();
  const x = clamp(clientX - wrap.left + 10, 12, wrap.width - 200);
  const y = clamp(clientY - wrap.top  - 72, 12, wrap.height - 110);
  els.tip.style.left = x + 'px';
  els.tip.style.top  = y + 'px';
  els.tip.style.display = 'block';
}
function hideTip(){ els.tip.style.display = 'none'; }

function pickPoint(ev){
  const rect = els.chart.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const x = (ev.clientX - rect.left) * dpr;
  const y = (ev.clientY - rect.top)  * dpr;

  let best=null, bestD=1e9;
  hitPoints.forEach(p=>{
    const dx=x - p.x, dy=y - p.y;
    const dd = dx*dx + dy*dy;
    if (dd < bestD){ bestD=dd; best=p; }
  });
  if (!best) return null;
  const thr = (state.metric === 'se') ? (30*dpr)*(30*dpr) : (26*dpr)*(26*dpr);
  if (bestD > thr) return null;
  return best;
}

/* ===================== Pie render (centered, pastel, not "stock") ===================== */
function renderPie(series){
  const { ctx, w, h } = fitCanvas(els.pie);
  ctx.clearRect(0,0,w,h);

  let items = [];

  if (state.pie === 'mood'){
    const counts = Array(7).fill(0);
    series.list.forEach(d=>{ if (d.moodIdx!=null) counts[d.moodIdx]++; });
    items = counts.map((v,i)=> ({ name: MOOD_SCALE[i].label, value: v }));
  } else if (state.pie === 'se'){
    items = SE_DEFS.map(([k,name])=>{
      let c=0;
      series.list.forEach(d=>{ if ((Number(d.se?.[k]||0) > 0)) c++; });
      return { name, value: c };
    });
  } else if (state.pie === 'dose'){
    const map = new Map();
    series.list.forEach(d=>{
      const v = Number(d.dose||0);
      if (v <= 0) return;
      map.set(v, (map.get(v)||0)+1);
    });
    const arr = Array.from(map.entries()).map(([dose, n])=>({name: `${dose} мг`, value:n}));
    arr.sort((a,b)=> b.value - a.value);
    const top = arr.slice(0,4);
    const rest = arr.slice(4).reduce((s,x)=> s + x.value, 0);
    items = top;
    if (rest>0) items.push({name:'Другое', value: rest});
    if (!items.length) items = [{name:'Нет данных', value: 1}];
  }

  let filtered = items.filter(x=>x.value>0);
  if (!filtered.length) filtered = [{name:'Нет данных', value: 1}];

  const total = filtered.reduce((s,x)=> s + x.value, 0) || 1;

  // pastel palette
  const palette = [
    'rgba(72,231,214,.86)',   // mint
    'rgba(198,176,255,.82)',  // lavender
    'rgba(127,208,255,.78)',  // sky
    'rgba(255,147,178,.78)',  // strawberry
    'rgba(236,248,255,.42)',  // light
  ];

  const cx = Math.round(w*0.50);
  const cy = Math.round(h*0.48);
  const r  = Math.round(Math.min(w,h)*0.34);

  // subtle shadow under the pie
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + Math.round(r*0.32), Math.round(r*0.78), Math.round(r*0.28), 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // draw slices (with depth, separators, selection)
pieSectors = [];
let a0 = -Math.PI/2;
filtered.forEach((it, idx)=>{
  const a = (it.value/total) * Math.PI*2;
  const aMid = a0 + a/2;

  const col = palette[idx % palette.length];

  // selection "pop-out" offset
  const sel = (state.selectedPie === idx);
  const off = sel ? Math.round(r*0.05) : 0;
  const ox = Math.cos(aMid) * off;
  const oy = Math.sin(aMid) * off;

  // subtle slice shadow for depth
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.32)';
  ctx.shadowBlur = sel ? 26 : 18;
  ctx.shadowOffsetY = sel ? 10 : 8;
  ctx.beginPath();
  ctx.moveTo(cx+ox, cy+oy);
  ctx.arc(cx+ox, cy+oy, r, a0, a0+a);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();

  // inner highlight gradient per slice (soft texture)
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  const sg = ctx.createRadialGradient(cx - r*0.25 + ox, cy - r*0.25 + oy, r*0.08, cx+ox, cy+oy, r*1.02);
  sg.addColorStop(0, 'rgba(255,255,255,.22)');
  sg.addColorStop(0.55, 'rgba(255,255,255,.06)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(cx+ox, cy+oy);
  ctx.arc(cx+ox, cy+oy, r, a0, a0+a);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // thicker soft separators
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.lineWidth = sel ? 2.2 : 1.6;
  ctx.shadowColor = 'rgba(0,0,0,.22)';
  ctx.shadowBlur = sel ? 10 : 8;
  ctx.beginPath();
  ctx.moveTo(cx+ox, cy+oy);
  ctx.arc(cx+ox, cy+oy, r, a0, a0+a);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  it._color = col;

  pieSectors.push({
    idx,
    a0,
    a1: a0 + a,
    cx: cx+ox, cy: cy+oy, r,
    name: it.name, value: it.value,
    total,
  });

  a0 += a;
});

  // gentle highlight texture across whole pie
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  const hg = ctx.createRadialGradient(cx - r*0.35, cy - r*0.35, r*0.10, cx, cy, r*1.05);
  hg.addColorStop(0, 'rgba(255,255,255,.26)');
  hg.addColorStop(0.55, 'rgba(255,255,255,.07)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // soft rim
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = Math.max(2, Math.round(r*0.06));
  ctx.beginPath(); ctx.arc(cx,cy, r - ctx.lineWidth/2, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // center label removed (per UX)

  // legend
  els.legend.innerHTML = '';
  filtered.forEach(it=>{
    const row = document.createElement('div');
    row.className = 'lg';
    row.innerHTML = `
      <div class="lg-left">
        <span class="dot" style="background:${it._color}"></span>
        <span class="lg-name">${escapeHtml(it.name)}</span>
      </div>
      <div class="lg-val">${it.value}</div>
    `;
    els.legend.appendChild(row);
  });
}

/* ===================== Summary render ===================== */
function renderSummary(series){
  const list = series.list;

  const cumMg = list.reduce((s,d)=> s + (Number(d.dose)||0), 0);

  const capMg = Number(localStorage.getItem('rt.capsule_mg') || 0);
  const caps = capMg > 0 ? Math.round(cumMg / capMg) : null;

  const misses = list.reduce((s,d)=> s + (d.miss ? 1 : 0), 0);
  const takenDays = list.reduce((s,d)=> s + ((d.dose>0) ? 1 : 0), 0);

  // streak
  let bestStreak = 0, cur = 0;
  list.forEach(d=>{
    const ok = (!d.miss) && (d.dose > 0);
    if (ok){ cur++; bestStreak = Math.max(bestStreak, cur); }
    else { cur = 0; }
  });

  // most frequent mood
  const freq = new Map();
  list.forEach(d=>{
    if (d.moodIdx==null) return;
    freq.set(d.moodIdx, (freq.get(d.moodIdx)||0)+1);
  });
  let topMoodIdx = null, topMoodN = 0;
  for (const [k,v] of freq.entries()){
    if (v > topMoodN){ topMoodN = v; topMoodIdx = k; }
  }

  const seAvg = list.length ? (list.reduce((s,d)=>s+d.seCount,0)/list.length) : 0;

  const pills = [
    { k:'Кумулятивно, мг', v: fmtInt(cumMg) },
    { k:'Капсул выпито', v: (caps==null ? '—' : fmtInt(caps)) },
    { k:'Дней приёма', v: fmtInt(takenDays) },
    { k:'Пропусков', v: fmtInt(misses) },
    { k:'Средняя доза', v: (takenDays ? `${Math.round(cumMg/takenDays)} мг` : '—') },
    { k:'Лучшая серия без пропусков', v: bestStreak ? `${bestStreak} дн.` : '—' },
    { k:'Самое частое самочувствие', v: topMoodIdx==null ? '—' : moodLabel(Number(topMoodIdx)) },
    { k:'Среднее побочек/день', v: (Math.round(seAvg*10)/10).toLocaleString('ru-RU') },
  ];

  els.sumGrid.innerHTML = '';
  pills.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pill';
    el.innerHTML = `<div class="k">${escapeHtml(p.k)}</div><div class="v">${escapeHtml(p.v)}</div>`;
    els.sumGrid.appendChild(el);
  });

  els.summaryHint.textContent =
    state.range === 'week' ? 'за последние 7 дней' :
    state.range === 'month' ? (list.length ? monthSpanLabel(list[0].iso, list[list.length-1].iso) : 'за 30 дней') :
    (series.baseline ? `с ${fmtDate(series.baseline)}` : 'за период курса');
}

function fmtInt(n){
  return Number(n||0).toLocaleString('ru-RU');
}

/* ===================== Wiring ===================== */
function attachSeg(segEl, key, attr){
  segEl.addEventListener('click', (e)=>{
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    const v = b.getAttribute(attr);
    if (!v) return;
    state[key] = v;
    if (key === 'range'){
      // reset anchors
      if (v === 'month'){
        const d = new Date();
        const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
        state.anchorISO = toISO(last);
      } else {
        state.anchorISO = todayISO();
      }
      state.selectedPie = null;
      hideTip(); hidePieTip();
    }
    if (key === 'pie'){ state.selectedPie = null; hidePieTip(); }
    segEl.querySelectorAll('button').forEach(x=> x.classList.toggle('active', x===b));
    rerender();
  });
}

attachSeg(els.rangeSeg,  'range',  'data-range');
attachSeg(els.metricSeg, 'metric', 'data-metric');
attachSeg(els.pieSeg,    'pie',    'data-pie');

// Tooltip interactions
els.chart.addEventListener('pointerdown', (e)=>{
  const p = pickPoint(e);
  if (!p){ hideTip();
  return; }
  showTip(p, e.clientX, e.clientY);
}, {passive:true});
els.chart.addEventListener('pointermove', (e)=>{
  // on desktop: hover
  if (e.pointerType === 'mouse'){
    const p = pickPoint(e);
    if (!p){ hideTip(); return; }
    showTip(p, e.clientX, e.clientY);
  }
}, {passive:true});
els.chart.addEventListener('pointerleave', hideTip, {passive:true});
// Pie interactions: tap a slice to get explanation
function piePick(ev){
  const rect = els.pie.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const x = (ev.clientX - rect.left) * dpr;
  const y = (ev.clientY - rect.top)  * dpr;

  // using base center from last render: approximate by canvas center
  // We stored sector centers in pieSectors (with selection offsets).
  let best = null;
  for (const s of pieSectors){
    const dx = x - s.cx;
    const dy = y - s.cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > s.r) continue;
    const ang = Math.atan2(dy, dx);
    let a = ang;
    // normalize to [-PI/2.. 3PI/2) like our start
    if (a < -Math.PI/2) a += Math.PI*2;
    const a0 = s.a0, a1 = s.a1;
    if (a >= a0 && a <= a1){
      best = s;
      break;
    }
  }
  return best;
}

function showPieTip(s, clientX, clientY){
  const pct = s.total ? Math.round((s.value / s.total) * 100) : 0;
  els.pieTipT1.textContent = s.name;
  els.pieTipT2.textContent = `${s.value} • ${pct}%`;
  if (state.pie === 'se'){
    els.pieTipT3.textContent = 'кол-во дней, когда побочка отмечалась';
  } else if (state.pie === 'dose'){
    els.pieTipT3.textContent = 'кол-во дней с этой дозировкой';
  } else {
    els.pieTipT3.textContent = 'кол-во дней с таким самочувствием';
  }

  const wrap = els.pieTip.parentElement.getBoundingClientRect();
  const x = clamp(clientX - wrap.left, 12, wrap.width - 220);
  const y = clamp(clientY - wrap.top - 86, 12, wrap.height - 120);
  els.pieTip.style.left = (x) + 'px';
  els.pieTip.style.top  = (y) + 'px';
  els.pieTip.style.display = 'block';
}
function hidePieTip(){ els.pieTip.style.display = 'none'; }

els.pie.addEventListener('pointerdown', (e)=>{
  const s = piePick(e);
  if (!s){
    state.selectedPie = null;
    hidePieTip();
    if (currentSeries) renderPie(currentSeries);
    return;
  }
  state.selectedPie = s.idx;
  // re-render only the pie (no full rerender), then show tooltip
  if (currentSeries) renderPie(currentSeries);
  showPieTip(s, e.clientX, e.clientY);
  try{ window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light'); }catch(_){}
}, {passive:true});

els.pie.addEventListener('pointerleave', hidePieTip, {passive:true});

window.addEventListener('resize', ()=> rerender(), {passive:true});

function rerender(){
  const series = buildSeries(state.range, state.anchorISO);
  currentSeries = series;


// Month switch footer (only for Month view)
if (state.range === 'month'){
  els.chartFooter.classList.add('show');

  // label from anchor month
  els.chartFooter.innerHTML = `
    <div class="month-switch">
      <button class="month-btn" type="button" id="mPrev" aria-label="Предыдущий месяц">‹</button>
      <div class="month-label" id="mLabel">${escapeHtml(monthLabel(state.anchorISO))}</div>
      <button class="month-btn" type="button" id="mNext" aria-label="Следующий месяц">›</button>
    </div>`;

  const prev = document.getElementById('mPrev');
  const next = document.getElementById('mNext');

  const lastDayOfMonthISO = (iso)=>{
    const d = parseISO(iso);
    const y = d.getFullYear(), m = d.getMonth();
    const last = new Date(y, m+1, 0).getDate();
    d.setDate(last);
    return toISO(d);
  };

  prev?.addEventListener('click', ()=>{
    const d = parseISO(state.anchorISO);
    d.setDate(15); // safe middle of month
    d.setMonth(d.getMonth()-1);
    state.anchorISO = lastDayOfMonthISO(toISO(d));
    hideTip(); hidePieTip();
    rerender();
  });

  next?.addEventListener('click', ()=>{
    const d = parseISO(state.anchorISO);
    d.setDate(15);
    d.setMonth(d.getMonth()+1);
    state.anchorISO = lastDayOfMonthISO(toISO(d));
    hideTip(); hidePieTip();
    rerender();
  });

} else {
  els.chartFooter.classList.remove('show');
  els.chartFooter.innerHTML = '';
}



  if (state.range === 'week'){
    els.subtitle.textContent = 'за неделю';
  } else if (state.range === 'month'){
    if (series.list.length) els.subtitle.textContent = `за месяц • ${monthSpanLabel(series.list[0].iso, series.list[series.list.length-1].iso)}`;
    else els.subtitle.textContent = 'за месяц';
  } else {
    els.subtitle.textContent = 'за курс';
  }

  renderChart(series);
  renderPie(series);
  renderSummary(series);
  hideTip();

}

// initial

function safeBoot(){
  try{
    rerender();
  }catch(err){
    showErr(err);
  }
}

safeBoot();
</script>
<!-- RT: conditional buffering loader (BODY end) -->
<script id="rt-buffer-loader-js">
  (function(){
    const root = document.documentElement;
    const loader = document.getElementById('rt-loader');
    if(!loader) return;
  
    let pending = 0;
    let showTimer = null;
    let shownAt = 0;
  
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const et = (conn && conn.effectiveType) ? String(conn.effectiveType) : '';
    const netSlow = !!(conn && (conn.saveData || et === '3g' || et === '2g' || et === 'slow-2g'));
  
    function show(){
      if(root.classList.contains('rt-show-loader')) return;
      root.classList.add('rt-show-loader');
      loader.setAttribute('aria-hidden','false');
      shownAt = performance.now();
    }
  
    function hide(){
      const minVisible = 320; // чтобы не мигало, если показали — держим чуть-чуть
      const wait = Math.max(0, minVisible - (performance.now() - shownAt));
  
      setTimeout(()=>{
        root.classList.remove('rt-show-loader','rt-net-slow');
        loader.setAttribute('aria-hidden','true');
      }, wait);
    }
  
    function scheduleShow(){
      if(showTimer) return;
      const delay = netSlow ? 120 : 650;
  
      showTimer = setTimeout(()=>{
        showTimer = null;
        if(pending > 0 && document.visibilityState !== 'hidden') show();
      }, delay);
    }
  
    function inc(){ pending++; scheduleShow(); }
    function dec(){
      pending = Math.max(0, pending - 1);
      if(pending === 0) hide();
    }
  
    // Patch fetch + XHR on this page
    if(!window.__rtLoaderPatched){
      window.__rtLoaderPatched = true;
  
      const _fetch = window.fetch;
      if(typeof _fetch === 'function'){
        window.fetch = function(...args){
          inc();
          return _fetch.apply(this, args).finally(dec);
        };
      }
  
      const _open = XMLHttpRequest.prototype.open;
      const _send = XMLHttpRequest.prototype.send;
  
      XMLHttpRequest.prototype.open = function(...args){
        this.__rtTrack = true;
        return _open.apply(this, args);
      };
      XMLHttpRequest.prototype.send = function(...args){
        if(this.__rtTrack){
          inc();
          this.addEventListener('loadend', dec, {once:true});
        }
        return _send.apply(this, args);
      };
    }
  
    // Если сеть "медленная" по данным браузера — покажем быстро даже без fetch (на случай тяжёлых ресурсов)
    if(netSlow){
      setTimeout(()=>{ if(document.readyState !== 'complete') show(); }, 260);
    }
  
    // Когда страница полностью загрузилась — прячем
    window.addEventListener('load', ()=>{ pending = 0; hide(); }, {once:true});
  
    // Опционально: если у тебя есть долгий init, можешь в конце явно вызвать:
    // window.rtLoaderDone();
    window.rtLoaderDone = ()=>{ pending = 0; hide(); };
  })();
  </script>
