  <style>
    :root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

      --bg: #0c1824;
      --bg-2: #0f2231;
      --surface: rgba(18,33,48,0.8);
      --text: #e8f3ff;
      --muted: #99b4c7;
      --accent: #42e3b8;
      --accent-2: #5aa7ff;
      --danger: #ff7b6b;
      --good: #2ee59d;
      --shadow-strong: 24px 28px 60px rgba(0,0,0,.45);
      --shadow-soft: 10px 12px 22px rgba(0,0,0,.35), -8px -8px 18px rgba(255,255,255,0.03);
      --glow: 0 0 0 2px rgba(255,255,255,.06), inset 0 0 0 1px rgba(255,255,255,.05);
      --grid-gap: 10px;
      --radius-xl: 22px;
      --radius-lg: 16px;
    }
    /* === SELECTED & TODAY === */
:root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

  /* высота нижней навигации (таббара) + safe area */
  --tabbar-h: calc(64px + env(safe-area-inset-bottom));
  /* цвет кольца выбранных дней */
  --selected-ring: rgba(90,167,255,.95);
}

.day.selected{
  outline: 2px solid var(--selected-ring);
  outline-offset: -2px;
  box-shadow:
    0 10px 28px rgba(90,167,255,.30),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.day.today{
  /* отдельный стиль «сегодня» — мягкий светящийся ободок */
  box-shadow:
    0 0 0 2px rgba(255,255,255,.16),
    0 8px 24px rgba(66,227,184,.25),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* доступность: клавиатурная навигация подсвечивает тоже заметно */
.day:focus-visible{
  outline: 2px solid var(--selected-ring);
  outline-offset: -2px;
}

    /* base */
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji';
      color:var(--text);
      background: var(--bg-grad);
      min-height:100vh;
      padding: clamp(14px, 2vw, 24px);
      padding-bottom: calc(max(88px, var(--tabbar-h)) + var(--sheet-gap));
      box-sizing: border-box;
    }
    .brand{
  font-size: clamp(14px, 2.4vw, 18px);
  font-weight: 800;
  letter-spacing: .2px;
  margin: 2px 0 6px;
  color: var(--text);
  opacity: .95;
  text-shadow: 0 1px 0 rgba(0,0,0,.25);
}
    .app-title{
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 800;
      letter-spacing:.3px;
      margin: 4px 0 18px;
      text-shadow: 0 1px 0 rgba(0,0,0,.2);
    }
    .calendar-card{
      position:relative;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-strong), var(--glow);
      padding: 16px;
      overflow:hidden;
    }
    .header{
      display:flex;
      align-items:center;
      justify-content: flex-start;
      gap:12px;
      padding: 6px 4px 12px;
    }
    /* фиксированная ширина бейджа-секции слева */
.sheet-row .badge{ flex:0 0 auto; min-width:120px; }

/* текстовые значения занимают доступное пространство рядом с бейджем */
.sheet-row > :not(.badge):not(.right){ flex:1 1 auto; }

/* кнопку уводим вправо */
.sheet-row .right{ margin-left:auto; }
    .month-nav{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .nav-btn{
      appearance:none;
      border:0;
      border-radius: 14px;
      width:40px; height:40px;
      display:grid; place-items:center;
      color:var(--text);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow-soft);
      cursor:pointer;
      transition: transform .12s ease, background .2s ease;
    }
    .nav-btn:active{ transform: translateY(1px) scale(.98); }
    .month-label{
      font-weight:800;
      font-size: clamp(16px, 2.8vw, 22px);
      letter-spacing:.3px;
    }
    .weekday-row, .grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--grid-gap);
    }
    .weekday{
      text-align:center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing:.6px;
      user-select:none;
    }
    /* day cell */
    .day{
      position:relative;
      border-radius: 16px;
      min-height: 84px;
      padding: 8px;
      background:
        radial-gradient(120px 60px at 10% 0%, rgba(255,255,255,.04), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow: var(--shadow-soft);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      overflow:hidden;
      cursor:pointer;
      touch-action: manipulation;
      -webkit-touch-callout: none;
-webkit-user-select: none;
user-select: none;
-webkit-tap-highlight-color: transparent;
    }
    .day:hover{ background:
      radial-gradient(120px 60px at 10% 0%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03)); }
    .day:active{ transform: translateY(1px); }
    .day.muted{ opacity:.55; }
    .day.today{
      box-shadow: 0 0 0 2px rgba(255,255,255,.16), 0 8px 24px rgba(66,227,184,.25), var(--shadow-soft);
    }
    .day-num{
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
      opacity:.95;
    }
    /* HEATMAP GLOW (вместо сплошной заливки) */
.day{
  position: relative;
  isolation: isolate;          /* свой стек слоёв, чтобы ::after ушёл под контент */
}

.day::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:inherit;
  /* 1) основной «цвет дня» (градиент); 2) мягкое свечение поверх */
  background:
    var(--moodBg, transparent),
    radial-gradient(120% 90% at 50% 20%,
      var(--glowC, transparent) 0 45%, transparent 60%);
  filter: blur(10px) saturate(1.05);
  mix-blend-mode: screen;
  z-index:0;
  pointer-events:none;
}
/* контент поверх свечения */
.day .day-num{ position: relative; z-index: 2; }
.day .marks{ z-index: 2; }     /* без position */

/* метки в ячейке — ВСЕГДА снизу слева, с правой границей для дыхания */
.marks{
  position:absolute;
  left:8px;
  right:8px;               /* было right:auto; */
  bottom:8px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  width:auto;              /* было max-content */
  z-index:2;
}

/* Пушистый шар-настроение внутри ячейки (как в diary) */
.inner{ position:relative; height:100%; z-index:3; } /* важно: контент (число/доза) поверх */

.mood{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:1; /* под .inner, над фоном */
}
.mood img{
  width:74%;
  max-width:120px;
  aspect-ratio:1/1;
  object-fit:contain;
  opacity:.95;
  transform: translateY(6px);
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
}

/* Частицы: неплохо (чуть) / хорошо (больше) / отлично (ещё больше) */
.day{ --sparkle-a:0; --sparkle-size:140px 140px; --sparkle-speed:18s; }

.day.mood-4{ --sparkle-a:.22; --sparkle-size:140px 140px; --sparkle-speed:18s; } /* Неплохо */
.day.mood-5{ --sparkle-a:.38; --sparkle-size:110px 110px; --sparkle-speed:14s; } /* Хорошо */
.day.mood-6{ --sparkle-a:.55; --sparkle-size:80px 80px;  --sparkle-speed:10s; } /* Отлично */

.day::before{
  content:'';
  position:absolute; inset:0;
  pointer-events:none;
  z-index:2;
  opacity: var(--sparkle-a);
  mix-blend-mode: screen;
  background-image:
    radial-gradient(circle at 12px 18px, rgba(255,255,255,.95) 0 1.2px, transparent 1.4px),
    radial-gradient(circle at 48px 42px, rgba(255,255,255,.75) 0 1.1px, transparent 1.3px),
    radial-gradient(circle at 88px 22px, rgba(255,255,255,.85) 0 1.4px, transparent 1.7px),
    radial-gradient(circle at 22px 86px, rgba(255,255,255,.70) 0 1.1px, transparent 1.35px),
    radial-gradient(circle at 74px 78px, rgba(255,255,255,.90) 0 1.3px, transparent 1.6px),
    radial-gradient(circle at 110px 98px, rgba(255,255,255,.65) 0 1.1px, transparent 1.35px);
  background-size: var(--sparkle-size);
  background-repeat: repeat;
  animation: sparkleMove var(--sparkle-speed) linear infinite;
}

@keyframes sparkleMove{
  from{ transform: translate3d(0,0,0); }
  to{ transform: translate3d(-80px,-40px,0); }
}


/* бейдж дозы + иконка-капсула */
.dose{ flex:0 0 auto;
  display:grid;
  grid-template-columns:auto auto;
  grid-template-areas:
    "cap val"
    "unit unit";
  align-items:center;
  gap:4px 8px; /* row gap, col gap */
  padding:0; border:0; background:none; box-shadow:none;
  font-weight:800; font-size:12px; line-height:1.1;
  white-space:normal; /* разрешаем перенос строки для .unit */
}
/* капсулу показываем только если реально «выпил» */
.dose .capsule{ display:none; }
.dose.taken .capsule{ display:inline-block; }

/* капсула как на референсе */
.dose .capsule{
  position:relative;
  width:20px; height:12px; border-radius:999px;
  background: linear-gradient(90deg, #ffffff 0 50%, #14b8a6 0 100%);
  border:1px solid rgba(0,0,0,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.90),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 1.5px 2.5px rgba(0,0,0,.35);
}
.dose .capsule::after{
  content:"";
  position:absolute; left:50%; top:1px; bottom:1px; width:1px; transform:translateX(-.5px);
  background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(0,0,0,.35));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}
.dose .capsule::before{
  content:"";
  position:absolute; left:10%; top:10%; width:40%; height:45%; border-radius:999px;
  background: radial-gradient(70% 70% at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,0));
  filter: blur(.3px);
}

.dose .capsule{ grid-area: cap; }
.dose .val{ grid-area: val; }
.dose .unit{ display:inline-block; opacity:.85; }

/* === MOOD FX (только синий = частицы; мята = люминисценция; зелёный = малахит) === */
.day::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:1;                 /* выше ::after, ниже текста */
  opacity:0;                 /* по умолчанию эффекты выключены */
  background:none;
  mix-blend-mode: screen;
}

/* НЕПЛОХО (mood-4) — СИНИЙ: немного частиц */


/* ХОРОШО (mood-5) — МЯТА: люминисценция (без частиц) */
.day.mood-5::before{
  opacity:.80;
  background:
    radial-gradient(120% 90% at 50% 12%,
      rgba(170,255,245,.32) 0 45%, rgba(170,255,245,0) 72%),
    radial-gradient(90% 70% at 30% 30%,
      rgba(100,255,230,.22) 0 35%, rgba(100,255,230,0) 70%),
    /* “биолюминесцентная” зернистость */

}

/* ОТЛИЧНО (mood-6) — ЗЕЛЁНЫЙ: “малахит” + перелив (без частиц) */
.day.mood-6::before{
  opacity:.85;
  background:
    /* “полосы малахита” */
    conic-gradient(from 210deg at 60% 40%,
      rgba(20,220,140,.00) 0 8%,
      rgba(40,255,180,.18) 10%,
      rgba(18,140,95,.00) 22%,
      rgba(60,255,200,.22) 34%,
      rgba(18,140,95,.00) 48%,
      rgba(40,255,180,.18) 62%,
      rgba(18,140,95,.00) 78%,
      rgba(80,255,210,.16) 92%,
      rgba(20,220,140,.00) 100%),
    /* драгоценный блик */
    linear-gradient(135deg,
      rgba(255,255,255,0) 0 40%,
      rgba(255,255,255,.22) 50%,
      rgba(255,255,255,0) 62%),
    radial-gradient(130% 95% at 50% 10%,
      rgba(80,255,210,.22) 0 42%, rgba(80,255,210,0) 70%);
  background-size: 180% 180%, 220% 220%, 140% 140%;
  background-position: 40% 20%, 0% 0%, 50% 10%;
  filter: blur(.25px) saturate(1.16) contrast(1.06);
  animation: malachiteShift 5.5s ease-in-out infinite;
}

@keyframes malachiteShift{
  0%   { background-position: 40% 20%, 0% 0%, 50% 10%; }
  50%  { background-position: 55% 35%, 35% 20%, 52% 14%; }
  100% { background-position: 40% 20%, 0% 0%, 50% 10%; }
}

@media (prefers-reduced-motion: reduce){
  .day.mood-6::before{ animation:none; }
}

    /* LIGHT palette (оставил для совместимости темы переключателем) */
    body[data-theme="light"]{
      --bg: #f8fbff; --bg-2:#ffffff; --surface: rgba(255,255,255,.75); --text:#0e1b2a; --muted:#6a7993;
      --accent:#ffd4f0; --accent-2:#bfe9ff;
      background:
        radial-gradient(900px 700px at -10% -10%, rgba(255, 204, 170,.45), transparent 60%),
        radial-gradient(900px 700px at 110% 110%, rgba(203, 196, 255,.45), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }
    body[data-theme="light"] .dose{ background:none; }
    body[data-theme="light"] .nav-btn{ background: rgba(14,27,42,.06); }
    body[data-theme="light"] .day{ background:
      radial-gradient(120px 60px at 10% 0%, rgba(14,27,42,.04), transparent 60%),
      linear-gradient(180deg, rgba(14,27,42,.04), rgba(14,27,42,.02)); }
    body[data-theme="light"] .day:hover{ background:
      radial-gradient(120px 60px at 10% 0%, rgba(14,27,42,.06), transparent 60%),
      linear-gradient(180deg, rgba(14,27,42,.06), rgba(14,27,42,.03)); }
    body[data-theme="light"] .day-num{ color:#0e1b2a; text-shadow:none; }

    
    /* --- STATS PILL (compact summary) --- */
    .stats-pill{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      margin: 2px 4px 12px; padding:8px 10px;
      border-radius:14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font-size: 13px; line-height: 1.2;
    }
    .stats-pill .dot{ opacity:.5; }
    .stats-pill b{ font-weight:800; }
    .stats-pill .mini-bar{
      flex: 1 1 140px; height:6px; border-radius:999px;
      background: linear-gradient(90deg, rgba(255,90,90,.25), rgba(255,196,0,.25), rgba(60,235,170,.25));
      overflow:hidden; position:relative;
      border: 1px solid rgba(255,255,255,.08);
    }
    .stats-pill .mini-bar > span{
      position:absolute; left:0; top:0; bottom:0; width:0%;
      background: linear-gradient(90deg,#16dba0,#49a6ff);
      border-radius:inherit; transition: width .35s ease;
    }
    /* Light theme override */
    body[data-theme="light"] .stats-pill{
      background: rgba(14,27,42,.06);
      border-color: rgba(14,27,42,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }
    body[data-theme="light"] .stats-pill .mini-bar{
      border-color: rgba(14,27,42,.08);
      background: linear-gradient(90deg, rgba(255,120,120,.20), rgba(255,196,0,.20), rgba(40,210,150,.20));
    }
    
    /* --- TABBAR --- */
    .tabbar{
      position: fixed; left:0; right:0; bottom:0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: transparent;
      z-index: 50; pointer-events: none; /* контейнер сквозной */
    }
    .tabbar-inner{
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      align-items: center;
      pointer-events: auto; /* кликается */
    }
    .tab{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
      padding: 10px 8px; min-height: 56px;
      border-radius: 16px;
      color: var(--muted); text-decoration:none; font-size:12px; font-weight:600;
      background: rgba(255,255,255,.04);
      box-shadow: var(--shadow-soft);
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
    }
    .tab svg{ width:22px; height:22px; opacity:.9; }
    .tab:active{ transform: translateY(1px); }
    .tab.active{
      color: var(--text);
      background:
        radial-gradient(200px 120px at 50% -40%, rgba(255,255,255,.08), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 10px 26px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.06);
    }
    body[data-theme="light"] .tab{
      background: rgba(14,27,42,.04);
      box-shadow: 6px 8px 16px rgba(14,27,42,.06), -6px -6px 14px rgba(255,255,255,.8);
      color: #5e6b82;
    }
    body[data-theme="light"] .tab.active{
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      box-shadow: 8px 10px 20px rgba(14,27,42,.12), -6px -6px 14px rgba(255,255,255,.9);
      color:#0e1b2a;
    }

:root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

  /* Правишь только эти 5 переменных */
  --vt-out-ms: 500ms;      /* старый экран схлопывается */
  --vt-in-ms:  600ms;      /* новый экран раскрывается   */
  --vt-portal-ms: 700ms;   /* морфинг «двери»            */
  --vt-ease: cubic-bezier(.22,.61,.36,1); /* плавная ease-in-out */
  --vt-new-end: 140%;       /* 140–180% — больше = медленнее по краям */

  /* не трогаем */
  --portal-x: 50vw; --portal-y: 50vh;
}

/* Старый документ — «чёрная дыра» */
html::view-transition-old(root){
  animation: vt-out var(--vt-out-ms) var(--vt-ease) both;
  clip-path: circle(120% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, filter;
  filter: brightness(1) contrast(1);
}
@keyframes vt-out{
  0%   { clip-path: circle(120% at var(--portal-x) var(--portal-y)); }
  100% { clip-path: circle(0%    at var(--portal-x) var(--portal-y)); filter:brightness(.98); }
}

/* Новый документ — «выныривание» из точки */
html::view-transition-new(root){
  animation: vt-in var(--vt-in-ms) var(--vt-ease) both;
  clip-path: circle(0% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, opacity, filter;
  opacity: .98;
}
@keyframes vt-in{
  0%   { clip-path: circle(0% at var(--portal-x) var(--portal-y));   opacity:.96; filter:brightness(.98); }
  60%  { opacity:1; filter:brightness(1.01); }
  100% { clip-path: circle(var(--vt-new-end) at var(--portal-x) var(--portal-y)); filter:none; }
}

/* Морфинг общей «двери» */
::view-transition-group(portal){
  animation: portal-warp var(--vt-portal-ms) var(--vt-ease) both;
  transform-origin: center center;
  will-change: transform, filter;
}
@keyframes portal-warp{
  0%   { transform: perspective(900px) translateZ(0)    scale(1)    rotate(0);   filter:contrast(1)saturate(1); }
  40%  { transform: perspective(900px) translateZ(200px) scale(1.10) rotate(6deg); filter:contrast(1.04)saturate(1.06); }
  100% { transform: perspective(900px) translateZ(620px) scale(26)   rotate(12deg); filter:contrast(1.06)saturate(1.08); }
}

@media (prefers-reduced-motion: reduce){
  html::view-transition-old(root),
  html::view-transition-new(root),
  ::view-transition-group(portal){ animation:none!important; clip-path:none!important; }
}

function quantizeIdxFromValence(v){
  v = Math.max(0, Math.min(100, Number(v)||0));
  return Math.max(0, Math.min(6, Math.round((v/100)*6)));
}

// новая подпись

  return MOOD_STATES[quantizeIdxFromValence(v)];

function firstSentenceWithEllipsis(s){
  if(!s) return '';
  const t=String(s).trim();
  const m=t.match(/(.+?[.!?])(\s|$)/);
  const first=(m?m[1]:t);
  return first.replace(/\s+$/,'')+'…';
}
function sideEffectsCount(entry){
  const se=(entry&&entry.sideEffects)||{};
  let n=0; for(const k in se){ if(Number(se[k])>0) n++; }

function moodGlow(idx){

    case 1: return 'hsla(40,85%,47%,.58)';  // тёмно-оранжевый — плохо
    case 2: return 'hsla(40, 45%, 78%, .52)';  // бежевый — ниже нормы
    case 3: return 'hsla(200,86%,93%,.45)'; // слабый голубой — нейтрально
    case 4: return 'hsla(200, 85%, 55%, .52)'; // насыщенный синий — неплохо
    case 5: return 'hsla(170, 100%, 65%, .52)';  // желто-зелёный — хорошо

  function monthStats(year, month){
  // читаем дневник из localStorage
  const diary = getDiary();
  let mg = 0, taken = 0, miss = 0;
  const days = new Date(year, month+1, 0).getDate();
  const pad = n => String(n).padStart(2,'0');
  for (let d=1; d<=days; d++){
    const id = `${year}-${pad(month+1)}-${pad(d)}`;
    const rec = diary[id];
    if (!rec) continue;
    const dose = Number(rec.dose ?? rec.mg ?? 0);
    const missed = (rec.miss === true) || (rec.taken === false);
    if (missed) { miss++; continue; }
    if (dose > 0){ mg += dose; taken++; }
  }
  const denom = taken + miss;
  const adherence = denom ? Math.round((taken/denom)*100) : 0;
  return {mg, miss, adherence};
}

  if (!cell) return;

  // НЕ включаем drag сразу — иначе ломаем tap/long-press логику
  drag.pending  = true;
  drag.active   = false;
  drag.start    = cell.dataset.date;
  drag.over     = cell.dataset.date;
  drag.pointerId = e.pointerId;

  drag.x0 = e.clientX;
  drag.y0 = e.clientY;
}, { passive: true });

grid.addEventListener('pointermove', (e) => {
  if (!drag.pending && !drag.active) return;

  // если drag ещё не активен — ждём порог движения
  if (!drag.active){
    const dx = e.clientX - (drag.x0 || 0);
    const dy = e.clientY - (drag.y0 || 0);
    if ((dx*dx + dy*dy) < RANGE_START_THR*RANGE_START_THR) return;

    // ВКЛЮЧАЕМ выделение только теперь
    drag.active = true;
    grid.classList.add('dragging');
    try { grid.setPointerCapture(drag.pointerId); } catch(_) {}

    // подсветим стартовый день
    highlightRange(drag.start, drag.over);
  }

  const cell = cellFromPoint(e.clientX, e.clientY);
  if (!cell) return;

  const id = cell.dataset.date;
  if (id === drag.over) return;

  drag.over = id;
  highlightRange(drag.start, drag.over);

  e.preventDefault(); // блокируем скролл ТОЛЬКО во время реального drag
}, { passive: false });

const finishDrag = () => {
  // если выделение так и не началось — это был тап/удержание, не вмешиваемся
  if (!drag.active){
    drag.pending = false;
    return;
  }

  try {
    if (drag.pointerId != null) grid.releasePointerCapture(drag.pointerId);
  } catch (_) {}

  drag.pending = false;
  finalizeRange(); // внутри уже сбрасывает drag.active и снимает .dragging :contentReference[oaicite:2]{index=2}
};

grid.addEventListener('pointerup', finishDrag);
grid.addEventListener('pointercancel', finishDrag);
document.addEventListener('pointerup', finishDrag);



  render();
})();

</script>
<script>
(function(){
  const K_LEFT='rt_capsules_left', K_THRESH='rt_capsules_threshold', K_ON='rt_capsules_alert_enabled';
  const num=(k,d=0)=>{const v=parseInt(localStorage.getItem(k)||d,10);return Number.isFinite(v)?v:0;}
  const on =()=> (localStorage.getItem(K_ON)||'0')==='1';

  function text(){
    if(!on()) return null;
    const left=num(K_LEFT,0), thr=num(K_THRESH,0);
    if(left>0 && thr>0 && left<=thr) return `осталось ${left} капсул`;
    return null;
  }
  function render(){
    document.querySelectorAll('[data-stock-spot]').forEach(host=>{
      let el=host.querySelector('.pill-alert--stock');
      const t=text();
      if(!t){ el?.remove(); return; }
      if(!el){ el=document.createElement('span'); el.className='pill-alert pill-alert--stock'; host.appendChild(el); }
      el.textContent=t;
    });
  }
  window.addEventListener('storage', e=>{
    if([K_LEFT,K_THRESH,K_ON,'rt_capsules_left_bump','rt_capsules_threshold_bump','rt_capsules_alert_bump'].includes(e.key)) render();
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
  render();
  window.renderStockAlert=render;
})();
</script>

<script id="rtTourScript">
(function(){
  const VERSION = 1;
  const STATE_KEY = 'rt.tour.v' + VERSION;
  const DONE_KEY  = 'rt.tour.done.v' + VERSION;

  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  const overlay = $('#rtTourOverlay');
  const pop     = $('#rtTourPop');
  const pointer = $('#rtTourPointer');
  const elStep  = $('#rtTourStep');
  const elTitle = $('#rtTourTitle');
  const elText  = $('#rtTourText');
  const elExtra = $('#rtTourExtra');
  const btnSkip = $('#rtTourSkip');
  const btnFree = $('#rtTourFree');
  const btnNext = $('#rtTourNext');

  function pageKey(){
    const p = (location.pathname.split('/').pop() || '').toLowerCase();
    return p.replace(/\.html(\?.*)?$/,'') || 'main';
  }

  function loadState(){
    try{
      const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
      if (!s || typeof s !== 'object') return null;
      return s;
    }catch(_){ return null; }
  }
  function saveState(s){
    try{ localStorage.setItem(STATE_KEY, JSON.stringify(s)); }catch(_){}
  }
  function isDone(){
    try{ return localStorage.getItem(DONE_KEY) === '1'; }catch(_){ return false; }
  }
  function markDone(){
    try{ localStorage.setItem(DONE_KEY, '1'); }catch(_){}
    try{ localStorage.removeItem(STATE_KEY); }catch(_){}
  }

  let focused = [];
  
  let revealed = [];
let cleanupWait = null;
  let cleanupEnter = null;
  let satisfied = false;

  function clearFocus(){
    focused.forEach(el=>{
      try{
        el.classList.remove('rt-tour-focus','rt-tour-radius-inherit');
        el.removeAttribute('data-rt-tour-focus');
              restorePositioned(el);
      }catch(_){}
    });
    focused = [];

    revealed.forEach(el=>{
      try{
        el.classList.remove('rt-tour-reveal','rt-tour-radius-inherit');
        el.removeAttribute('data-rt-tour-reveal');
              restorePositioned(el);
      }catch(_){}
    });
    revealed = [];
  }

  function visible(on){
    document.body.classList.toggle('rt-tour-on', !!on);
    overlay.classList.toggle('is-on', !!on);
    pop.classList.toggle('is-on', !!on);
    overlay.setAttribute('aria-hidden', on ? 'false' : 'true');
    if(!on) pointer.classList.remove('is-on');
  }

  function rectUnion(els){
    const rs = els.map(e=> e.getBoundingClientRect()).filter(r=> r.width && r.height);
    if(!rs.length) return null;
    let left=rs[0].left, top=rs[0].top, right=rs[0].right, bottom=rs[0].bottom;
    rs.forEach(r=>{
      left=Math.min(left,r.left); top=Math.min(top,r.top);
      right=Math.max(right,r.right); bottom=Math.max(bottom,r.bottom);
    });
    return {left, top, right, bottom, width:right-left, height:bottom-top};
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }


function ensurePositioned(el){
  try{
    const cs = getComputedStyle(el);
    if (cs.position === 'static'){
      // remember inline position so we can restore
      if (!el.dataset.rtTourPrevPos) el.dataset.rtTourPrevPos = (el.style.position || '');
      el.dataset.rtTourWasStatic = '1';
      el.style.position = 'relative';
    }
  }catch(_){}
}

function restorePositioned(el){
  try{
    if (el.dataset.rtTourWasStatic === '1'){
      const prev = el.dataset.rtTourPrevPos || '';
      if (prev) el.style.position = prev;
      else el.style.removeProperty('position');
    }
    delete el.dataset.rtTourWasStatic;
    delete el.dataset.rtTourPrevPos;
  }catch(_){}
}

  function rectIntersects(a,b){
  if(!a || !b) return false;
  return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
}

function placeUI(targetRect, avoidRect, step){
  const vw = window.innerWidth, vh = window.innerHeight;
  const SAFE = 14;
  const GAP  = 14;

  // pointer near top-right of target
  if (targetRect){
    const px = clamp(targetRect.right - 8, SAFE, vw - SAFE);
    const py = clamp(targetRect.top + 10, SAFE, vh - SAFE);
    pointer.style.left = px + 'px';
    pointer.style.top  = py + 'px';
  } else {
    pointer.style.left = (vw/2) + 'px';
    pointer.style.top  = (vh/2) + 'px';
  }

  // popover width
  const popW = Math.min(380, vw - 28);
  pop.style.width = popW + 'px';
  pop.style.maxWidth = popW + 'px';

  // measure height after content render
  const popH = pop.offsetHeight || 200;

  const align = (step && step.popAlign) || 'start'; // start|center|end
  const preferred = (step && step.popPlacement) || null;

  const xAligned = (rect)=>{
    if (!rect) return clamp((vw - popW)/2, SAFE, vw - popW - SAFE);
    if (align === 'center') return clamp(rect.left + (rect.width - popW)/2, SAFE, vw - popW - SAFE);
    if (align === 'end')    return clamp(rect.right - popW, SAFE, vw - popW - SAFE);
    return clamp(rect.left, SAFE, vw - popW - SAFE); // start
  };

  const candidates = [];
  const push = (p)=>{ if(p && !candidates.includes(p)) candidates.push(p); };
  push(preferred);
  ['below','above','right','left','center'].forEach(push);

  let best = { x: SAFE, y: SAFE };

  const avoid = avoidRect || targetRect;

  for (const p of candidates){
    let x = SAFE, y = SAFE;

    if (!targetRect){
      x = clamp((vw - popW)/2, SAFE, vw - popW - SAFE);
      y = clamp((vh - popH)/2, SAFE, vh - popH - SAFE);
      best = {x,y};
      break;
    }

    if (p === 'below'){
      x = xAligned(targetRect);
      y = targetRect.bottom + GAP;
    } else if (p === 'above'){
      x = xAligned(targetRect);
      y = targetRect.top - GAP - popH;
    } else if (p === 'right'){
      x = targetRect.right + GAP;
      y = clamp(targetRect.top, SAFE, vh - popH - SAFE);
    } else if (p === 'left'){
      x = targetRect.left - GAP - popW;
      y = clamp(targetRect.top, SAFE, vh - popH - SAFE);
    } else { // center
      x = (vw - popW)/2;
      y = (vh - popH)/2;
    }

    x = clamp(x, SAFE, vw - popW - SAFE);
    y = clamp(y, SAFE, vh - popH - SAFE);

    const candRect = { left:x, top:y, right:x+popW, bottom:y+popH };

    // Prefer placements that do not cover the avoid-rect (usually the revealed context)
    if (!avoid || !rectIntersects(candRect, avoid) || p === 'center'){
      best = {x,y};
      break;
    }

    // fallback candidate (keep last tried)
    best = {x,y};
  }

  pop.style.left = best.x + 'px';
  pop.style.top  = best.y + 'px';
}

  function setContent(step, idx, total){
    elStep.textContent = `Шаг ${idx+1} из ${total}`;
    elTitle.textContent = step.title || '—';
    elText.textContent  = step.text  || '';
    elExtra.innerHTML   = step.extraHTML || '';
    btnNext.textContent = (step.primary && step.primary.label) ? step.primary.label : (step.nextLabel || 'Далее');
  }

  function setSatisfied(v){
    satisfied = !!v;
    const must = currentStep()?.require;
    // show "Дальше" only when there is an action requirement
    if (btnFree) btnFree.style.display = must ? '' : 'none';
    if (!must){
      btnNext.disabled = false;
      return;
    }
    btnNext.disabled = !satisfied;
  }

  function currentStep(){
    const key = pageKey();
    const list = STEPS[key] || [];
    const st = loadState();
    const idx = st?.idx ?? 0;
    return list[idx] || null;
  }

  function ensureTargets(step){
    let els = [];
    const addEl = (e)=>{
      if(!e || !(e instanceof Element)) return;
      if (e.offsetParent === null && getComputedStyle(e).position !== 'fixed') return; // hidden
      els.push(e);
    };

    if (typeof step.focus === 'function'){
      try{
        const res = step.focus();
        (Array.isArray(res) ? res : [res]).forEach(addEl);
      }catch(_){}
    } else if (Array.isArray(step.focus)){
      step.focus.forEach(sel=>{
        if (typeof sel === 'string'){
          $$(sel).forEach(addEl);
        }
      });
    }

    // if nothing found and step can be skipped automatically
    if (!els.length && step.skipIfMissing) return null;
    return els;
  }

  
  function ensureReveal(step){
    let els = [];
    const addEl = (e)=>{
      if(!e || !(e instanceof Element)) return;
      if (e.offsetParent === null && getComputedStyle(e).position !== 'fixed') return; // hidden
      els.push(e);
    };

    if (typeof step.reveal === 'function'){
      try{
        const res = step.reveal();
        (Array.isArray(res) ? res : [res]).forEach(addEl);
      }catch(_){}
    } else if (Array.isArray(step.reveal)){
      step.reveal.forEach(sel=>{
        if (typeof sel === 'string'){
          $$(sel).forEach(addEl);
        }
      });
    }
    return els;
  }

function attachRequire(step){
    if (!step.require) { setSatisfied(true); return null; }
    if (step.require === 'manual') { setSatisfied(false); return null; }

    setSatisfied(false);

    // generic "any of" support
    const reqs = Array.isArray(step.require) ? step.require : [step.require];
    const off = [];

    const mark = ()=>{
      setSatisfied(true);
      if (step.autoNext && !step.primary){
        // auto-advance only if it's an in-page step
        setTimeout(next, 80);
      }
    };

    reqs.forEach(req=>{
      const type = req.type || 'click';
      const sel  = req.selector;
      if (!sel) return;

      const handler = (e)=>{
        const hit = e.target && (e.target.closest ? e.target.closest(sel) : null);
        if (!hit) return;
        if (req.preventDefault) { try{ e.preventDefault(); }catch(_){ } }
        if (req.stopPropagation) {
          try{ e.stopImmediatePropagation(); }catch(_){}
          try{ e.stopPropagation(); }catch(_){}
        }
        mark();
      };

      if (type === 'input'){
        const inputHandler = (e)=>{
          const hit = e.target && (e.target.closest ? e.target.closest(sel) : null);
          if (!hit) return;
          // allow "non-empty" requirement
          if (req.nonEmpty){
            const v = (hit.value ?? '').toString().trim();
            if (!v) return;
          }
          mark();
        };
        document.addEventListener('input', inputHandler, true);
        off.push(()=> document.removeEventListener('input', inputHandler, true));
      } else if (type === 'change'){
        document.addEventListener('change', handler, true);
        off.push(()=> document.removeEventListener('change', handler, true));
      } else { // click
        document.addEventListener('click', handler, true);
        off.push(()=> document.removeEventListener('click', handler, true));
      }
    });

    return ()=> off.forEach(fn=>{ try{ fn(); }catch(_){ } });
  }

  function attachEnter(step){
    if (typeof step.onEnter !== 'function') return null;
    try{ return step.onEnter({setSatisfied}); }catch(_){ return null; }
  }

  function show(){
    const key = pageKey();
    const list = STEPS[key] || [];
    const st = loadState() || {active:false, page:key, idx:0};

    if (!st.active) return;
    if (st.page !== key){
      // если пользователь ушёл руками на другую страницу — продолжаем с первого шага этой страницы
      st.page = key;
      st.idx  = 0;
      saveState(st);
    }

    const step = list[st.idx];
    if (!step){
      visible(false);
      clearFocus();
      markDone();
      return;
    }

    // cleanup previous
    if (cleanupWait){ try{ cleanupWait(); }catch(_){ } cleanupWait=null; }
    if (cleanupEnter){ try{ cleanupEnter(); }catch(_){ } cleanupEnter=null; }
    clearFocus();

    // targets
    const targets = ensureTargets(step);
    if (targets === null){
      // auto-skip this step
      next();
      return;
    }

    focused = targets || [];

    // reveal (visible context without glow)
    const reveals = ensureReveal(step) || [];
    revealed = reveals;
    revealed.forEach(el=>{
      try{
        ensurePositioned(el);
        el.classList.add('rt-tour-reveal');
        if (step.radiusInherit) el.classList.add('rt-tour-radius-inherit');
        el.setAttribute('data-rt-tour-reveal','1');
      }catch(_){}
    });

    focused.forEach(el=>{
      try{
        ensurePositioned(el);
        el.classList.add('rt-tour-focus');
        if (step.radiusInherit) el.classList.add('rt-tour-radius-inherit');
        el.setAttribute('data-rt-tour-focus','1');
      }catch(_){}
    });

    // scroll to first target
    if (focused[0] && focused[0].scrollIntoView){
      try{ focused[0].scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); }catch(_){}
    }

    // content + positioning
    visible(true);
    setContent(step, st.idx, list.length);

    // attach enter hook (e.g. long-press practice)
    cleanupEnter = attachEnter(step);

    // requirements gating
    cleanupWait = attachRequire(step);

    // position after layout
    setTimeout(()=>{
      const rFocus = rectUnion(focused);
      let avoidEls = focused.slice();
      const mode = (step && step.avoidCover) || 'focus';
      if (mode === 'reveal') avoidEls = revealed.slice();
      else if (mode === 'all') avoidEls = focused.concat(revealed);
      const rAvoid = rectUnion(avoidEls);
      placeUI(rFocus, rAvoid, step);
      const wantPointer = (step.pointer !== false) && !!rFocus;
      pointer.classList.toggle('is-on', wantPointer);
    }, 0);
  }

  function navigateTo(page){
    const base = location.pathname.replace(/[^\/]*$/, '');
    const url  = base + page + '.html';
    location.href = url;
  }

  function next(force=false){
    const key = pageKey();
    const list = STEPS[key] || [];
    const st = loadState() || {active:true, page:key, idx:0};

    // if current step defines primary click (CTA), handle it
    const step = list[st.idx];
    if (step?.primary?.click){
      const target = $(step.primary.click);
      if (target){
        // if click leads to navigation, persist the next page step beforehand
        if (step.primary.nextPage){
          saveState({active:true, page: step.primary.nextPage, idx:0});
        }
        try{ target.click(); }catch(_){}
        return;
      }
      // fallback to navigation if element missing
      if (step.primary.nextPage){
        saveState({active:true, page: step.primary.nextPage, idx:0});
        navigateTo(step.primary.nextPage);
        return;
      }
    }

    // normal flow
    if (step?.primary?.nextPage){
      saveState({active:true, page: step.primary.nextPage, idx:0});
      navigateTo(step.primary.nextPage);
      return;
    }

    st.idx = (st.idx ?? 0) + 1;

    if (st.idx >= list.length){
      // finish this page: if there's an explicit nextPageForFinish, go there; otherwise mark done
      if (step?.nextPageOnFinish){
        saveState({active:true, page: step.nextPageOnFinish, idx:0});
        navigateTo(step.nextPageOnFinish);
        return;
      }
      visible(false);
      clearFocus();
      markDone();
      return;
    }

    saveState(st);
    show();
  }

  function skip(){
    visible(false);
    clearFocus();
    if (cleanupWait){ try{ cleanupWait(); }catch(_){ } cleanupWait=null; }
    if (cleanupEnter){ try{ cleanupEnter(); }catch(_){ } cleanupEnter=null; }
    markDone();
  }

  btnSkip?.addEventListener('click', skip);
  btnFree?.addEventListener('click', ()=> next(true));
  btnNext?.addEventListener('click', ()=> next(false));
  overlay?.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); });

  window.addEventListener('resize', ()=>{
    if (!overlay.classList.contains('is-on')) return;
    const r = rectUnion(focused);
    placeUI(r);
    pointer.classList.toggle('is-on', (currentStep()?.pointer !== false) && !!r);
  });

  // -------- Steps mapping (editable) --------
  const pick = {
    calendarDay(){
      return $('.day.today') || $('.day');
    }
  };

  const STEPS = {
    
main: [

        focus: [],
        pointer: false,

      {

        reveal: ['#cardDose', '#cardProgress', '#cardReminder'],

        radiusInherit: true,
        require: {type:'click', selector:'#save'},
      },
      {
        title: 'Календарь',
        text: 'Быстрый обзор недели. «Открыть» — полный календарь.',
        reveal: ['#cardCalendar'],
        focus: ['#openCalendarBtn', '#calPrev', '#calNext'],
        radiusInherit: true,
      },
      {
        title: 'Напоминания',
        text: 'Включите напоминание и выберите время.',
        reveal: ['#cardReminder'],
        focus: ['#remCtrl input', '#remTime'],
        radiusInherit: true,
        extra(){
          return `
            <div class="rt-extras">
              <div class="rt-notif"><b>🔔 Roaccutane Tracker</b><span class="muted">Пора принять препарат</span></div>
              <div class="rt-notif"><b>🧴 Roaccutane Tracker</b><span class="muted">Капсул осталось мало — пора докупить</span></div>

          `;
        }
      },
      {

      },
      {

    calendar:
 [

        reveal: ['#card'],

      },
      {
        title: 'Карточка дня',
        text: 'Снизу — самочувствие, доза и заметка. «Открыть дневник» — подробности.',
        reveal: ['#sheet'],
        focus: ['#sheet', '#openDiary', '#doseEdit'],

        popPlacement: 'above',
      },
      {

        reveal: ['#card'],

        onEnter: ({setSatisfied})=>{

          if (typeof orig !== 'function') { setSatisfied(true); return null; }
          window.prompt = function(msg, def){

            try{
              if (typeof msg === 'string' && msg.startsWith('Установить одинаковую дозу')) {
                if (res !== null && String(res).trim() !== '') setTimeout(()=>setSatisfied(true), 0);
              }
            }catch(_){}
            return res;

          return ()=>{ try{ window.prompt = orig; }catch(_){ } };
        },
      },
      {

myprofile: [

        focus: ['#remToggle', '#remTime', '#remStock', '#stockThreshold'],

        focus: ['#moodScene', '#moodBar', '#confirmMood'],

      },

        focus: ['#seList'],

        focus: ['nav.navbar a[href$="labs.html"]', '.bottom-nav #navLabs', 'a[href$=\"labs.html\"]'],
        radiusInherit: true,

      },
    ],

    labs: [
      {
        title: 'Пол и нормы',

        focus: ['#sexSeg'],
        radiusInherit: true,
        require: {type:'click', selector:'#sexSeg button'},
      },
      {

        text: 'Введите показатели из бланка (например, АЛТ) — справа появится статус.',
        focus: ['.field[data-key="ALT"]', '.field[data-key="ALT"] input'],
        radiusInherit: true,
        require: {type:'input', selector:'.field[data-key="ALT"] input', nonEmpty:true},
      },
      {

        text: 'Нажмите «Сохранить значения» — данные сохранятся на этом устройстве.',
        focus: ['#saveBtn'],
        radiusInherit: true,
        require: {type:'click', selector:'#saveBtn'},
      },
      {
        title: 'Готово',
        text: 'Вы освоили основные функции. Тур можно будет включить снова из настроек (если добавим кнопку).',
        focus: ['#pageRoot'],
        skipIfMissing: true,
        radiusInherit: true,
      },
    ],
  };

  // -------- Autostart --------
  function shouldAutostart(){
    if (isDone()) return false;

    const st = loadState();
    if (st?.active) return true; // продолжить на любой странице

    // новый запуск — только с main
    return pageKey() === 'main';
  }

  function start(){
    saveState({active:true, page: pageKey(), idx:0});
    show();
  }

  function init(){
    const st = loadState();

    // если тур уже идёт — просто показываем текущий шаг на этой странице
    if (st?.active){
      setTimeout(()=>{ show(); }, 120);
      return;
    }

    // иначе — автостарт только на main
    if (shouldAutostart()){
      setTimeout(()=>{ start(); }, 220);
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Expose small API (optional)
  window.RTTour = {
    start: ()=>{ try{ localStorage.removeItem(DONE_KEY); }catch(_){ } start(); },
    stop: skip,
  };
})();
