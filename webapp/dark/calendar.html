  <style>
    :root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

      --bg: #0c1824;
      --bg-2: #0f2231;
      --surface: rgba(18,33,48,0.8);
      --text: #e8f3ff;
      --muted: #99b4c7;
      --accent: #42e3b8;
      --accent-2: #5aa7ff;
      --danger: #ff7b6b;
      --good: #2ee59d;
      --shadow-strong: 24px 28px 60px rgba(0,0,0,.45);
      --shadow-soft: 10px 12px 22px rgba(0,0,0,.35), -8px -8px 18px rgba(255,255,255,0.03);
      --glow: 0 0 0 2px rgba(255,255,255,.06), inset 0 0 0 1px rgba(255,255,255,.05);
      --grid-gap: 10px;
      --radius-xl: 22px;
      --radius-lg: 16px;
    }
    /* === SELECTED & TODAY === */
:root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

  /* высота нижней навигации (таббара) + safe area */
  --tabbar-h: calc(64px + env(safe-area-inset-bottom));
  /* цвет кольца выбранных дней */
  --selected-ring: rgba(90,167,255,.95);
}

.day.selected{
  outline: 2px solid var(--selected-ring);
  outline-offset: -2px;
  box-shadow:
    0 10px 28px rgba(90,167,255,.30),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.day.today{
  /* отдельный стиль «сегодня» — мягкий светящийся ободок */
  box-shadow:
    0 0 0 2px rgba(255,255,255,.16),
    0 8px 24px rgba(66,227,184,.25),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* доступность: клавиатурная навигация подсвечивает тоже заметно */
.day:focus-visible{
  outline: 2px solid var(--selected-ring);
  outline-offset: -2px;
}

    /* base */
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji';
      color:var(--text);
      background: var(--bg-grad);
      min-height:100vh;
      padding: clamp(14px, 2vw, 24px);
      padding-bottom: max(88px, calc(64px + env(safe-area-inset-bottom))); /* место под таббар */
      box-sizing: border-box;
    }
    .brand{
  font-size: clamp(14px, 2.4vw, 18px);
  font-weight: 800;
  letter-spacing: .2px;
  margin: 2px 0 6px;
  color: var(--text);
  opacity: .95;
  text-shadow: 0 1px 0 rgba(0,0,0,.25);
}
    .app-title{
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 800;
      letter-spacing:.3px;
      margin: 4px 0 18px;
      text-shadow: 0 1px 0 rgba(0,0,0,.2);
    }
    .calendar-card{
      position:relative;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-strong), var(--glow);
      padding: 16px;
      overflow:hidden;
    }
    .header{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:12px;
      padding: 6px 4px 12px;
    }
    .month-nav{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .nav-btn{
      appearance:none;
      border:0;
      border-radius: 14px;
      width:40px; height:40px;
      display:grid; place-items:center;
      color:var(--text);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow-soft);
      cursor:pointer;
      transition: transform .12s ease, background .2s ease;
    }
    .nav-btn:active{ transform: translateY(1px) scale(.98); }
    .month-label{
      font-weight:800;
      font-size: clamp(16px, 2.8vw, 22px);
      letter-spacing:.3px;
    }
    .weekday-row, .grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--grid-gap);
    }
    .weekday{
      text-align:center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing:.6px;
      user-select:none;
    }
    /* day cell */
    .day{
      position:relative;
      border-radius: 16px;
      min-height: 84px;
      padding: 8px;
      background:
        radial-gradient(120px 60px at 10% 0%, rgba(255,255,255,.04), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow: var(--shadow-soft);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      overflow:hidden;
      cursor:pointer;
      touch-action: manipulation;
    }
    .day:hover{ background:
      radial-gradient(120px 60px at 10% 0%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03)); }
    .day:active{ transform: translateY(1px); }
    .day.muted{ opacity:.55; }
    .day.today{
      box-shadow: 0 0 0 2px rgba(255,255,255,.16), 0 8px 24px rgba(66,227,184,.25), var(--shadow-soft);
    }
    .day-num{
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
      opacity:.95;
    }
    /* HEATMAP GLOW (вместо сплошной заливки) */
.day{
  position: relative;
  isolation: isolate;          /* свой стек слоёв, чтобы ::after ушёл под контент */
}

.day::after{
  content:"";
  position:absolute;
  inset:-6px;                  /* чуть шире ячейки для мягкого края */
  border-radius:inherit;
  background: radial-gradient(120% 90% at 50% 20%,
              var(--glowC, transparent) 0 45%, transparent 60%);
  filter: blur(14px) saturate(1.05);
  mix-blend-mode: screen;      /* светится, не забивает фон */
  opacity: 1;
  z-index: 0;                  /* под контентом */
  pointer-events:none;
}

/* контент поверх свечения */
.day .day-num{ position: relative; z-index: 2; }
.day .marks{ z-index: 2; }     /* без position */

/* метки в ячейке — ВСЕГДА снизу слева, с правой границей для дыхания */
.marks{
  position:absolute;
  left:8px;
  right:8px;               /* было right:auto; */
  bottom:8px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  width:auto;              /* было max-content */
  z-index:2;
}

/* смайлик не расширяет капсулу — уезжает вправо */
.mood{ margin-left:auto; opacity:.7; }

/* бейдж дозы + иконка-капсула */
.dose{ flex:0 0 auto;
  display:grid;
  grid-template-columns:auto auto;
  grid-template-areas:
    "cap val"
    "unit unit";
  align-items:center;
  gap:4px 8px; /* row gap, col gap */
  padding:0; border:0; background:none; box-shadow:none;
  font-weight:800; font-size:12px; line-height:1.1;
  white-space:normal; /* разрешаем перенос строки для .unit */
}
/* капсулу показываем только если реально «выпил» */
.dose .capsule{ display:none; }
.dose.taken .capsule{ display:inline-block; }

/* капсула как на референсе */
.dose .capsule{
  position:relative;
  width:20px; height:12px; border-radius:999px;
  background: linear-gradient(90deg, #ffffff 0 50%, #14b8a6 0 100%);
  border:1px solid rgba(0,0,0,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.90),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 1.5px 2.5px rgba(0,0,0,.35);
}
.dose .capsule::after{
  content:"";
  position:absolute; left:50%; top:1px; bottom:1px; width:1px; transform:translateX(-.5px);
  background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(0,0,0,.35));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}
.dose .capsule::before{
  content:"";
  position:absolute; left:10%; top:10%; width:40%; height:45%; border-radius:999px;
  background: radial-gradient(70% 70% at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,0));
  filter: blur(.3px);
}

.dose .capsule{ grid-area: cap; }
.dose .val{ grid-area: val; }
.dose .unit{ display:none; }
/* звёзды для "Отлично" */
.day::before{
  content:""; position:absolute; inset:-6px; border-radius:inherit;
  opacity:0; pointer-events:none; z-index:1; mix-blend-mode:screen;
  /* несколько «слоёв» звёзд */
  background:
    radial-gradient(2px 2px at 15% 28%, rgba(255,255,255,.9) 0 60%, transparent 62%),
    radial-gradient(1.4px 1.4px at 42% 18%, rgba(255,255,255,.8) 0 60%, transparent 62%),
    radial-gradient(1.6px 1.6px at 68% 52%, rgba(255,255,255,.8) 0 60%, transparent 62%),
    radial-gradient(1.0px 1.0px at 78% 36%, rgba(255,255,255,.7) 0 60%, transparent 62%),
    radial-gradient(0.8px 0.8px at 30% 70%, rgba(255,255,255,.65) 0 60%, transparent 62%);
  transition: opacity .2s ease;
}
.day.mood-6::before{ opacity:.9; } /* показываем звёзды только на "Отлично" */



    /* bottom sheet */
    .sheet{
      position: fixed; left:0; right:0; bottom: var(--tabbar-h);
      background: var(--surface); color: var(--text);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,.45);
      transform: translateY(110%);
      transition: transform .35s cubic-bezier(.2,.7,.2,1);
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 40;
    }
    .sheet.active{ transform: translateY(0); }
    .drag-handle{ width: 46px; height: 5px; border-radius: 12px; background: rgba(255,255,255,.2); margin: 6px auto 10px; }
    .sheet-head{ display:flex; align-items:center; justify-content: space-between; gap:8px; margin-bottom: 8px; }
    .sheet-title{ font-weight:800; }
    .pill{
      border:0; cursor:pointer; border-radius: 999px; padding:10px 14px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      color:#06131d; font-weight:800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 18px rgba(66,227,184,.25);
      transition: transform .12s ease;
    }
    .pill:active{ transform: translateY(1px); }
    .sheet-row{ display:flex; gap:10px; align-items:center; margin:10px 0; }
    .badge{ padding:6px 10px; border-radius: 12px; background: rgba(255,255,255,.06); }
    .right{ margin-left:auto; }
    .day.pressing{ box-shadow: inset 0 6px 18px rgba(0,0,0,.35), inset 0 -6px 12px rgba(255,255,255,.03); }

    
    .scrim{
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
      z-index: 39;  /* на уровень ниже .sheet (40) */
    }
    .scrim.active{ opacity:1; pointer-events:auto; }

}

@media (max-width: 520px){

} /* оставляем как у тебя */

}

    /* --- STATS PILL (compact summary) --- */

      border-radius:14px;

      flex: 1 1 140px; height:6px; border-radius:999px;

      position:absolute; left:0; top:0; bottom:0; width:0%;

    }

    body[data-theme="light"] .stats-pill{
      background: rgba(14,27,42,.06);

    }

      border-color: rgba(14,27,42,.08);
      background: linear-gradient(90deg, rgba(255,120,120,.20), rgba(255,196,0,.20), rgba(40,210,150,.20));
    }
    
    /* --- TABBAR --- */
    .tabbar{
      position: fixed; left:0; right:0; bottom:0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: transparent;
      z-index: 50; pointer-events: none; /* контейнер сквозной */
    }
    .tabbar-inner{
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      align-items: center;
      pointer-events: auto; /* кликается */
    }
    .tab{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
      padding: 10px 8px; min-height: 56px;
      border-radius: 16px;
      color: var(--muted); text-decoration:none; font-size:12px; font-weight:600;
      background: rgba(255,255,255,.04);
      box-shadow: var(--shadow-soft);
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
    }
    .tab svg{ width:22px; height:22px; opacity:.9; }
    .tab:active{ transform: translateY(1px); }
    .tab.active{
      color: var(--text);
      background:
        radial-gradient(200px 120px at 50% -40%, rgba(255,255,255,.08), transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 10px 26px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.06);
    }
    body[data-theme="light"] .tab{
      background: rgba(14,27,42,.04);
      box-shadow: 6px 8px 16px rgba(14,27,42,.06), -6px -6px 14px rgba(255,255,255,.8);
      color: #5e6b82;
    }
    body[data-theme="light"] .tab.active{
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      box-shadow: 8px 10px 20px rgba(14,27,42,.12), -6px -6px 14px rgba(255,255,255,.9);
      color:#0e1b2a;
    }

/* === PORTAL (calendar → diary) — плавная и длиннее === */
:root{
  --bg: #0b0f16;
  --bg-grad:
    radial-gradient(1100px 620px at 12% -10%, rgba(255, 119, 156, .14) 0%, rgba(255, 119, 156, .06) 36%, transparent 60%),
    radial-gradient(950px 680px at 88% 92%, rgba(56, 189, 248, .16) 0%, rgba(56, 189, 248, .08) 35%, transparent 60%),
    radial-gradient(1200px 900px at 42% 30%, rgba(250, 204, 21, .10) 0%, rgba(250, 204, 21, .04) 35%, transparent 62%),
    linear-gradient(#0b0f16,#0b0f16);

  /* Правишь только эти 5 переменных */
  --vt-out-ms: 1100ms;      /* старый экран схлопывается */
  --vt-in-ms:  1200ms;      /* новый экран раскрывается   */
  --vt-portal-ms: 1300ms;   /* морфинг «двери»            */
  --vt-ease: cubic-bezier(.22,.61,.36,1); /* плавная ease-in-out */
  --vt-new-end: 160%;       /* 140–180% — больше = медленнее по краям */

  /* не трогаем */
  --portal-x: 50vw; --portal-y: 50vh;
}

/* Старый документ — «чёрная дыра» */
html::view-transition-old(root){
  animation: vt-out var(--vt-out-ms) var(--vt-ease) both;
  clip-path: circle(120% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, filter;
  filter: brightness(1) contrast(1);
}
@keyframes vt-out{
  0%   { clip-path: circle(120% at var(--portal-x) var(--portal-y)); }
  100% { clip-path: circle(0%    at var(--portal-x) var(--portal-y)); filter:brightness(.98); }
}

/* Новый документ — «выныривание» из точки */
html::view-transition-new(root){
  animation: vt-in var(--vt-in-ms) var(--vt-ease) both;
  clip-path: circle(0% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, opacity, filter;
  opacity: .98;
}
@keyframes vt-in{
  0%   { clip-path: circle(0% at var(--portal-x) var(--portal-y));   opacity:.96; filter:brightness(.98); }
  60%  { opacity:1; filter:brightness(1.01); }
  100% { clip-path: circle(var(--vt-new-end) at var(--portal-x) var(--portal-y)); filter:none; }
}

/* Морфинг общей «двери» */
::view-transition-group(portal){
  animation: portal-warp var(--vt-portal-ms) var(--vt-ease) both;
  transform-origin: center center;
  will-change: transform, filter;
}
@keyframes portal-warp{
  0%   { transform: perspective(900px) translateZ(0)    scale(1)    rotate(0);   filter:contrast(1)saturate(1); }
  40%  { transform: perspective(900px) translateZ(200px) scale(1.10) rotate(6deg); filter:contrast(1.04)saturate(1.06); }
  100% { transform: perspective(900px) translateZ(620px) scale(26)   rotate(12deg); filter:contrast(1.06)saturate(1.08); }
}

@media (prefers-reduced-motion: reduce){
  html::view-transition-old(root),
  html::view-transition-new(root),
  ::view-transition-group(portal){ animation:none!important; clip-path:none!important; }
}

<script id="pill-alert-script">
(function(){
  function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
  function getTodayMg(){
    const iso=todayISO();
    try{ const tIso=localStorage.getItem('derma_today_iso');
      if(tIso===iso){ const mg=+localStorage.getItem('derma_today_mg')||0; if(mg>0) return mg; }
    }catch(_){}
    try{ const diary=JSON.parse(localStorage.getItem('rt.diary.v1')||'{}'); const rec=diary[iso];
      if(rec){ if(rec.miss===true||rec.taken===false) return 0; return +(rec.dose ?? rec.mg ?? 0)||0; }
    }catch(_){}
    return 0;
  }
  function render(){
    const need=getTodayMg()<=0;
    document.querySelectorAll('[data-pill-spot]').forEach(spot=>{
      let b=spot.querySelector('.pill-alert');
      if(!need){ if(b) b.remove(); return; }
      if(!b){ b=document.createElement('span'); b.className='pill-alert'; b.textContent='препарат';
        b.title='Сегодня доза не отмечена'; spot.appendChild(b); }
    });
  }
  window.addEventListener('storage',e=>{
    if(['rt.diary.v1','derma_today_iso','derma_today_mg'].includes(e.key)) render();
  });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
  document.addEventListener('DOMContentLoaded',render);
  window.renderPillAlert = render; // ручной перерендер на всякий
})();
</script>

);

  const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  function moodEmoji(v){

 // был linear-gradient → стал один цвет для свечения
function heatColor(dose, maxDose){
  if (!dose || dose <= 0 || !maxDose) return 'transparent';
  const t = Math.max(0, Math.min(1, dose / maxDose));   // 0..1
  // хотим именно ЗЕЛЁНОЕ свечение

  const sat   = 90+ 10 * t;             // насыщенность
  const light = 47 + 5  * t;             // яркость

  return `hsla(${hue},${sat}%,${light}%,${alpha})`;
}
function missGlow(){ return 'hsla(0,86%,58%,.60)'; } // сочный красный
// читаем wellness из дневника v2 (rt.diary.v2) или маппим старый mood (rt.diary.v1)
function readWellnessV2(id){
  try{
    const v = JSON.parse(localStorage.getItem('rt.diary.v2')||'null');

// -3..+3  →  0..100
function normalizeMoodV1(m){
  if (m==null) return null;
  const clamped = Math.max(-3, Math.min(3, Number(m)));
  return Math.round((clamped + 3) * (100/6));
}
// 0..100 → индекс 0..6
function moodIndexFromValence(v){
  const s=(v-50)/50;
  if (s<-0.66) return 0;
  if (s<-0.33) return 1;
  if (s<-0.06) return 2;
  if (s< 0.06) return 3;
  if (s< 0.33) return 4;
  if (s< 0.66) return 5;
  return 6;
}
// === Diary v2 helpers (самочувствие, заметка, побочки) ===
function loadDiaryV2(){
  try{

}
function textFromV(v){
  const s=(v-50)/50;
  if(s<-0.66) return 'Очень плохо';
  if(s<-0.33) return 'Плохо';
  if(s<-0.06) return 'Ниже нормы';
  if(s< 0.06) return 'Нейтрально';
  if(s< 0.33) return 'Неплохо';
  if(s< 0.66) return 'Хорошо';
  return 'Отлично';
}
function firstSentenceWithEllipsis(s){
  if(!s) return '';
  const t=String(s).trim();
  const m=t.match(/(.+?[.!?])(\s|$)/);
  const first=(m?m[1]:t);
  return first.replace(/\s+$/,'')+'…';
}

  function monthStats(year, month){
  // читаем дневник из localStorage
  const diary = getDiary();
  let mg = 0, taken = 0, miss = 0;
  const days = new Date(year, month+1, 0).getDate();
  const pad = n => String(n).padStart(2,'0');
  for (let d=1; d<=days; d++){
    const id = `${year}-${pad(month+1)}-${pad(d)}`;
    const rec = diary[id];
    if (!rec) continue;
    const dose = Number(rec.dose ?? rec.mg ?? 0);
    const missed = (rec.miss === true) || (rec.taken === false);
    if (missed) { miss++; continue; }
    if (dose > 0){ mg += dose; taken++; }
  }
  const denom = taken + miss;
  const adherence = denom ? Math.round((taken/denom)*100) : 0;
  return {mg, miss, adherence};
}

    const data   = diaryAll[id] || null;
const dose   = data ? Number(data.dose ?? data.mg ?? 0) : 0;

if (moodIdx === 6) cell.classList.add('mood-6'); // звёзды только для «отлично»

const doseClass = `dose${taken ? ' taken' : ''}`;

   // Короткий тап — снизу «краткая инфа», долгий — портал→дневник

  const e2  = (db2.entries && db2.entries[id]) || null;

    { day:'2-digit', month:'long', year:'numeric' });

  const valence =
    (e2 && typeof e2.wellness === 'number') ? e2.wellness
    : (readWellnessV2(id) ?? normalizeMoodV1(d1?.mood));
  const moodWord = (valence != null) ? textFromV(valence) : '—';

  // Доза
  const doseText = d1 && (d1.dose || d1.mg) ? (d1.dose || d1.mg) + ' мг' : '—';

  // Комментарий: 1-е предложение из “Заметка дня” + …
  const noteRaw = (e2 && e2.notes) ? String(e2.notes).trim() : '';
  const comment = noteRaw ? firstSentenceWithEllipsis(noteRaw)
                          : 'Записей нет. Нажмите и удерживайте день, чтобы открыть дневник.';

  // Побочки: показываем только если есть (>0)
  const seCount = sideEffectsCount(e2);

  sheetBody.innerHTML = `
    <div class="sheet-row">
      <div class="badge">Самочувствие:</div>
      <div>
        <strong>${moodWord}</strong>
        ${seCount > 0 ? `<span class="muted" style="margin-left:10px">• побочки: ${seCount}</span>` : ''}
      </div>
    </div>

    <div class="sheet-row">
      <div class="badge">Доза:</div>
      <strong id="doseVal">${doseText}</strong>
      <button class="pill right" id="doseEdit" style="padding:8px 12px">Задать</button>
    </div>

    <div class="sheet-row">
      <div class="badge">Комментарий:</div>
      <div>${comment}</div>
    </div>
  `;

  openDiaryBtn.onclick = ()=> goDiary(id);
  sheet.classList.add('active'); sheet.setAttribute('aria-hidden','false');

  const scrim = document.getElementById('scrim');
  if (scrim){ scrim.classList.add('active'); scrim.setAttribute('aria-hidden','false'); scrim.onclick = closeSheet; }

  const btn = document.getElementById('doseEdit');
  if (btn){
    btn.onclick = ()=>{
      const cur = d1 && (d1.dose || d1.mg) ? Number(d1.dose || d1.mg) : '';
      const v = prompt('Введите дозу, мг:', cur);
      if (v == null) return;
      const mg = Math.max(0, Math.round(Number(v)));
      const diary = getDiary();
      diary[id] = diary[id] || {};
      diary[id].dose = mg;
      diary[id].taken = true;
      delete diary[id].miss;
      localStorage.setItem('rt.diary.v1', JSON.stringify(diary));
      render();
      openSheet(id, diary[id]); // refresh
    };
  }
}

  
  const closeSheet = ()=>{
    const scrim = document.getElementById('scrim');
    sheet.classList.remove('active'); sheet.setAttribute('aria-hidden','true');
    sheet.style.transition = ''; sheet.style.transform = ''; // reset after swipe
    if (scrim){
      scrim.classList.remove('active'); scrim.setAttribute('aria-hidden','true');
      scrim.onclick = null;
    }
  };

  const goDiary = (id) => {
  try {
    // запасной канал для дневника
    sessionStorage.setItem('rt.openDate', id);

    // и query, и hash — чтобы попасть под любой существующий код парсинга
    const url = new URL('diary.html', location.href);
    url.searchParams.set('date', id);
    url.hash = `date=${id}`;

    window.location.href = url.toString();
  } catch (e) {
    alert('Откройте дневник для ' + id);
  }
};

  document.getElementById('prev').onclick = ()=>{ current.setMonth(current.getMonth()-1); render(); };
  document.getElementById('next').onclick = ()=>{ current.setMonth(current.getMonth()+1); render(); };
  document.getElementById('todayBtn').onclick = ()=>{ const now = new Date(); current = new Date(now.getFullYear(), now.getMonth(), 1); render(); };
  
  // Swipe down to close the sheet
  (function(){
    const scrim = document.getElementById('scrim');
    let sw = {active:false, startY:0, dy:0};
    const start = (e)=>{
      if (!sheet.classList.contains('active')) return;
      // Start only if drag handle or top header touched
      const t = e.target;
      if (!t.closest('.drag-handle') && !t.closest('.sheet-head')) return;
      sw.active = true;
      sw.startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      sw.dy = 0;
      sheet.style.transition = 'none';
      e.preventDefault();
    };
    const move = (e)=>{
      if (!sw.active) return;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      sw.dy = Math.max(0, y - sw.startY);
      sheet.style.transform = `translateY(${sw.dy}px)`;
      if (scrim) scrim.style.opacity = String(Math.max(0, 1 - sw.dy/260));
    };
    const end = ()=>{
      if (!sw.active) return;
      sheet.style.transition = 'transform .25s ease';
      if (sw.dy > 120){ closeSheet(); }
      else {
        sheet.style.transform = 'translateY(0)';
        if (scrim) scrim.style.opacity = '';
      }
      sw.active = false;
    };
    // Pointer events
    sheet.addEventListener('pointerdown', start);
    sheet.addEventListener('pointermove', move);
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', end);
    // Touch fallback (older engines)
    sheet.addEventListener('touchstart', start, {passive:false});
    sheet.addEventListener('touchmove', move, {passive:false});
    sheet.addEventListener('touchend', end);
  })();
window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeSheet(); });
  window.addEventListener('storage', (e)=>{
 if (e.key === 'rt.diary.v1' || e.key === 'rt.diary.bump' || e.key === 'rt.diary.v2') render();

});
// на всякий — обновляемся, когда пользователь вернулся на страницу
window.addEventListener('focus', render);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) render(); });

/* Надёжный короткий тап на мобильных:
   1) запоминаем, на какой дате начался тап;
   2) при отпускании берём элемент под пальцем (elementFromPoint)
      и открываем шит, если это короткий тап (<480мс). */
(function(){
  let downId = null;
  let t0 = 0;

  // старт на любом дне
  grid.addEventListener('pointerdown', (e)=>{
    const c = e.target.closest('.day[data-date]');
    if (!c) return;
    downId = c.dataset.date;
    t0 = performance.now();
  });

  // отпускание — в любом месте документа
  const onUp = (e)=>{
    if (!downId) return;
    const dt = performance.now() - t0;
    const longPress = dt > 480;
    t0 = 0;

    // если уже открыт sheet или это долгий тап — выходим
    if (sheet.classList.contains('active') || longPress){ downId = null; return; }

    // координаты пальца/указателя
    const p = (e.changedTouches && e.changedTouches[0]) || e;
    const el = document.elementFromPoint(p.clientX, p.clientY);
    const cell = el && el.closest && el.closest('.day[data-date]');
    const id = cell ? cell.dataset.date : downId; // если вышли за сетку — берём стартовый день

    // выделение и открытие
    grid.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
    const cur = grid.querySelector(`.day[data-date="${id}"]`);
    if (cur) cur.classList.add('selected');
    openSheet(id);

    downId = null;
  };

  document.addEventListener('pointerup', onUp, {passive:true});
  document.addEventListener('touchend',  onUp, {passive:true}); // на всякий случай для старых движков
})();

  // === RANGE SELECT (п.4): делегирование по .day ===
grid.addEventListener('pointerdown', (e) => {
  const cell = e.target.closest('.day[data-date]');
  if (!cell) return;
  drag.active = true;
  drag.start = cell.dataset.date;
  drag.over  = cell.dataset.date;
  grid.classList.add('dragging');
  highlightRange(drag.start, drag.over);
});

grid.addEventListener('pointerover', (e) => {
  if (!drag.active) return;
  const cell = e.target.closest('.day[data-date]');
  if (!cell) return;
  drag.over = cell.dataset.date;
  highlightRange(drag.start, drag.over);
});

const finishDrag = () => {
  if (!drag.active) return;
  finalizeRange();
};
grid.addEventListener('pointerup', finishDrag);
grid.addEventListener('pointercancel', finishDrag);
document.addEventListener('pointerup', finishDrag);

  render();
})();

</script>

</body>
</html>
