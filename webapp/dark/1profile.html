<script>
  document.addEventListener('DOMContentLoaded', () => {
    const settings = (window.AppState?.get('settings')) || {};
    const cur = document.documentElement.dataset.theme   // что уже выставили в <head>
               || localStorage.getItem('rt_theme') 
               || 'light';
    const theme = (settings.theme === 'light' || settings.theme === 'dark') ? settings.theme : cur;
    document.documentElement.dataset.theme = theme;

    // тумблеры
    document.querySelectorAll('[data-role="theme-switch"]').forEach(sw => {
      const isLight = (document.documentElement.dataset.theme === 'light');
      sw.setAttribute('aria-pressed', isLight ? 'true' : 'false');

      sw.addEventListener('click', () => {
        const cur = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
        const next = (cur === 'light') ? 'dark' : 'light';
        AppState.applyTheme(next); // пишет в rt.settings и rt_theme + ставит data-theme
        document.querySelectorAll('[data-role="theme-switch"]')
          .forEach(x => x.setAttribute('aria-pressed', next === 'light' ? 'true' : 'false'));
      });
    });
  });
</script>

  <script>
  // ====== TG user / avatar ======
const tgApp = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tgApp && tgApp.ready) tgApp.ready();
if (tgApp && tgApp.expand) tgApp.expand();

const initUser = (tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.user) ? tgApp.initDataUnsafe.user : null;
const initData = (tgApp && tgApp.initData) ? tgApp.initData : '';
const API_BASE = String(window.API_BASE||'').replace(/\/$/, '');

// — универсальный dev-режим
const qs = new URLSearchParams(location.search);
const isTgApp = !!(tgApp && tgApp.initData);
const isDev   = location.hostname === 'localhost' || qs.has('dev');   // дефолт только в dev
const DEV_DEFAULT_TG = '1002';

let devTg = qs.get('tg') || localStorage.getItem('rt.dev.tg') || (isDev ? DEV_DEFAULT_TG : '');
if (devTg) { try { localStorage.setItem('rt.dev.tg', devTg); } catch(_) {} }

// — обёртка для API
function api(path, opts = {}) {
  let url = /^https?:\/\//i.test(path) ? path : (API_BASE + path);
  const params = [];
  if (!isTgApp && devTg) params.push('tg=' + encodeURIComponent(devTg)); // браузер: передаём tg
  params.push('v=profile-2025-08-24');
  url += (url.includes('?') ? '&' : '?') + params.join('&');

  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (isTgApp && initData) headers['X-Telegram-InitData'] = initData;  // в телеграме: initData

  return fetch(url, { ...opts, headers });
}
  (async function hydrateHeader(){
  const tg    = window.Telegram?.WebApp;
  const nameEl = document.getElementById('tgName');
  const avaEl  = document.getElementById('ava');

  function initials(n){
    return (n||'U').trim().split(/\s+/).map(s=>s[0]||'').slice(0,2).join('').toUpperCase() || 'U';
  }
  function setInitials(target, name){
    if (!target) return;
    target.textContent = initials(name);
  }
  function putPhotoSmart(target, primaryUrl, fallbackName, handle){
    if (!target || !primaryUrl) return setInitials(target, fallbackName);
    const img = new Image();
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.onload = () => {
      target.innerHTML = '';
      Object.assign(img.style, {
        width:'100%', height:'100%', objectFit:'cover', display:'block',
        borderRadius: getComputedStyle(target).borderRadius || '50%'
      });
      target.appendChild(img);
      try{ localStorage.setItem('rt_usr_avatar', img.src); }catch(_){}
    };
    img.onerror = () => {
      if (handle && !primaryUrl.includes('unavatar.io')) {
        const url2 = `https://unavatar.io/telegram/${encodeURIComponent(handle)}`;
        // второй заход — уже без рекурсии
        img.onerror = () => setInitials(target, fallbackName);
        img.src = url2;
      } else {
        setInitials(target, fallbackName);
      }
    };
    img.src = primaryUrl;
  }

  // 1) стартуем из кеша, чтобы меньше мерцало
  let name   = localStorage.getItem('rt_usr_name')   || '';
  let photo  = localStorage.getItem('rt_usr_avatar') || '';
  let handle = '';

  // 2) данные из Telegram
  const u = tg?.initDataUnsafe?.user || null;
  if (u){
    const n = [u.first_name, u.last_name].filter(Boolean).join(' ');
    if (n) name = n;
    if (u.photo_url) photo = u.photo_url;
    handle = u.username || '';
  }

  // 3) dev-параметры из URL
  const qs = new URLSearchParams(location.search);
  if (!name)   name   = qs.get('tg_name')     || name;
  if (!photo)  photo  = qs.get('tg_photo')    || photo;
  if (!handle) handle = qs.get('tg_username') || qs.get('tg_handle') || handle;

  // 4) last resort для имени
  if (!name) {
    try{
      const r = await api('/api/me');
      if (r.ok) { const me = await r.json(); name = me.full_name || me.name || name; }
    }catch(_){}
  }

  if (nameEl) nameEl.textContent = name || '—';
  if (photo) putPhotoSmart(avaEl, photo, name, handle);
  else if (handle) putPhotoSmart(avaEl, `https://unavatar.io/telegram/${encodeURIComponent(handle)}`, name, '');
  else setInitials(avaEl, name);

  try{ localStorage.setItem('rt_usr_name', name || ''); }catch(_){}
})();

    const msg = document.getElementById('profMsg');
    const sex = (document.querySelector('input[name="sex"]:checked')||{}).value || null;
    const weight_kg = Number(document.getElementById('p_weight').value || 0);
    const height_cm = Number(document.getElementById('p_height').value || 0) || null;
    const birth_date = document.getElementById('p_birth').value || null;
    const checked = [...document.querySelectorAll('input[name="alg"]:checked')].map(i=>i.value);
    const other = document.getElementById('alg_other').value.trim();
    const noAll = document.getElementById('noAllergies').checked;
    const allergies = noAll ? [] : (other ? [...checked, `other:${other}`] : checked);

    msg.textContent = 'Сохраняю...';
    try{
      const r = await api('/api/me', { method:'POST', body: JSON.stringify({ sex, weight_kg, height_cm, birth_date, allergies }) });
      if (!r.ok){ let text='Ошибка '+r.status; try{const j=await r.json(); if(j&&j.error) text=j.error;}catch{} msg.textContent=text; return; }
      msg.textContent = 'Сохранено';
     try { localStorage.setItem('rt_allergies', JSON.stringify(allergies)); } catch(_){}
      try{ localStorage.setItem('derma_next','plan'); }catch(_){}
      const qs = location.search || '';
      try{
  const sp = new URLSearchParams(location.search);
  const tgInit = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
  const uid = sp.get('tg') || tgInit || '';
  if (uid && weight_kg > 0) {
    localStorage.setItem(`dermaApp:${uid}:weight_kg`, String(weight_kg));
  }
  // (необязательная совместимость со старым кодом)
  if (weight_kg > 0) localStorage.setItem('rt.weight_kg', String(weight_kg));
}catch(_){}
      setTimeout(()=>location.replace('./plan.html' + qs), 200);
    }catch(_){ msg.textContent='Ошибка сети'; }
  }, { once:true });  // защита от двойного клика

    // начальная валидация
    syncSaveBtn();
  
    // ====== Back to welcome ======
    (function(){
      const btn = document.getElementById('btnBack');
      if (btn) btn.addEventListener('click', ()=>{
        const qs = location.search || '';
        location.replace('./welcome-rt.html' + qs);
      });
    })();
</script>

</body>
