<title>Дневник — запись дня</title><script>
(function(){
  try{
    const xy = sessionStorage.getItem('portalXY');
    if (xy){
      const [x,y] = xy.split(',').map(n=>parseInt(n,10));
      if (!Number.isNaN(x) && !Number.isNaN(y)){
        document.documentElement.style.setProperty('--portal-x', x+'px');
        document.documentElement.style.setProperty('--portal-y', y+'px');
      }
      sessionStorage.removeItem('portalXY');
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      const t = document.getElementById('diary-portal-target');
      if (t) t.style.viewTransitionName = 'portal';
    });
  }catch(_){}
})();
</script>

<script>
  // Инициализация всех переключателей темы на странице
  document.addEventListener('DOMContentLoaded', () => {
    const settings = AppState.get('settings') || {};
    const theme = (settings.theme === 'light') ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;

    // найдём все тумблеры с data-role="theme-switch"
    document.querySelectorAll('[data-role="theme-switch"]').forEach(sw => {
      const isLight = (document.documentElement.dataset.theme === 'light');
      sw.setAttribute('aria-pressed', isLight ? 'true' : 'false');

      sw.addEventListener('click', () => {
        const cur = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
        const next = (cur === 'light') ? 'dark' : 'light';
        AppState.applyTheme(next);                  // сохраняем и ставим data-theme
        // визуально обновим все тумблеры на странице
        document.querySelectorAll('[data-role="theme-switch"]')
          .forEach(x => x.setAttribute('aria-pressed', next === 'light' ? 'true' : 'false'));
      });
    });
  });
</script>

  /* ===== Day pane transition (flip) ===== */
#dayPane{
  position:relative;
  perspective: 1100px;              /* глубина 3D */
  transform-style: preserve-3d;
}

/* вперёд (следующий день) */
.flip-out-left  { animation: flipOutLeft  220ms ease both; will-change: transform, opacity, filter; }
.flip-in-right  { animation: flipInRight  260ms 110ms ease both; will-change: transform, opacity, filter; }

/* назад (предыдущий день) */
.flip-out-right { animation: flipOutRight 220ms ease both; will-change: transform, opacity, filter; }
.flip-in-left   { animation: flipInLeft   260ms 110ms ease both; will-change: transform, opacity, filter; }

@keyframes flipOutLeft{
  from{ opacity:1; transform:none; filter:none; }
  to  { opacity:0; transform: translateX(-24px) rotateY(16deg) scale(.985); filter: blur(.4px); }
}
@keyframes flipInRight{
  from{ opacity:0; transform: translateX(26px) rotateY(-18deg) scale(.985); filter: blur(.6px); }
  to  { opacity:1; transform: none; filter: none; }
}
@keyframes flipOutRight{
  from{ opacity:1; transform:none; filter:none; }
  to  { opacity:0; transform: translateX(24px) rotateY(-16deg) scale(.985); filter: blur(.4px); }
}
@keyframes flipInLeft{
  from{ opacity:0; transform: translateX(-26px) rotateY(18deg) scale(.985); filter: blur(.6px); }
  to  { opacity:1; transform: none; filter: none; }
}

/* доступность: если пользователь просит меньше анимаций — отключаем */
@media (prefers-reduced-motion: reduce){
  .flip-out-left,.flip-in-right,.flip-out-right,.flip-in-left{ animation:none!important; }
}

/* === PORTAL (calendar → diary) — плавная и длиннее === */
:root{
  /* Правишь только эти 5 переменных */
  --vt-out-ms: 1100ms;      /* старый экран схлопывается */
  --vt-in-ms:  1200ms;      /* новый экран раскрывается   */
  --vt-portal-ms: 1300ms;   /* морфинг «двери»            */
  --vt-ease: cubic-bezier(.22,.61,.36,1); /* плавная ease-in-out */
  --vt-new-end: 160%;       /* 140–180% — больше = медленнее по краям */

  /* не трогаем */
  --portal-x: 50vw; --portal-y: 50vh;
}

/* Старый документ — «чёрная дыра» */
html::view-transition-old(root){
  animation: vt-out var(--vt-out-ms) var(--vt-ease) both;
  clip-path: circle(120% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, filter;
  filter: brightness(1) contrast(1);
}
@keyframes vt-out{
  0%   { clip-path: circle(120% at var(--portal-x) var(--portal-y)); }
  100% { clip-path: circle(0%    at var(--portal-x) var(--portal-y)); filter:brightness(.98); }
}

/* Новый документ — «выныривание» из точки */
html::view-transition-new(root){
  animation: vt-in var(--vt-in-ms) var(--vt-ease) both;
  clip-path: circle(0% at var(--portal-x) var(--portal-y));
  overflow: clip;
  will-change: clip-path, opacity, filter;
  opacity: .98;
}
@keyframes vt-in{
  0%   { clip-path: circle(0% at var(--portal-x) var(--portal-y));   opacity:.96; filter:brightness(.98); }
  60%  { opacity:1; filter:brightness(1.01); }
  100% { clip-path: circle(var(--vt-new-end) at var(--portal-x) var(--portal-y)); filter:none; }
}

/* Морфинг общей «двери» */
::view-transition-group(portal){
  animation: portal-warp var(--vt-portal-ms) var(--vt-ease) both;
  transform-origin: center center;
  will-change: transform, filter;
}
@keyframes portal-warp{
  0%   { transform: perspective(900px) translateZ(0)    scale(1)    rotate(0);   filter:contrast(1)saturate(1); }
  40%  { transform: perspective(900px) translateZ(200px) scale(1.10) rotate(6deg); filter:contrast(1.04)saturate(1.06); }
  100% { transform: perspective(900px) translateZ(620px) scale(26)   rotate(12deg); filter:contrast(1.06)saturate(1.08); }
}

@media (prefers-reduced-motion: reduce){
  html::view-transition-old(root),
  html::view-transition-new(root),
  ::view-transition-group(portal){ animation:none!important; clip-path:none!important; }
}

<script id="pill-alert-script">
(function(){
  function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
  function getTodayMg(){
    const iso=todayISO();
    try{ const tIso=localStorage.getItem('derma_today_iso');
      if(tIso===iso){ const mg=+localStorage.getItem('derma_today_mg')||0; if(mg>0) return mg; }
    }catch(_){}
    try{ const diary=JSON.parse(localStorage.getItem('rt.diary.v1')||'{}'); const rec=diary[iso];
      if(rec){ if(rec.miss===true||rec.taken===false) return 0; return +(rec.dose ?? rec.mg ?? 0)||0; }
    }catch(_){}
    return 0;
  }
  function render(){
    const need=getTodayMg()<=0;
    document.querySelectorAll('[data-pill-spot]').forEach(spot=>{
      let b=spot.querySelector('.pill-alert');
      if(!need){ if(b) b.remove(); return; }
      if(!b){ b=document.createElement('span'); b.className='pill-alert'; b.textContent='препарат';
        b.title='Сегодня доза не отмечена'; spot.appendChild(b); }
    });
  }
  window.addEventListener('storage',e=>{
    if(['rt.diary.v1','derma_today_iso','derma_today_mg'].includes(e.key)) render();
  });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
  document.addEventListener('DOMContentLoaded',render);
  window.renderPillAlert = render; // ручной перерендер на всякий
})();
</script>

/* ===== Storage ===== */
const KEY = 'rt.diary.v2';
function photoKey(kind, date){ return `rt.photo.${kind}:${(date||'').slice(0,10)}`; }
function toLocalISO(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function todayISO(){ return toLocalISO(new Date()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function getStartISO(){
  const qs = new URLSearchParams(location.search);
  const hs = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
  const fromQuery =
  qs.get('date') ||

  const iso = fromQuery || todayISO();
  return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso : todayISO();
}
function loadDB(){ try{const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.version===2) return v;}catch(e){} const fresh={version:2,baseline:null,entries:{}}; localStorage.setItem(KEY,JSON.stringify(fresh)); return fresh; }
function saveDB(db){
  const payload = JSON.stringify(db);
  try{
    localStorage.setItem(KEY, payload);
  }catch(e){
    // пробуем освободить место, снося старые фото, и повторим
    if(ensureSpace(approxBytes(payload))){
      localStorage.setItem(KEY, payload);
    }else{
      alert('Хранилище переполнено. Удалите пару старых фото в дневнике.');
      throw e;
    }
  }
}
function getEntry(date){
  const db = loadDB();
  const base = db.entries[date] || {date, wellness:50, sideEffects:{}, photos:{face:null, body:null}, notes:''};
  if (!base.sideEffects) base.sideEffects = {};
  if (!base.photos)      base.photos = {face:null, body:null};

// === helpers для квоты localStorage
function approxBytes(str){ return (str ? str.length : 0) * 2; } // грубо, UTF-16
function photoKeys(){
  const a=[]; for (let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i); if(k && k.startsWith('rt.photo.')) a.push(k);
  } return a;
}
function keyDate(k){
  const i=k.indexOf(':'); return i>=0 ? k.slice(i+1, i+11) : '0000-00-00';
}
function ensureSpace(extraBytes=0, limitBytes=4.7*1024*1024){
  try{
    let total=0;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i), v=localStorage.getItem(k);
      total += approxBytes(k) + approxBytes(v);
    }
    if(total + extraBytes <= limitBytes) return true;

    // сносим СТАРЕЙШИЕ фото до тех пор, пока не хватит места
    const keys = photoKeys().sort((a,b)=> keyDate(a).localeCompare(keyDate(b)));
    while(keys.length && total + extraBytes > limitBytes){
      const k = keys.shift(); const v = localStorage.getItem(k) || '';
      localStorage.removeItem(k);
      total -= approxBytes(k) + approxBytes(v);
    }
    return (total + extraBytes <= limitBytes);
  }catch(_){ return false; }
}

function pathCapsule(c, W, H, R){
  const r=Math.max(0, Math.min(R, Math.min(W,H)/2));
  const x=-W/2, y=-H/2;
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+W-r,y); c.quadraticCurveTo(x+W,y,x+W,y+r);
  c.lineTo(x+W,y+H-r); c.quadraticCurveTo(x+W,y+H,x+W-r,y+H);
  c.lineTo(x+r,y+H); c.quadraticCurveTo(x,y+H,x,y+H-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hexToRgb(h){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
  return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:{r:255,g:255,b:255}; }
function mixHex(h1,h2,t,a=1){ const A=hexToRgb(h1),B=hexToRgb(h2);
  const r=Math.round(lerp(A.r,B.r,t)), g=Math.round(lerp(A.g,B.g,t)), b=Math.round(lerp(A.b,B.b,t));
  return `rgba(${r},${g},${b},${a})`;
}

// Палитра капсулы: 0 — тёпло/«плохо», 1 — холодно/«отлично»
function palette(m){
  const PILL_TINT_STRENGTH = 9.6;
  const warm1='#e96a5a', warm2='#ffb36b';
  const mid1 ='#19d06a', mid2 ='#66e08f';
  const cool1='#00d2ff', cool2='#38f9d7';
  let cA,cB; if(m<0.5){ const t=m/0.5; cA=mixHex(warm1,mid1,t); cB=mixHex(warm2,mid2,t);}
  else { const t=(m-0.5)/0.5; cA=mixHex(mid1,cool1,t); cB=mixHex(mid2,cool2,t); }
  return {
    baseDark: mixHex('#0c1322', '#0b141e', m, 1),
    baseMid:  mixHex('#141d34', '#0f2234', m, 1),
    tintA: cA, tintB: cB,
    rimA: mixHex('#ff9866','#00ffee', m, .35),
    rimB: mixHex('#ffd8a0','#a0d8ff', m, .16),
    glintA: mixHex('#ffe5d4','#e8fbff', m, .85),
    glintB: mixHex('#ffd0f0','#c7e6ff', m, .72)
  };
}

// Текстуры: low-freq «бамп» + микро-поры
function makeValueNoise(size=256, cell=16, oct=3){
  const cnv=document.createElement('canvas'), c=cnv.getContext('2d');
  cnv.width=cnv.height=size; const img=c.createImageData(size,size);
  function pass(freq, amp){
    const gx=Math.ceil(size/freq)+2, gy=Math.ceil(size/freq)+2;
    const grid=Array.from({length:gy},()=>Array.from({length:gx},()=>Math.random()));
    for(let y=0;y<size;y++){ const fy=y/freq, y0=Math.floor(fy), ty=fy-y0;
      for(let x=0;x<size;x++){ const fx=x/freq, x0=Math.floor(fx), tx=fx-x0;
        const v00=grid[y0][x0], v10=grid[y0][x0+1], v01=grid[y0+1][x0], v11=grid[y0+1][x0+1];
        const v=((v00*(1-tx)+v10*tx)*(1-ty) + (v01*(1-tx)+v11*tx)*ty)*amp;
        const i=(y*size+x)*4; img.data[i]+=v*255; img.data[i+1]+=v*255; img.data[i+2]+=v*255; img.data[i+3]=255;
      }
    }
  }
  for(let o=0;o<oct;o++) pass(cell/(2**o), 1/(2**(o+1)));
  c.putImageData(img,0,0); return cnv;
}
function makeSpeckles(size=512, count=2200){
  const cnv=document.createElement('canvas'), c=cnv.getContext('2d');
  cnv.width=cnv.height=size; c.clearRect(0,0,size,size);
  for(let i=0;i<count;i++){
    const x=Math.random()*size, y=Math.random()*size, r=(Math.random()*1.6)+0.5, ang=Math.random()*Math.PI;
    c.fillStyle=`rgba(0,0,0,${0.10+Math.random()*0.10})`;
    c.beginPath(); c.ellipse(x,y,r*1.1,r*0.9,ang,0,Math.PI*2); c.fill();
    if(Math.random()<0.25){
      c.fillStyle=`rgba(255,255,255,${0.06+Math.random()*0.06})`;
      c.beginPath(); c.ellipse(x+0.2,y-0.2,r*0.8,r*0.6,ang,0,Math.PI*2); c.fill();
    }
  }
  return cnv;
}
const noiseTex = makeValueNoise(256,18,3);
const speckleTex = makeSpeckles(512,2200);

// Помощники для бликов/полос
function glossyBand(x1,y1,x2,y2, a1, a2, alpha){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.35,a1);
  g.addColorStop(0.65,a2); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=alpha; ctx.fillStyle=g;
  ctx.fillRect(-9999,-9999,19999,19999);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
function glint(cx,cy,rx,ry,color='rgba(255,255,255,.9)',a=1){
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
  gr.addColorStop(0,color); gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=a; ctx.fillStyle=gr;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
// ==== depth helpers ====
function innerAOStroke(ctx,W,H,R,alpha=0.22){
  // мягкая внутренняя тень по контуру — усиливает толщину стенки
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.lineWidth = Math.min(W,H)*0.08;
  const g = ctx.createRadialGradient(0,0, Math.min(W,H)*0.36, 0,0, Math.min(W,H)*0.52);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(0,0,0,${alpha})`);
  pathCapsule(ctx, W, H, R);
  ctx.strokeStyle = g;
  ctx.stroke();
  ctx.restore();
}

function outerRimGlow(ctx,W,H,R,intensity=0.55){
  // внешнее свечение по краю — даёт ощущение «стекла»
  ctx.save();
  ctx.globalCompositeOperation='screen';
  ctx.shadowColor = `rgba(255,255,255,${intensity})`;
  ctx.shadowBlur  = Math.min(W,H)*0.09;
  ctx.lineWidth   = Math.min(W,H)/18;
  pathCapsule(ctx,W,H,R);
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.stroke();
  ctx.restore();
}

// обновлённый блик с «блумом»
function glintBloom(ctx,x,y,w,h,color='white',alpha=.6,angle=0){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle);
  ctx.globalCompositeOperation='screen';

  // центральный блик
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.ellipse(0,0,w,h,0,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();

  // мягкое свечение вокруг
  ctx.globalAlpha = alpha*0.45;
  ctx.filter='blur(6px)';
  ctx.beginPath(); ctx.ellipse(0,0,w*1.35,h*1.35,0,0,Math.PI*2); ctx.fill();
  ctx.filter='none';

  ctx.restore();
}

// === helpers for glass + liquid ===
function fresnelEdge(t, bias=.06, pow=3){ return bias + (1-bias) * Math.pow(1-Math.abs(t), pow); }

// нормализованные пузырьки в локальных координатах капсулы (x,y в -0.5..0.5)
const BUBBLE_COUNT = 70;
let bubbles = Array.from({length:BUBBLE_COUNT}, () => ({
  x: (Math.random()-0.5)*0.82,
  seed: Math.random(),
  speed: 0.08 + Math.random()*0.12,    // чем больше — тем быстрее всплывают
  r: 0.006 + Math.random()*0.016
}));
function drawBubbles(ctx, W, H, t){
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for(const b of bubbles){
    // y бежит снизу вверх по циклу
    const y = 0.44 - ((t*b.speed + b.seed) % 1.0) * 0.88;
    const x = b.x + Math.sin(t*0.9 + b.seed*20)*0.02; // легкий дрейф
    const cx = x*W, cy = y*H;
    const r = b.r * Math.min(W,H);
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,.35)');
    g.addColorStop(0.6,'rgba(255,255,255,.08)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx,cy, r*1.15, r*0.9, (b.seed*6.28), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// 7 подписей строго по индексам слева направо
const MOOD_STATES = [
  'Очень плохо','Плохо','Ниже нормы',
  'Нейтрально','Неплохо','Хорошо','Отлично'
];

// квантование 0..100 → индекс 0..6 (именно так шагает твой слайдер)
function quantizeIdxFromValence(v){
  v = Math.max(0, Math.min(100, Number(v)||0));
  return Math.max(0, Math.min(6, Math.round((v/100) * 6)));
}

// подпись теперь — просто по индексу
function textFromV(v){
  return MOOD_STATES[quantizeIdxFromValence(v)];
}

// ЦВЕТА и подпись — тоже по индексу
function updateColorsByValence(v){
  const idx = quantizeIdxFromValence(v);

  // подпись состояния
  if (typeof stateLabel !== 'undefined' && stateLabel){
    stateLabel.textContent = MOOD_STATES[idx];
  }

  // палитры для 7 состояний (строго по индексам)

  ];
  const [A,B] = THEMES[idx];

// ===== Рендер капсулы (как был) =====
let start=performance.now();
let rafId = 0;     // id активного requestAnimationFrame
// === iOS scroll fallback: держим анимацию во время скролла ===
let __scrollTimer = 0, __scrollEndTO = 0;
window.addEventListener('scroll', ()=>{
  if (!__scrollTimer){
    __scrollTimer = setInterval(()=>{ try{ frame(performance.now()); }catch(_){} }, 33);
  }
  clearTimeout(__scrollEndTO);
  __scrollEndTO = setTimeout(()=>{
    clearInterval(__scrollTimer); __scrollTimer = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
  }, 140);
}, {passive:true});
let lastMs = 0;    // метка времени предыдущего кадра (для 30 fps)
function frame(nowMs){
  if (nowMs - lastMs < 33) { rafId = requestAnimationFrame(frame); return; }
lastMs = nowMs;
  const t=(nowMs-start)/1000;
  moodVis += (mood01 - moodVis)*0.08;

  const W0=canvas.clientWidth, H0=canvas.clientHeight;
  ctx.clearRect(0,0,W0,H0);
  const cx=W0/2, cy=H0/2;

  const rot=(2*Math.PI/rotationPeriod)*t;
  const breath=1 + breathAmp*Math.sin(2*Math.PI*t/breathPeriod);
  const morphAmp = morphAmpBase * (0.7 + 0.6*Math.abs(moodVis-0.5));
  const morph=Math.sin(t*morphSpeed);

 // Ручки:
const PILL_SCALE   = 1.15;  // < 1 — капсула меньше; > 1 — больше
const PILL_THICK   = 0.80;  // > 1 — капсула толще (выше относительно длины)

// Базовые размеры:
const baseW = W0 * 0.60 * PILL_SCALE;
const baseH = H0 * 0.34 * PILL_SCALE * PILL_THICK;

  const W=baseW*(1 + morphAmp*0.52*morph) * (1 - 0.05*(moodVis-0.5));
  const H=baseH*(1 - morphAmp*0.34*morph) * (1 + 0.05*(moodVis-0.5));
  const PILL_ROUND = 0.99; // было 0.86 — больше = более округлые торцы
const R = Math.min(W,H)/2 * (PILL_ROUND + 0.08*Math.sin(t*morphSpeed*1.7));
  const pal=palette(moodVis);

  /* тень и рисование пилюли — без изменений (опущено тут для краткости),
     оставь как в твоём текущем файле, если нужно — он уже ниже полностью */ 
  // … (ниже полный блок из твоего файла)

  // Тень (капсула)
  ctx.save();
  ctx.translate(cx, cy + H*0.24);
  ctx.rotate(rot + 0.5);
  const sw = W * 0.78, sh = H * 0.24, sr = Math.min(sw, sh) / 2;
  pathCapsule(ctx, sw, sh, sr); ctx.save(); ctx.clip();
  let g = ctx.createLinearGradient(0, -sh/2, 0, sh/2);
  g.addColorStop(0.00, 'rgba(0,0,0,.22)');
  g.addColorStop(0.45, 'rgba(0,0,0,.32)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-sw/2, -sh/2, sw, sh);
  ctx.filter = 'blur(3px)'; ctx.globalAlpha = 0.9; ctx.fillRect(-sw/2, -sh/2, sw, sh);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.restore();
  pathCapsule(ctx, sw * 0.72, sh * 0.64, sr * 0.64);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.filter = 'blur(1.2px)'; ctx.fill(); ctx.filter = 'none';
  ctx.restore();

  // Капсула
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot + 0.5); ctx.scale(breath,breath);
  pathCapsule(ctx,W,H,R); ctx.save(); ctx.clip();

  const base=ctx.createLinearGradient(-W/2,-H/2, W/2,H/2);
  base.addColorStop(0.0,pal.baseDark); base.addColorStop(0.45,pal.baseMid); base.addColorStop(1.0,'#070b14');
  ctx.fillStyle=base; ctx.fillRect(-W,-H,W*2,H*2);

  glossyBand(-W*0.9,-H*0.2,  W*0.7,H*0.15, pal.tintA, pal.tintB, .95);
  glossyBand(-W*0.2,-H*0.85, W*0.2,H*0.75, mixHex('#ffd070','#a0d8ff',moodVis,.20), mixHex('#90e0ff','#70ffd8',moodVis,.22), .38);

  ctx.save(); ctx.rotate(-(rot + 0.5));
  const light=ctx.createLinearGradient(-W,0, W,0);
  light.addColorStop(0.0,'rgba(255,255,255,.18)');
  light.addColorStop(0.55,'rgba(0,0,0,0)');
  light.addColorStop(1.0,'rgba(0,0,0,.22)');
  ctx.globalCompositeOperation='overlay'; ctx.fillStyle=light; ctx.fillRect(-W,-H,W*2,H*2);
  ctx.globalCompositeOperation='source-over'; ctx.restore();

  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.10; ctx.drawImage(noiseTex, -W,-H, W*2,H*2);
  ctx.globalAlpha=0.20; ctx.drawImage(speckleTex, -W,-H, W*2,H*2);
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.06; ctx.drawImage(speckleTex, -W,-H, W*2,H*2);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  glintBloom(ctx,  W*0.26, -H*0.26,  W*0.20, H*0.18, pal.glintA, .62,  0.10);
glintBloom(ctx, -W*0.30,  H*0.26,  W*0.16, H*0.14, pal.glintB, .48, -0.08);


  const rimAO=ctx.createLinearGradient(-W/2,0, W/2,0);
  rimAO.addColorStop(0.0,'rgba(0,0,0,0.16)'); rimAO.addColorStop(0.5,'rgba(0,0,0,0)');
  rimAO.addColorStop(1.0,'rgba(0,0,0,0.16)');
  ctx.globalCompositeOperation='multiply'; ctx.fillStyle=rimAO; ctx.fillRect(-W,-H,W*2,H*2);
  ctx.globalCompositeOperation='source-over';

  const rim=ctx.createLinearGradient(-W/2,-H/2, W/2,H/2);
  rim.addColorStop(0,pal.rimA); rim.addColorStop(0.5,'rgba(255,255,255,.08)'); rim.addColorStop(1,pal.rimB);
  ctx.lineWidth=Math.max(1.2, Math.min(W,H)/22); ctx.strokeStyle=rim; pathCapsule(ctx,W,H,R); ctx.stroke();

  ctx.lineWidth=1.0; ctx.strokeStyle='rgba(255,255,255,.20)';
  pathCapsule(ctx, W*0.988, H*0.988, R*0.988); ctx.stroke();

  const rx=W*0.014, ry=H*0.44; const seam=ctx.createLinearGradient(-rx,0, rx,0);
  seam.addColorStop(0, mixHex('#ffffff','#d0f0ff',moodVis,.40));
  seam.addColorStop(0.5,'rgba(0,0,0,.18)');
  seam.addColorStop(1, mixHex('#ffffff','#d0f0ff',moodVis,.40));
  ctx.lineWidth=Math.max(1.4, Math.min(W,H)/50); ctx.strokeStyle=seam;
  ctx.beginPath(); ctx.ellipse(0,0, rx,ry, 0,0,Math.PI*2); ctx.stroke();

  
  ctx.restore(); // clip
  ctx.restore(); // transform

  // Матовое отражение на «столе»
  ctx.save();
  ctx.translate(cx, cy + H*0.38); ctx.rotate(rot + 0.5); ctx.scale(1,-0.55);
  pathCapsule(ctx, W*0.98, H*0.98, R*0.98); ctx.clip();
  const refl=ctx.createLinearGradient(0,-H,0,H);
  refl.addColorStop(0,'rgba(255,255,255,.10)'); refl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=refl; ctx.filter='blur(2.5px)'; ctx.fillRect(-W,-H,W*2,H*2);
  ctx.filter='none'; ctx.restore();
  rafId = requestAnimationFrame(frame);
}

// ==== ЛОГИКА СЛАЙДЕРА (7 шагов + анимация + хаптик) ====
(function () {
  var bar   = document.getElementById('moodBar');
  if (!bar) return;

  var knob  = document.getElementById('moodKnob');                 // может отсутствовать — ок
  var fill  = document.getElementById('moodFill') ||               // если есть заполнение трека
              (bar.querySelector ? bar.querySelector('.mood-fill') : null);
  var label = document.getElementById('moodLabel') ||
              document.querySelector('[data-role="mood-label"]');

  // 7 состояний слева направо
  var STATES = ['Очень плохо','Плохо','Ниже нормы','Нейтрально','Неплохо','Хорошо','Отлично'];

  var curIdx = 3; // центр по умолчанию
  function clamp(n,a,b){ return Math.min(b, Math.max(a,n)); }

  // дискретизация: по всей ширине трека (без внутренних отступов, чтобы не промахиваться)
  function xToIdx(clientX){
    var r = bar.getBoundingClientRect();
    var ratio = clamp((clientX - r.left) / r.width, 0, 1); // 0..1
    return clamp(Math.round(ratio * 6), 0, 6);             // шаги 0..6
  }
  function idxToPercent(i){ return (i/6) * 100; }

  // лёгкая вибрация на Телеграм-устройствах
  function haptic(){
    try{
      var t = window.Telegram && window.Telegram.WebApp;
      if (t && t.HapticFeedback && t.HapticFeedback.impactOccurred){
        t.HapticFeedback.impactOccurred('medium');
      }
    }catch(_){}
  }

  // ARIA для доступности
  function setAriaBase(){
    bar.setAttribute('role','slider');
    bar.setAttribute('aria-valuemin','0');
    bar.setAttribute('aria-valuemax','6');
    bar.setAttribute('aria-label','Настроение'); // при желании поменяй
  }
  setAriaBase();

  function applyIndex(i){
    i = clamp(i, 0, 6);
    var prev = curIdx;
    curIdx = i;

    // сохраняем совместимое значение 0..100
    window.valence = idxToPercent(curIdx);
    
     try{ putV2Wellness(selectedISO(), window.valence); }catch(_){}

    // сначала — твои цвета/темы (если функция есть)
    if (typeof updateColorsByValence === 'function') {
      try { updateColorsByValence(window.valence); } catch(_) {}
    }

    // позиция 0..1 в CSS-переменную (если используешь её в стилях)
    var x01 = window.valence / 100;
    bar.style.setProperty('--x', x01);

    // анимация ручки/заливки (если элементы есть)
    if (fill){
      // width в % — будет плавно анимироваться по CSS (см. блок стилей ниже)
      fill.style.width = window.valence + '%';
    }
    if (knob){
      // left в % + CSS transition — аккуратный «щелчок» между шагами
      knob.style.left = window.valence + '%';
      bar.setAttribute('aria-valuenow', String(curIdx));
    }

    // обновляем подпись последней, чтобы её ничто не перетёрло
    if (label) label.textContent = STATES[curIdx];

    if (typeof refreshMoodSaveIndicator === 'function') {
      try { refreshMoodSaveIndicator(); } catch(_) {}
    }

    if (curIdx !== prev) haptic();
  }

  // события
  bar.addEventListener('pointerdown', function(e){
    bar.classList.add('drag');
    applyIndex(xToIdx(e.clientX));
  });
  window.addEventListener('pointermove', function(e){
    if (!bar.classList.contains('drag')) return;
    applyIndex(xToIdx(e.clientX));
  });
  window.addEventListener('pointerup', function(){ bar.classList.remove('drag'); });
  bar.addEventListener('click', function(e){ applyIndex(xToIdx(e.clientX)); });

  // клавиатура
  bar.tabIndex = 0;
  bar.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft')  { applyIndex(curIdx - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { applyIndex(curIdx + 1); e.preventDefault(); }
  });

  // ШИМЫ для старого API — если где-то зовёшь проценты
  window.applyValence = function(v){
    v = Math.max(0, Math.min(100, Number(v)||0));
    var i = Math.round((v/100) * 6);
    applyIndex(i);
  };
  window.clientToValence = function(xClient){
    return idxToPercent(xToIdx(xClient));
  };

  // стартовое положение: из window.valence, если уже есть
  var startIdx = Math.round(((typeof window.valence==='number'?window.valence:50)/100) * 6);
  applyIndex(startIdx);
})();

function readImageFile(file, max=1200, quality=0.72){
  return new Promise((res,rej)=>{
    const R=new FileReader();
    R.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const cx=c.getContext('2d',{alpha:false,desynchronized:true});
        cx.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror=rej; img.src=R.result;
    };
    R.onerror=rej; R.readAsDataURL(file);
  });
}

}
function debounce(fn, ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); }; }

/* ===== Notes ===== */
const notesEl = document.getElementById('notes');

function persistNotes(){
  const iso = (datePicker?.value || todayISO()).slice(0,10);
  const entry = getEntry(iso);
  const text = (notesEl.value || '').trim();
  if (entry.notes !== text){
    entry.notes = text;
    putEntry(entry); // сохраняет в rt.diary.v2
    try{
      // пинаем другие вкладки/календарь
      localStorage.setItem('rt.diary.bump', Date.now().toString());
      localStorage.removeItem('rt.diary.bump');
    }catch(_){}
  }
}

let __notesTO = 0;

if (notesEl){
  // автосейв при наборе (без debounce)
  notesEl.addEventListener('input', ()=>{
    clearTimeout(__notesTO);
    __notesTO = setTimeout(persistNotes, 350);
  });

  // сейв при потере фокуса
  notesEl.addEventListener('blur', persistNotes);

  // Ctrl/Cmd+S
  window.addEventListener('keydown', (e)=>{
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
      e.preventDefault();
      persistNotes();
    }
  });
}


/* ===== Load/Save UI ===== */
const confirmMood=document.getElementById('confirmMood'); const saveAll=document.getElementById('saveAll');
function updateDayChip(dateISO){
  const today = todayISO();               // у тебя уже есть todayISO()
  const d = parseISO(dateISO);            // и parseISO()
  const weekday = new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(d).replace('.', '');
  const full = new Intl.DateTimeFormat('ru-RU',{day:'2-digit', month:'long', year:'numeric'}).format(d);
  const prefix = (dateISO===today) ? 'Сегодня' : 'Выбранный день';
  // dayChip — это твой элемент с датой (он уже объявлен выше в коде)
  dayChip.innerHTML = `<span class="muted">${prefix}</span> · <b style="letter-spacing:.3px">${weekday}, ${full}</b>`;
  const pdc = document.getElementById('photosDateChip');
if (pdc) {
  // тот же формат, что ты используешь в шапке
 pdc.textContent = new Intl.DateTimeFormat('ru-RU').format(new Date(dateISO));
}
}
function loadIntoUI(dateISO){
  const entry = getEntry(dateISO);
  updateDayChip(dateISO);
  applyValence(entry.wellness ?? 50, true);
  renderSE(entry);

// миниатюры из отдельного хранилища (страховка от старых записей)
if (entry.photos && entry.photos.face){
  const u = localStorage.getItem(photoKey('face', dateISO)) || '';
  faceThumb.src = u; faceThumb.hidden = !u;
} else { faceThumb.hidden = true; faceThumb.src = ''; }

if (entry.photos && entry.photos.body){
  const u = localStorage.getItem(photoKey('body', dateISO)) || '';
  bodyThumb.src = u; bodyThumb.hidden = !u;
} else { bodyThumb.hidden = true; bodyThumb.src = ''; }

  notesEl.value = entry.notes || '';
  setMoodSavedUI(!!entry.wellnessSaved);

  refreshCompare();
}

// дата, куда действительно пишем (выбранная в чипе/из параметра)
function selectedISO(){
  const q = new URLSearchParams(location.search).get('date');
  const fromSess = sessionStorage.getItem('rt.openDate');
  const dp = (typeof datePicker!=='undefined' && datePicker && datePicker.value) ? datePicker.value : '';
  return (dp || q || fromSess || todayISO()).slice(0,10);
}

confirmMood.addEventListener('click', ()=>{
  const iso = selectedISO();
  const v = Math.round(Math.max(0, Math.min(100, Number(window.valence)||0)));

  // 1) новая БД дневника — всегда нужна календарю и главной
  putV2Wellness(iso, v);

  // 2) старое локальное хранилище — чтобы остальной UI у тебя не сломался
  const entry = getEntry(iso);
  entry.wellness = v;
  entry.wellnessSaved = true;
  putEntry(entry);

  setMoodSavedUI(true);
});
const exportBtn = document.getElementById('exportJSON');
saveAll.addEventListener('click', ()=>{
  const date = datePicker.value || todayISO();
  const entry = getEntry(date);
  entry.notes = (notesEl.value||'').trim();
  putEntry(entry);
  try{
    const old = saveAll.textContent; saveAll.textContent = 'Сохранено ✓';
    setTimeout(()=>{ saveAll.textContent = old; }, 1200);
  }catch(_){}
});

if (exportBtn) exportBtn.addEventListener('click', ()=>{
  const data=localStorage.getItem(KEY) || '{}';
  const a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
  a.download='diary-export.json'; a.click();
});

/* ===== Init ===== */
function init(){
  const d = getStartISO();         // ?date=..., #date=..., иначе сегодня
  setDate(d, 0);                    // выставит datePicker + заполнит чип
  sessionStorage.removeItem('rt.openDate');

  // гарантируем, что baseline установлен (если ещё не был)
  const db = loadDB();
  if (!db.baseline) putEntry(getEntry(d));
}
(document.readyState === 'loading'
  ? document.addEventListener('DOMContentLoaded', init)
  : init());

</script>

<script>
(function(){
  const K_LEFT='rt_capsules_left', K_THRESH='rt_capsules_threshold', K_ON='rt_capsules_alert_enabled';
  const num=(k,d=0)=>{const v=parseInt(localStorage.getItem(k)||d,10);return Number.isFinite(v)?v:0;}
  const on =()=> (localStorage.getItem(K_ON)||'0')==='1';

  function text(){
    if(!on()) return null;
    const left=num(K_LEFT,0), thr=num(K_THRESH,0);
    if(left>0 && thr>0 && left<=thr) return `осталось ${left} капсул`;
    return null;
  }
  function render(){
    document.querySelectorAll('[data-stock-spot]').forEach(host=>{
      let el=host.querySelector('.pill-alert--stock');
      const t=text();
      if(!t){ el?.remove(); return; }
      if(!el){ el=document.createElement('span'); el.className='pill-alert pill-alert--stock'; host.appendChild(el); }
      el.textContent=t;
    });
  }
  window.addEventListener('storage', e=>{
    if([K_LEFT,K_THRESH,K_ON,'rt_capsules_left_bump','rt_capsules_threshold_bump','rt_capsules_alert_bump'].includes(e.key)) render();
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
  render();
  window.renderStockAlert=render;
})();
// ===== Режим цветовой подстройки страницы =====
const TINT_KEY = 'rt.moodTintOn';
const BASE_A = '#0B1220';  // твой дефолтный тёмный градиент
const BASE_B = '#0F1B2E';

function isTintOn(){
  return (localStorage.getItem(TINT_KEY) ?? '1') !== '0'; // по умолчанию вкл.
}
function setTintOn(on){
  try{ localStorage.setItem(TINT_KEY, on ? '1' : '0'); }catch(_){}
  // Пере-применяем цвета для текущего настроения
  const v = (typeof window.valence === 'number') ? window.valence : 50;
  if (typeof updateColorsByValence === 'function') updateColorsByValence(v);
}

// Инициализация и клик по тумблеру
document.addEventListener('DOMContentLoaded', ()=>{
  const sw = document.getElementById('tintSwitch');
  if (!sw) return;
  sw.setAttribute('aria-checked', isTintOn() ? 'true' : 'false');
  sw.addEventListener('click', ()=>{
    const next = !(sw.getAttribute('aria-checked') === 'true');
    sw.setAttribute('aria-checked', next ? 'true' : 'false');
    setTintOn(next);
  });
});

</script>
