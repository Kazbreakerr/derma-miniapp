
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>Календарь — Roaccutane Tracker</title>
      <style>
        :root{
          --text: #e8f1ff;
          --weak: #a9b5c2;
          --card: rgba(19,28,40,0.8);
          --border: rgba(255,255,255,.06);
        }
        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
          color:var(--text);
          background:#0d1724;
          background-image: radial-gradient(1200px 600px at 20% 0%, rgba(84,189,255,.08), transparent 40%),
                            radial-gradient(800px 400px at 80% 0%, rgba(52,245,180,.08), transparent 40%);
          min-height:100vh;
          display:flex; flex-direction:column;
        }
        .container{padding:24px 18px 90px; max-width:1200px; margin:0 auto; width:100%;}
        h1{margin:8px 0 14px; font-size:34px; letter-spacing:.4px;}
        .topbar{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:12px;}
        .nav-month{display:flex; align-items:center; gap:8px;}
        .ghost-btn{
          border:1px solid var(--border); background:linear-gradient(135deg,#111a26,#0f1a28); color:var(--text);
          border-radius:12px; padding:10px 12px; backdrop-filter: blur(6px);
          box-shadow:0 8px 30px rgba(0,0,0,.35);
        }
        .chip{
          font-size:14px; padding:8px 10px; border-radius:10px; border:1px solid var(--border);
          background:linear-gradient(135deg,#111a26,#0f1a28);
        }
        /* --- COMPACT SUMMARY BLOCK --- */
        .month-summary{
          display:flex; align-items:center; gap:12px; flex-wrap:wrap;
          padding:10px 12px; border-radius:14px;
          background:linear-gradient(135deg,#111a26,#0f1a28); border:1px solid var(--border);
          box-shadow:0 8px 30px rgba(0,0,0,.35);
          font-size:14px;
        }
        .month-summary .dot{width:6px; height:6px; border-radius:999px; background:#31d2a0; display:inline-block; margin:0 4px;}
        .month-summary .sep{opacity:.35; margin:0 6px;}
        .adh-bar{position:relative; flex:1 1 160px; height:6px; border-radius:999px;
                 background:linear-gradient(90deg, rgba(255,88,88,.25), rgba(255,196,0,.25), rgba(46,255,150,.25)); overflow:hidden; }
        .adh-bar>span{position:absolute; inset:0 0 0 auto; width:0%; background:linear-gradient(135deg,#0ec6ff,#1dde9b); border-radius:inherit;}
        .adh-val{min-width:max-content; font-weight:600;}

        /* Grid */
        .calendar{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:12px; box-shadow:0 8px 30px rgba(0,0,0,.35);}
        .week-head, .days{display:grid; grid-template-columns:repeat(7,1fr); gap:12px;}
        .week-head{padding:10px 6px 0; color:var(--weak); font-size:12px;}
        .day{
          -webkit-tap-highlight-color: transparent;
          border:1px solid var(--border); border-radius:16px; padding:10px;
          background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.02));
          color:var(--text); text-align:left; min-height:92px; position:relative; cursor:pointer;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
        }
        .day .num{font-weight:700; font-size:16px;}
        .day .meta{position:absolute; right:10px; bottom:8px; color:var(--weak); font-size:12px;}
        .day.selected{outline:2px solid #31d2a0; outline-offset:-2px;}
        .day.heat{background: linear-gradient(180deg, var(--heat-bg, transparent), transparent);
                    background-color: transparent; }
        .day.heat::before{ /* heat tint layer */
          content:''; position:absolute; inset:0; border-radius:16px;
          background: rgba(38, 188, 171, var(--heat-a));
          pointer-events:none;
        }
        .day.missed{
          background: linear-gradient(135deg,rgba(255,99,99,.14),rgba(255,160,160,.14));
        }

        /* Bottom sheet for day details (kept above nav without overlap) */
        .day-sheet{
          position:fixed; left:0; right:0; bottom:72px; /* keep above bottom nav */
          transform: translateY(16px); opacity:0; pointer-events:none;
          transition: .25s ease; z-index:20;
        }
        .day-sheet.open{transform:none; opacity:1; pointer-events:auto;}
        .day-card{
          margin:0 auto; max-width:920px; background:var(--card); border:1px solid var(--border);
          border-radius:16px; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,.35); backdrop-filter: blur(6px);
        }
        .day-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--weak);}
        .day-row b{color:var(--text)}
        .xbtn{margin-left:auto; border:none; background:transparent; color:var(--weak); cursor:pointer; font-size:20px;}

        /* bottom nav placeholder (not interactive target of this task) */
        .bottom-nav{
          position:fixed; left:0; right:0; bottom:0; height:64px; background:var(--card);
          border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center;
          z-index:10;
        }
        .bottom-nav .tab{text-align:center; color:var(--weak); font-size:12px;}
        .bottom-nav .tab.active{color:var(--text);}

        @media (max-width: 720px){
          .day{min-height:78px;}
          .container{padding:18px 12px 90px;}
          .month-summary{gap:10px; padding:8px 10px; font-size:13px;}
          .adh-bar{flex-basis:120px; height:5px;}
        }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>Календарь</h1>

        <div class="topbar">
          <div class="nav-month">
            <button id="prev" class="ghost-btn">‹</button>
            <div id="month-title" class="chip">Месяц</div>
            <button id="next" class="ghost-btn">›</button>
          </div>
          <button id="today" class="ghost-btn">Сегодня</button>
        </div>

        <!-- Compact summary in ONE small block -->
        <div class="month-summary" aria-live="polite">
          <span>💊 <b id="sum-mg">0 мг</b></span>
          <span class="sep">•</span>
          <span>⏰ пропусков <b id="miss-days">0</b></span>
          <span class="sep">•</span>
          <span class="adh-val">соблюдение <b id="adh-val">0%</b></span>
          <div class="adh-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <span id="adh-bar-fill"></span>
          </div>
        </div>

        <div class="calendar" id="calendar">
          <div id="grid"></div>
        </div>
      </div>

      <!-- Day sheet (opens above bottom nav, doesn't cover it) -->
      <div class="day-sheet" id="day-sheet">
        <div class="day-card">
          <div class="day-row">
            <b id="ds-date">—</b>
            <button id="ds-close" class="xbtn" aria-label="Закрыть">✕</button>
          </div>
          <div class="day-row" style="margin-top:8px">
            <span>Самочувствие: <b id="ds-mood">—</b></span>
            <span>Доза: <b id="ds-dose">—</b></span>
          </div>
          <div class="day-row" style="margin-top:6px">
            <span>Комментарий: <b id="ds-note">—</b></span>
          </div>
        </div>
      </div>

      <nav class="bottom-nav">
        <div class="tab">Главная</div>
        <div class="tab active">Календарь</div>
        <div class="tab">Профиль</div>
        <div class="tab">Фотодневник</div>
        <div class="tab">Анализы</div>
      </nav>


<script>
// --- Persistent storage key (shared across pages)
const STORE_KEY = 'rt.diary.v1'; // expected: { 'YYYY-MM-DD': { dose: number, missed: boolean, mood: -3..+3 } }

// --- Helpers
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function readStore() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  } catch(e) {
    return {};
  }
}
function saveStore(obj) {
  localStorage.setItem(STORE_KEY, JSON.stringify(obj || {}));
}

// --- Calendar state
let view = new Date();
view.setDate(1); // pin to first of month

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function daysInMonth(year, monthIdx) {
  return new Date(year, monthIdx + 1, 0).getDate();
}

function getMonthStats(year, monthIdx) {
  const store = readStore();
  const dim = daysInMonth(year, monthIdx);
  let sumMg = 0;
  let takenDays = 0;
  let missDays = 0;
  for (let d=1; d<=dim; d++) {
    const key = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = store[key];
    if (!rec) continue;
    const dose = Number(rec.dose||0);
    const missed = !!rec.missed;
    if (missed) { missDays++; continue; }
    if (dose > 0) { takenDays++; sumMg += dose; }
  }
  const denom = takenDays + missDays;
  const adherence = denom ? Math.round((takenDays/denom)*100) : 0;
  return {sumMg, missDays, adherence};
}

function monthTitle(d) {
  const opt = { month: 'long', year: 'numeric' };
  return d.toLocaleDateString('ru-RU', opt);
}

function renderHeader() {
  $('#month-title').textContent = monthTitle(view);
}

function doseToHeat(dose) {
  // 0 → transparent, then light tint; 100mg+ → strong tint
  const clamped = Math.max(0, Math.min(100, dose));
  const alpha = 0.08 + 0.22 * (clamped/100); // 0.08..0.30
  return alpha.toFixed(3);
}

function renderSummary() {
  const { sumMg, missDays, adherence } = getMonthStats(view.getFullYear(), view.getMonth());
  $('#sum-mg').textContent = `${sumMg} мг`;
  $('#miss-days').textContent = `${missDays}`;
  $('#adh-val').textContent = `${adherence}%`;
  // micro progress bar
  const bar = $('#adh-bar-fill');
  bar.style.width = `${adherence}%`;
  bar.setAttribute('aria-valuenow', adherence);
}

function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  const year = view.getFullYear();
  const month = view.getMonth();
  const dim = daysInMonth(year, month);

  // Week header
  const week = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const head = document.createElement('div');
  head.className = 'week-head';
  week.forEach(w => {
    const el = document.createElement('div');
    el.textContent = w;
    head.appendChild(el);
  });
  grid.appendChild(head);

  // Days 1..dim
  const store = readStore();
  for (let d=1; d<=dim; d++) {
    const box = document.createElement('button');
    box.type = 'button';
    box.className = 'day';
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = store[key] || {};
    const dose = Number(rec.dose || 0);
    const missed = !!rec.missed;
    const mood = rec.mood ?? null;

    // heatmap background by dose
    if (!missed && dose > 0) {
      const a = doseToHeat(dose);
      box.style.setProperty('--heat-a', a);
      box.classList.add('heat');
    }
    if (missed) {
      box.classList.add('missed');
    }
    // content
    box.innerHTML = `<span class="num">${d}</span>
                     <span class="meta">${missed ? 'пропуск' : (dose>0? (dose+' мг') : '—')}</span>`;

    box.addEventListener('click', () => {
      $$('.day.selected').forEach(el => el.classList.remove('selected'));
      box.classList.add('selected');
      // open mini sheet without overlapping nav
      openDaySheet(key, rec);
    });

    grid.appendChild(box);
  }
}

function openDaySheet(key, rec) {
  const sheet = $('#day-sheet');
  const dateLabel = new Date(key).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  $('#ds-date').textContent = dateLabel;
  $('#ds-dose').textContent = rec?.missed ? 'пропуск' : (rec?.dose ? rec.dose + ' мг' : '—');
  $('#ds-mood').textContent = (rec?.mood ?? '—');
  $('#ds-note').textContent = rec?.note || 'Записей нет. Нажмите и удерживайте ячейку в календаре для редактирования.';
  sheet.classList.add('open');
}
function closeDaySheet() { $('#day-sheet').classList.remove('open'); }

function refreshAll() {
  renderHeader();
  renderSummary();
  renderGrid();
}

// --- Nav
$('#prev').addEventListener('click', () => { view.setMonth(view.getMonth()-1); refreshAll(); });
$('#next').addEventListener('click', () => { view.setMonth(view.getMonth()+1); refreshAll(); });
$('#today').addEventListener('click', () => {
  const now = new Date();
  view = new Date(now.getFullYear(), now.getMonth(), 1);
  refreshAll();
});

// close sheet
$('#ds-close').addEventListener('click', closeDaySheet);

// Initial
refreshAll();

// Recompute summary when storage changes from other pages
window.addEventListener('storage', (e) => {
  if (e.key === STORE_KEY) { renderSummary(); renderGrid(); }
});
</script>

    </body>
    </html>
